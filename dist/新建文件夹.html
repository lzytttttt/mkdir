        '.lv12-mini-folder svg{display:block;width:100%;height:100%;animation:lv12-bob .9s ease-in-out infinite alternate;}',
        '@keyframes lv12-bob{from{transform:translateY(0) rotate(-3deg);}to{transform:translateY(-3px) rotate(3deg);}}',
        '.lv12-mini-folder.lv12-pop{animation:lv12-pop .5s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv12-pop{0%{transform:scale(.2);opacity:0;}60%{transform:scale(1.2);opacity:1;}100%{transform:scale(1);}}',
        '.lv12-mini-folder.lv12-grabbed{z-index:60;cursor:grabbing;',
        ' filter:drop-shadow(0 0 20px rgba(255,212,92,1)) drop-shadow(0 12px 18px rgba(0,0,0,.6));}',
        '.lv12-mini-folder.lv12-back{animation:lv12-back .4s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv12-back{0%{transform:scale(1.25);}100%{transform:scale(1);}}',
        '.lv12-mini-folder.lv12-escape{animation:lv12-escape .44s ease-out forwards;}',
        '@keyframes lv12-escape{0%{transform:scale(1);opacity:1;}45%{transform:scale(2.2) rotate(8deg);opacity:1;}',
        ' 100%{transform:scale(2.9) rotate(-8deg);opacity:0;}}',
        '.lv12-born{filter:drop-shadow(0 0 26px rgba(255,212,92,.9)) drop-shadow(0 16px 20px rgba(0,0,0,.5));}',
        /* 迷你右键菜单 */
        '.lv12-menu{position:absolute;z-index:50;min-width:94px;padding:4px;border-radius:9px;',
        ' background:rgba(246,248,255,.95);color:#24273f;border:1px solid rgba(255,255,255,.85);',
        ' box-shadow:0 12px 28px rgba(0,0,0,.45);animation:lv12-menu-in .14s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv12-menu-in{from{opacity:0;transform:scale(.9) translateY(-3px);}to{opacity:1;transform:scale(1);}}',
        '.lv12-menu-item{display:flex;align-items:center;gap:7px;height:26px;padding:0 7px;border-radius:5px;',
        ' cursor:default;font-size:10px;white-space:nowrap;}',
        '.lv12-menu-item .nf-ico{width:15px;height:15px;}',
        '.lv12-menu-item:hover{background:rgba(91,124,250,.18);box-shadow:inset 0 0 0 1px rgba(91,124,250,.22);}',
        '.lv12-menu-item.lv12-cancel{color:#b83b52;opacity:.82;}'
      ].join(''));

      function miniIcon(name, label) {
        return '<div class="lv12-icon">' + NF.icons.svg(name) + '<span>' + label + '</span></div>';
      }

      /* ---------------- 迷你窗口 ---------------- */
      var aura = document.createElement('div');
      aura.className = 'lv12-aura';
      ctx.root.appendChild(aura);

      win = document.createElement('div');
      win.className = 'lv12-window';
      win.dataset.t = 'mini-window';
      win.dataset.phase = phase;
      win.style.left = winHome.x + 'px';
      win.style.top = winHome.y + 'px';
      win.innerHTML =
        '<div class="lv12-titlebar"><i></i><i></i><i></i>' +
        '<span class="lv12-title">' + NF.icons.svg('folder') + '<em>新建文件夹</em></span>' +
        '<span class="lv12-win-x">×</span></div>' +
        '<div class="lv12-body">' +
        '<div class="lv12-screen">' +
        '<div class="lv12-wall"></div><div class="lv12-stars"></div>' +
        '<div class="lv12-icons">' +
        miniIcon('folder', '新建文件夹') + miniIcon('fileText', '文档') + miniIcon('terminal', '终端') +
        '</div>' +
        '<div class="lv12-task">' +
        '<span class="lv12-start"></span>' +
        NF.icons.svg('folder') + NF.icons.svg('terminal') +
        '<span class="lv12-jar">' + NF.icons.svg('jar') + '<b>1</b></span>' +
        '<span class="lv12-mascot">' + NF.icons.svg('folderFace') + '</span>' +
        '</div>' +
        '<div class="lv12-scan"></div>' +
        '</div>' +
        '<div class="lv12-glass"></div>' +
        '</div>';
      ctx.root.appendChild(win);
      bodyEl = win.querySelector('.lv12-body');
      ctx.qa('l12', ctx.root);

      /* ---------------- 迷你右键菜单 ---------------- */
      function closeMiniMenu() {
        if (menuOff) { menuOff(); menuOff = null; }
        if (miniMenu && miniMenu.parentNode) miniMenu.remove();
        miniMenu = null;
      }
      ctx.onCleanup(closeMiniMenu);

      function openMiniMenu(x, y) {
        if (completed) return;
        closeMiniMenu();
        miniMenu = document.createElement('div');
        miniMenu.className = 'lv12-menu';
        miniMenu.dataset.t = 'mini-menu';
        miniMenu.style.left = Math.round(OS.clamp(x, 10, W - 120)) + 'px';
        miniMenu.style.top = Math.round(OS.clamp(y, 10, H - 90)) + 'px';
        miniMenu.innerHTML =
          '<div class="lv12-menu-item" data-t="mini-item-new">' + NF.icons.svg('folder') + '<span>新建</span></div>' +
          '<div class="lv12-menu-item lv12-cancel" data-t="mini-item-cancel">' + NF.icons.svg('error') + '<span>取消</span></div>';
        ctx.root.appendChild(miniMenu);

        var newItem = miniMenu.querySelector('[data-t="mini-item-new"]');
        var cancelItem = miniMenu.querySelector('[data-t="mini-item-cancel"]');
        ctx.on(newItem, 'click', function (e) {
          e.stopPropagation();
          if (!miniMenu) return;
          closeMiniMenu();
          createMiniFolder(false);
        });
        ctx.on(cancelItem, 'click', function (e) {
          e.stopPropagation();
          closeMiniMenu();
          NF.Audio.play('click', { volume: 0.5 });
        });
        NF.Audio.play('open', { volume: 0.45 });

        menuOff = ctx.on(document, 'pointerdown', function (e) {
          if (miniMenu && !miniMenu.contains(e.target)) closeMiniMenu();
        }, true);
      }

      ctx.on(win, 'contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (completed) return;
        var rr = OS.rect(ctx.root);
        openMiniMenu(e.clientX - rr.left, e.clientY - rr.top);
      });
      ctx.on(ctx.root, 'contextmenu', function (e) {
        if (win.contains(e.target)) return;
        e.preventDefault();
      });

      /* ---------------- 迷你文件夹 ---------------- */
      function createMiniFolder(fromDemo) {
        if (miniFolder || completed) return;
        phase = 'folder';
        win.dataset.phase = phase;
        miniFolder = document.createElement('div');
        miniFolder.className = 'lv12-mini-folder lv12-pop';
        miniFolder.dataset.t = 'mini-folder';
        miniFolder.innerHTML = NF.icons.svg('folder');
        miniFolder.style.left = SLOT.x + 'px';
        miniFolder.style.top = SLOT.y + 'px';
        bodyEl.appendChild(miniFolder);

        NF.Audio.play('pop');
        var c = OS.center(miniFolder);
        NF.FX.sparkle(c.x, c.y, '#ffd45c');
        NF.FX.burst(c.x, c.y, {
          count: 16, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 5, gravity: 0.18
        });
        ctx.timer(520, function () { if (miniFolder) miniFolder.classList.remove('lv12-pop'); });
        bindMiniFolderDrag();
        if (!fromDemo) {
          ctx.timer(900, function () { if (!completed) ctx.replayHint(); });
        }
      }

      function bindMiniFolderDrag() {
        ctx.on(miniFolder, 'pointerdown', function (e) {
          if (e.button !== 0 || completed || dragging || !miniFolder) return;
          e.preventDefault();
          e.stopPropagation();

          var st = { sx: e.clientX, sy: e.clientY, moved: false, el: miniFolder, local: null };
          var offMove = null;
          var offUp = null;

          function cleanup() {
            if (offMove) { offMove(); offMove = null; }
            if (offUp) { offUp(); offUp = null; }
          }

          function onMove(ev) {
            if (!st || !st.el) return;
            var dx = ev.clientX - st.sx;
            var dy = ev.clientY - st.sy;
            if (!st.moved) {
              if (Math.hypot(dx, dy) < 4) return;
              st.moved = true;
              beginDrag(st);
            }
            st.el.style.left = (st.local.x + dx) + 'px';
            st.el.style.top = (st.local.y + dy) + 'px';
            st.el.style.transform = 'rotate(' + OS.clamp(dx * 0.04, -9, 9).toFixed(2) + 'deg) scale(1.06)';
          }

          function onUp(ev) {
            cleanup();
            if (!st) return;
            var moved = st.moved;
            var mf = st.el;
            st = null;
            if (!moved || !mf) return;
            finishDrag(mf, ev);
          }

          offMove = ctx.on(document, 'pointermove', onMove, true);
          offUp = ctx.on(document, 'pointerup', onUp, true);
        });
      }

      function beginDrag(st) {
        dragging = true;
        phase = 'dragging';
        win.dataset.phase = phase;
        var r = miniFolder.getBoundingClientRect();
        var rr = OS.rect(ctx.root);
        miniFolder.style.position = 'absolute';
        miniFolder.style.left = Math.round(r.left - rr.left) + 'px';
        miniFolder.style.top = Math.round(r.top - rr.top) + 'px';
        ctx.root.appendChild(miniFolder);
        miniFolder.classList.add('lv12-grabbed');
        st.local = {
          x: parseFloat(miniFolder.style.left) || 0,
          y: parseFloat(miniFolder.style.top) || 0
        };
        NF.Audio.play('paper', { volume: 0.55 });
      }

      function finishDrag(el, ev) {
        dragging = false;
        var wr = OS.rect(win);
        var inside = ev.clientX >= wr.left && ev.clientX <= wr.right &&
          ev.clientY >= wr.top && ev.clientY <= wr.bottom;
        if (inside) returnToWindow(el);
        else escapeSuccess(el);
      }

      function returnToWindow(el) {
        phase = 'folder';
        win.dataset.phase = phase;
        el.classList.remove('lv12-grabbed');
        var bodyR = bodyEl.getBoundingClientRect();
        var rr = OS.rect(ctx.root);
        el.style.transition = 'left .3s cubic-bezier(.34,1.56,.64,1),top .3s cubic-bezier(.34,1.56,.64,1),transform .3s ease';
        el.style.left = Math.round(bodyR.left - rr.left + SLOT.x) + 'px';
        el.style.top = Math.round(bodyR.top - rr.top + SLOT.y) + 'px';
        el.style.transform = '';
        NF.Audio.play('thud', { volume: 0.4 });
        ctx.timer(330, function () {
          if (!el) return;
          el.style.transition = '';
          bodyEl.appendChild(el);
          el.style.left = SLOT.x + 'px';
          el.style.top = SLOT.y + 'px';
          el.style.transform = '';
          el.classList.add('lv12-back');
          ctx.timer(430, function () { if (el) el.classList.remove('lv12-back'); });
        });
      }

      function escapeSuccess(el) {
        if (completed) return;
        completed = true;
        phase = 'done';
        win.dataset.phase = phase;
        el.classList.remove('lv12-grabbed');
        var r = OS.rect(el);
        var rr = OS.rect(ctx.root);
        var cx = r.left + r.width / 2;
        var cy = r.top + r.height / 2;
        el.classList.add('lv12-escape');
        NF.Audio.play('whoosh', { volume: 0.6 });
        NF.Audio.play('sparkle', { volume: 0.8 });
        NF.FX.flash('rgba(255,255,255,.55)', 220);
        NF.FX.burst(cx, cy, {
          count: 40, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#7ef0c0'], speed: 11, gravity: 0.2
        });
        ctx.timer(430, function () {
          if (el && el.parentNode) el.remove();
          miniFolder = null;
          createdEl = ctx.createdFolder({
            x: Math.round(cx - rr.left - 38),
            y: Math.round(cy - rr.top - 32),
            label: '新建文件夹',
            testid: 'created-folder'
          });
          createdEl.classList.add('lv12-born');
          NF.Audio.play('pop');
          var c = OS.center(createdEl);
          NF.FX.sparkle(c.x, c.y, '#ffd45c');
          ctx.timer(560, function () { ctx.complete({ el: createdEl }); });
        });
      }

      /* ---------------- 迷你窗口每 9 秒左右横移 ---------------- */
      ctx.interval(9000, function () {
        if (completed) return;
        closeMiniMenu();
        var nx = OS.clamp(winHome.x + OS.pick([-40, 40]) + OS.rand(-6, 6),
          16, Math.max(16, W - WIN_W - 16));
        win.style.transition = 'left 3.2s cubic-bezier(.4,0,.2,1)';
        win.style.left = Math.round(nx) + 'px';
      });

      /* ---------------- 幽灵演示 ---------------- */
      demo = async function () {
        if (completed || dragging) return;
        if (!miniFolder) {
          var wc = OS.center(win);
          var rr = OS.rect(ctx.root);
          await NF.Ghost.play([
            { move: '[data-t="mini-window"]', dur: 520 },
            { highlight: '[data-t="mini-window"]', dur: 620 },
            {
              click: 'right', target: [wc.x, wc.y], after: 240,
              do: function () { openMiniMenu(wc.x - rr.left, wc.y - rr.top); }
            },
            { move: '[data-t="mini-item-new"]', dur: 420 },
            { highlight: '[data-t="mini-item-new"]', dur: 560 },
            {
              click: 'left', target: '[data-t="mini-item-new"]', after: 280,
              do: function () { closeMiniMenu(); createMiniFolder(true); }
            },
            { move: '[data-t="mini-folder"]', dur: 420 },
            { highlight: '[data-t="mini-folder"]', dur: 620 },
            {
              drag: {
                from: '[data-t="mini-folder"]',
                to: [Math.round(W * 0.75), Math.round(H * 0.62)],
                dur: 1000, after: 200
              }
            },
            { wait: 180 }
          ]);
        } else {
          await NF.Ghost.play([
            { highlight: '[data-t="mini-folder"]', dur: 600 },
            {
              drag: {
                from: '[data-t="mini-folder"]',
                to: [Math.round(W * 0.75), Math.round(H * 0.62)],
                dur: 1000, after: 200
              }
            },
            { wait: 150 }
          ]);
        }
      };
      ctx.hint(demo);
    }
  });
})();

</script>
<script data-src="js/levels/l13.js">
/* js/levels/l13.js */
/* 第 13 关：任务栏抽屉 —— 新建命令被封，最后一条掉进任务栏上沿的暗格里，把抽屉拉出来 */
(function () {
  'use strict';
  var ID = 13;
  var OS = NF.OS;
  var demo = null;

  NF.Game.registerLevel({
    id: ID,
    icon: 'menu',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var HANDLE_H = 18;
      var MAX_H = 260;
      var OPEN_H = 200;
      var THRESHOLD = 148;   // 拖过这个高度就保持打开

      var DRAWER_W = 460;
      var drawer = null;
      var handle = null;
      var tray = null;
      var folderEl = null;
      var createdEl = null;
      var height = HANDLE_H;
      var baseH = HANDLE_H;
      var drawerOpen = false;
      var completed = false;
      var retractTimer = 0;
      var handleDrag = null;
      var folderSt = null;

      ctx.style([
        '.lv13-drawer{position:absolute;bottom:0;width:' + DRAWER_W + 'px;overflow:hidden;z-index:14;',
        ' border-radius:16px 16px 0 0;border:1px solid rgba(160,150,255,.3);border-bottom:none;',
        ' background:linear-gradient(180deg,rgba(30,26,60,.97),rgba(13,11,30,.985));',
        ' box-shadow:0 -18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);',
        ' transition:height .32s cubic-bezier(.34,1.56,.64,1);will-change:height;}',
        '.lv13-drawer.lv13-dragging{transition:none;}',
        '.lv13-drawer.lv13-slow{transition:height 1.4s cubic-bezier(.4,0,.2,1);}',
        '.lv13-handle{position:absolute;left:0;right:0;top:0;height:' + HANDLE_H + 'px;z-index:2;',
        ' display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;',
        ' background:linear-gradient(180deg,rgba(255,240,190,.32),rgba(255,201,77,.14) 58%,rgba(12,10,28,0));}',
        '.lv13-handle:active{cursor:grabbing;}',
        '.lv13-handle::before{content:"";position:absolute;left:10px;right:10px;top:0;height:2px;border-radius:2px;',
        ' background:linear-gradient(90deg,transparent,rgba(255,224,138,.95),transparent);}',
        '.lv13-handle::after{content:"";position:absolute;inset:0;pointer-events:none;',
        ' background:linear-gradient(90deg,transparent,rgba(255,201,77,.2),transparent);',
        ' animation:lv13-shine 2.6s ease-in-out infinite;}',
        '@keyframes lv13-shine{0%,100%{opacity:.22;}50%{opacity:.85;}}',
        '.lv13-dots{display:grid;grid-template-columns:repeat(3,4px);gap:3px;pointer-events:none;opacity:.8;}',
        '.lv13-dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,244,210,.95);',
        ' box-shadow:0 0 6px rgba(255,212,92,.85);}',
        '.lv13-chevron{position:absolute;right:12px;top:3px;width:12px;height:12px;opacity:.72;pointer-events:none;}',
        '.lv13-chevron svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(255,212,92,.8));}',
        '.lv13-tray{position:absolute;left:0;right:0;top:' + HANDLE_H + 'px;bottom:0;overflow:hidden;',
        ' background:radial-gradient(ellipse at 50% 100%,rgba(255,201,77,.13),transparent 62%),',
        ' linear-gradient(180deg,rgba(10,9,26,.6),rgba(6,5,18,.92));}',
        '.lv13-shelf{position:absolute;left:24px;right:24px;bottom:14px;height:2px;border-radius:2px;',
        ' background:linear-gradient(90deg,transparent,rgba(160,150,255,.35),transparent);}',
        '.lv13-tray-glow{position:absolute;left:50%;top:50%;width:260px;height:120px;margin:-60px 0 0 -130px;',
        ' border-radius:50%;pointer-events:none;filter:blur(6px);',
        ' background:radial-gradient(circle,rgba(255,201,77,.24),transparent 68%);',
        ' animation:lv13-breathe 2.4s ease-in-out infinite alternate;}',
        '@keyframes lv13-breathe{from{opacity:.5;transform:scale(.94);}to{opacity:1;transform:scale(1.06);}}',
        '.lv13-folder{position:absolute;left:50%;bottom:26px;width:80px;margin-left:-40px;z-index:2;',
        ' cursor:grab;touch-action:none;',
        ' filter:drop-shadow(0 0 18px rgba(255,212,92,.85)) drop-shadow(0 10px 14px rgba(0,0,0,.5));}',
        '.lv13-folder .lv13-folder-ico{width:76px;height:76px;margin:0 auto;',
        ' animation:lv13-folder-bob 1.6s ease-in-out infinite alternate;}',
        '.lv13-folder svg{display:block;width:100%;height:100%;}',
        '@keyframes lv13-folder-bob{from{transform:translateY(0) rotate(-2deg);}to{transform:translateY(-5px) rotate(2deg);}}',
        '.lv13-folder span{display:block;margin-top:4px;text-align:center;font-size:11px;color:#ffe9a8;',
        ' text-shadow:0 2px 6px rgba(0,0,0,.75);white-space:nowrap;}',
        '.lv13-folder.lv13-hot{filter:drop-shadow(0 0 26px rgba(255,212,92,1)) drop-shadow(0 12px 18px rgba(0,0,0,.55));}',
        '.lv13-folder.lv13-grabbed{cursor:grabbing;z-index:60;',
        ' filter:drop-shadow(0 0 24px rgba(255,212,92,1)) drop-shadow(0 14px 20px rgba(0,0,0,.6));}',
        '.lv13-folder.lv13-pop{animation:lv13-pop .45s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv13-pop{0%{transform:scale(1.5);opacity:.4;}100%{transform:scale(1);opacity:1;}}',
        '.lv13-folder.lv13-open{animation:lv13-open .36s ease-out forwards;}',
        '@keyframes lv13-open{0%{transform:scale(1);opacity:1;}55%{transform:scale(1.5) rotate(6deg);opacity:1;}',
        ' 100%{transform:scale(.2) rotate(-10deg);opacity:0;}}',
        '.lv13-born{filter:drop-shadow(0 0 26px rgba(255,212,92,.9)) drop-shadow(0 16px 20px rgba(0,0,0,.5));}',
        '.lv13-nudge{animation:lv13-nudge .35s ease;}',
        '@keyframes lv13-nudge{0%,100%{transform:translateX(0);}30%{transform:translateX(-4px);}',
        ' 60%{transform:translateX(4px);}}'
      ].join(''));

      /* ---------------- 抽屉本体 ---------------- */
      drawer = document.createElement('div');
      drawer.className = 'lv13-drawer';
      drawer.dataset.t = 'drawer';
      drawer.dataset.open = '0';
      drawer.style.left = Math.round(W / 2 - DRAWER_W / 2) + 'px';
      drawer.style.height = HANDLE_H + 'px';
      drawer.innerHTML =
        '<div class="lv13-tray">' +
        '<div class="lv13-tray-glow"></div>' +
        '<div class="lv13-shelf"></div>' +
        '<div class="lv13-folder" data-t="drawer-folder">' +
        '<div class="lv13-folder-ico">' + NF.icons.svg('folder') + '</div>' +
        '<span>新建文件夹</span>' +
        '</div>' +
        '</div>' +
        '<div class="lv13-handle" data-t="drawer-handle">' +
        '<span class="lv13-dots"><i></i><i></i><i></i><i></i><i></i><i></i></span>' +
        '<span class="lv13-chevron">' + NF.icons.svg('arrowUp') + '</span>' +
        '</div>';
      ctx.root.appendChild(drawer);
      tray = drawer.querySelector('.lv13-tray');
      handle = drawer.querySelector('[data-t="drawer-handle"]');
      folderEl = drawer.querySelector('[data-t="drawer-folder"]');

      ctx.qa('l13', ctx.root);

      function setHeight(h) {
        height = Math.max(HANDLE_H, Math.min(MAX_H, Math.round(h)));
        drawer.style.height = height + 'px';
      }

      function clearRetract() {
        if (retractTimer) { clearTimeout(retractTimer); retractTimer = 0; }
      }

      function resetRetract() {
        clearRetract();
        if (completed || !drawerOpen) return;
        retractTimer = ctx.timer(10000, autoRetract);
      }

      function openDrawer(byUser) {
        if (completed) return;
        drawerOpen = true;
        drawer.dataset.open = '1';
        if (height < OPEN_H) setHeight(OPEN_H);
        NF.Audio.play('open', { volume: 0.6 });
        NF.Audio.play('select', { volume: 0.45 });
        resetRetract();
        if (byUser) {
          ctx.timer(700, function () { if (!completed) ctx.replayHint(); });
        }
      }

      function autoRetract() {
        if (completed || !drawerOpen) return;
        drawerOpen = false;
        drawer.dataset.open = '0';
        drawer.classList.add('lv13-slow');
        setHeight(HANDLE_H);
        NF.Audio.play('close', { volume: 0.45 });
        ctx.timer(1500, function () { drawer.classList.remove('lv13-slow'); });
      }

      function springBack() {
        drawerOpen = false;
        drawer.dataset.open = '0';
        setHeight(HANDLE_H);
        NF.Audio.play('deny', { volume: 0.5 });
        NF.Audio.play('thud', { volume: 0.4 });
        var c = OS.center(drawer);
        NF.FX.dust(c.x, c.y);
      }

      /* ---------------- 按住把手向上拖 ---------------- */
      handleDrag = OS.makeDraggable(handle, {
        threshold: 2,
        canStart: function () { return !completed; },
        onStart: function () {
          baseH = height;
          clearRetract();
          drawer.classList.add('lv13-dragging');
          drawer.classList.remove('lv13-slow');
          NF.Audio.play('hover', { volume: 0.25 });
        },
        onMove: function (e, st) {
          var h = baseH - st.dy;
          if (h > MAX_H) h = MAX_H + (h - MAX_H) * 0.22;   // 拉过头有橡皮筋阻尼
          setHeight(h);
          drawer.dataset.open = height >= THRESHOLD ? '1' : '0';
        },
        onEnd: function () {
          drawer.classList.remove('lv13-dragging');
          if (completed) return;
          if (height >= THRESHOLD) openDrawer(true);
          else springBack();
        }
      });

      /* ---------------- 抽屉里的文件夹 ---------------- */
      function bindFolder() {
        ctx.on(folderEl, 'pointerdown', function (e) {
          if (e.button !== 0 || completed || !drawerOpen) return;
          if (height < THRESHOLD) return;
          e.preventDefault();
          e.stopPropagation();
          clearRetract();
          folderEl.classList.add('lv13-hot');

          var st = { sx: e.clientX, sy: e.clientY, moved: false, local: null };
          folderSt = st;
          var offMove = null;
          var offUp = null;

          function cleanup() {
            if (offMove) { offMove(); offMove = null; }
            if (offUp) { offUp(); offUp = null; }
            folderSt = null;
            if (folderEl) folderEl.classList.remove('lv13-hot');
          }

          function onMove(ev) {
            if (!folderEl) return;
            var dx = ev.clientX - st.sx;
            var dy = ev.clientY - st.sy;
            if (!st.moved) {
              if (Math.hypot(dx, dy) < 4) return;
              st.moved = true;
              beginFolderDrag(st);
            }
            if (!st.local) return;
            folderEl.style.left = (st.local.x + dx) + 'px';
            folderEl.style.top = (st.local.y + dy) + 'px';
            folderEl.style.transform = 'rotate(' + OS.clamp(dx * 0.03, -8, 8).toFixed(2) + 'deg) scale(1.05)';
          }

          function onUp(ev) {
            cleanup();
            if (!st) return;
            if (!st.moved) {
              successAt(OS.center(folderEl).x, OS.center(folderEl).y);
              return;
            }
            finishFolderDrag(ev);
          }

          offMove = ctx.on(document, 'pointermove', onMove, true);
          offUp = ctx.on(document, 'pointerup', onUp, true);
        });
      }

      function beginFolderDrag(st) {
        var r = folderEl.getBoundingClientRect();
        var rr = OS.rect(ctx.root);
        folderEl.style.left = Math.round(r.left - rr.left) + 'px';
        folderEl.style.top = Math.round(r.top - rr.top) + 'px';
        folderEl.style.bottom = 'auto';
        folderEl.style.marginLeft = '0';
        ctx.root.appendChild(folderEl);
        folderEl.classList.add('lv13-grabbed');
        st.local = {
          x: parseFloat(folderEl.style.left) || 0,
          y: parseFloat(folderEl.style.top) || 0
        };
        NF.Audio.play('paper', { volume: 0.55 });
        clearRetract();
      }

      function finishFolderDrag(ev) {
        if (!folderEl) return;
        var dr = OS.rect(drawer);
        if (ev.clientY < dr.top - 8) {
          var c = OS.center(folderEl);
          successAt(c.x, c.y);
        } else {
          returnFolder();
        }
      }

      function returnFolder() {
        if (!folderEl) return;
        folderEl.classList.remove('lv13-grabbed');
        folderEl.style.transform = '';
        folderEl.style.left = '';
        folderEl.style.top = '';
        folderEl.style.bottom = '';
        folderEl.style.marginLeft = '';
        tray.appendChild(folderEl);
        NF.Audio.play('thud', { volume: 0.4 });
        var c = OS.center(drawer);
        NF.FX.dust(c.x, c.y);
        folderEl.classList.add('lv13-pop');
        ctx.timer(480, function () { if (folderEl) folderEl.classList.remove('lv13-pop'); });
        resetRetract();
      }

      function successAt(cx, cy) {
        if (completed || !folderEl) return;
        completed = true;
        drawer.dataset.open = '1';
        clearRetract();
        folderEl.classList.remove('lv13-grabbed');
        folderEl.classList.add('lv13-open');
        var rr = OS.rect(ctx.root);
        NF.Audio.play('snap');
        NF.Audio.play('sparkle', { volume: 0.9 });
        NF.FX.flash('rgba(255,244,205,.5)', 220);
        NF.FX.burst(cx, cy, {
          count: 40, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#8a6cff'], speed: 11, gravity: 0.2
        });
        NF.FX.ripple(cx, cy, { color: 'rgba(255,212,92,.9)', radius: 70 });

        ctx.timer(380, function () {
          if (folderEl && folderEl.parentNode) folderEl.remove();
          folderEl = null;
          createdEl = ctx.createdFolder({
            x: Math.round(cx - rr.left - 38),
            y: Math.round(cy - rr.top - 32),
            label: '新建文件夹',
            testid: 'created-folder'
          });
          createdEl.classList.add('lv13-born');
          NF.Audio.play('pop');
          var c = OS.center(createdEl);
          NF.FX.sparkle(c.x, c.y, '#ffd45c');
          ctx.timer(560, function () { ctx.complete({ el: createdEl }); });
        });
      }

      bindFolder();

      /* ---------------- 被封死的右键 / 快捷键 ---------------- */
      ctx.on(ctx.root, 'contextmenu', function (e) {
        e.preventDefault();
        if (completed) return;
        NF.Audio.play('deny');
        ctx.toast({ icon: 'lock', title: '新建已被锁定', kind: 'error', ms: 1400 });
        NF.OS.pulse(drawer, 'lv13-nudge', 380);
      });

      ctx.on(window, 'keydown', function (e) {
        if (completed) return;
        if (OS.matchCombo(e, 'Ctrl+Shift+F')) {
          e.preventDefault();
          e.stopPropagation();
          NF.Audio.play('deny');
          ctx.toast({ icon: 'key', title: '快捷键已失效', kind: 'error', ms: 1400 });
          NF.OS.pulse(drawer, 'lv13-nudge', 380);
        }
      });

      /* ---------------- 幽灵演示 ---------------- */
      demo = async function () {
        if (completed) return;
        if (!drawerOpen || height < THRESHOLD) {
          var hr = OS.rect(handle);
          await NF.Ghost.play([
            { move: '[data-t="drawer-handle"]', dur: 560 },
            { highlight: '[data-t="drawer-handle"]', dur: 620 },
            {
              drag: {
                from: '[data-t="drawer-handle"]',
                to: [Math.round(hr.left + hr.width / 2), Math.round(hr.top + hr.height / 2 - 220)],
                dur: 1100, after: 260
              }
            },
            { do: function () { if (!drawerOpen) openDrawer(false); } },
            { wait: 280 },
            { highlight: '[data-t="drawer-folder"]', dur: 680 },
            { wait: 150 }
          ]);
        } else {
          await NF.Ghost.play([
            { highlight: '[data-t="drawer-folder"]', dur: 680 },
            { drag: { from: '[data-t="drawer-folder"]', to: [Math.round(W / 2), Math.round(H * 0.5)], dur: 1000, after: 200 } },
            { wait: 150 }
          ]);
        }
      };
      ctx.hint(demo);

      /* 让玩家先注意到底部抽屉 */
      ctx.timer(1000, function () {
        if (completed) return;
        var c = OS.center(handle);
        NF.FX.ripple(c.x, c.y, { color: 'rgba(255,212,92,.35)', radius: 46 });
      });
    }
  });
})();

</script>
<script data-src="js/levels/l14.js">
/* js/levels/l14.js */
/* 第 14 关：影子玩家 —— 另一个"玩家"抢走了新建文件夹。
   流程：
   1. 正常右键 → 新建 → 文件夹（直接建出，不弹命名框）；
   2. 2 秒后蓝色 rival 光标从右下角冲进来，把文件夹抢走并在桌面乱窜（鼠标靠近会加速逃开）；
   3. 点 rival 两下把它敲晕 3.4 秒，文件夹掉在桌上；
   4. 眩晕期间把文件夹拖进右下角安全区 → 过关。没送到 rival 会爬起来重新抢走，可无限重试。
*/
(function () {
  'use strict';
  var ID = 14;
  var OS = NF.OS;
  var demo = null;

  NF.Game.registerLevel({
    id: ID,
    icon: 'mouse',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var scene = null;
      var folder = null;
      var rival = null;
      var rivalIco = null;
      var safeZone = null;

      var phase = 1;              // 1 等待右键新建 / 2 rival 冲进来（含等待）/ 3 抢走漫游 / 4 眩晕掉落 / 5 完成
      var completed = false;
      var hits = 0;               // 本轮累计点击 rival 次数
      var stunned = false;
      var carried = false;
      var draggingFolder = false;
      var dragHandle = null;
      var menuByHint = false;
      var fleeBoostUntil = 0;

      var pos = { x: W + 80, y: H + 80 };  // rival 中心（相对 level-root）
      var targetPt = { x: W * 0.5, y: H * 0.5 };
      var targetAt = 0;
      var targetTtl = 900;
      var lastTs = 0;
      var lastMouse = { x: -9999, y: -9999 };
      var trailNodes = [];
      var trailLast = 0;
      var stunTimer = 0;

      ctx.style([
        '.lv14-scene{position:absolute;inset:0;pointer-events:none;z-index:1;}',
        /* rival：蓝色幽灵鼠标 + 尾迹 */
        '.lv14-rival{position:absolute;left:0;top:0;width:72px;height:72px;z-index:40;pointer-events:auto;',
        ' cursor:pointer;touch-action:none;will-change:transform;display:flex;align-items:center;justify-content:center;}',
        '.lv14-rival-ico{position:relative;width:40px;height:40px;line-height:0;will-change:transform;',
        ' filter:drop-shadow(0 0 7px rgba(120,180,255,.95)) drop-shadow(0 0 20px rgba(91,124,250,.65));',
        ' transition:filter .2s ease;}',
        '.lv14-rival-ico svg{width:100%;height:100%;display:block;}',
        '.lv14-rival-ico svg path{fill:#8ec4ff;stroke:#12204a;}',
        '.lv14-rival-ico.lv14-hit{animation:lv14-hit .3s ease;}',
        '@keyframes lv14-hit{0%{transform:scale(1);}35%{transform:scale(1.45) rotate(-16deg);}',
        ' 70%{transform:scale(.88) rotate(9deg);}100%{transform:scale(1);}}',
        '.lv14-rival.lv14-stunned .lv14-rival-ico{animation:lv14-dizzy .42s linear infinite;}',
        '@keyframes lv14-dizzy{0%{transform:rotate(0) scale(1);}25%{transform:rotate(-24deg) scale(1.18);}',
        ' 75%{transform:rotate(24deg) scale(.88);}100%{transform:rotate(0) scale(1);}}',
        '.lv14-stars{position:absolute;left:50%;top:-2px;transform:translateX(-50%);display:none;',
        ' font-size:12px;letter-spacing:3px;color:#ffd45c;white-space:nowrap;pointer-events:none;',
        ' text-shadow:0 0 10px rgba(255,212,92,.95);animation:lv14-stars 1s linear infinite;}',
        '.lv14-rival.lv14-stunned .lv14-stars{display:block;}',
        '@keyframes lv14-stars{0%{transform:translateX(-50%) rotate(-8deg);}50%{transform:translateX(-50%) rotate(8deg);}',
        ' 100%{transform:translateX(-50%) rotate(-8deg);}}',
        '.lv14-trail{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;',
        ' pointer-events:none;z-index:38;background:radial-gradient(circle,rgba(160,205,255,.95),',
        ' rgba(91,124,250,.28) 58%,transparent 76%);animation:lv14-trail .62s ease-out forwards;}',
        '@keyframes lv14-trail{0%{opacity:.95;transform:scale(1);}100%{opacity:0;transform:scale(.2);}}',
        /* 安全区：右下角虚线文件夹轮廓 */
        '.lv14-safe{position:absolute;right:30px;bottom:24px;width:190px;height:150px;border-radius:22px;',
        ' border:2.5px dashed rgba(126,240,192,.82);z-index:26;pointer-events:none;display:flex;',
        ' align-items:center;justify-content:center;background:radial-gradient(circle at 50% 46%,',
        ' rgba(126,240,192,.17),transparent 72%);box-shadow:0 0 26px rgba(126,240,192,.16),',
        ' inset 0 0 24px rgba(126,240,192,.1);',
        ' animation:lv14-safe-in .42s cubic-bezier(.34,1.56,.64,1) both,lv14-safe-pulse 2.2s ease-in-out infinite;}',
        '.lv14-safe .lv14-safe-ico{width:90px;height:90px;opacity:.46;filter:drop-shadow(0 0 14px rgba(126,240,192,.5));}',
        '@keyframes lv14-safe-in{from{opacity:0;transform:scale(.72) rotate(-8deg);}to{opacity:1;transform:scale(1) rotate(0);}}',
        '@keyframes lv14-safe-pulse{0%,100%{box-shadow:0 0 20px rgba(126,240,192,.14),inset 0 0 20px rgba(126,240,192,.08);}',
        ' 50%{box-shadow:0 0 36px rgba(126,240,192,.3),inset 0 0 30px rgba(126,240,192,.16);}}',
        '.lv14-safe.is-hot{border-color:rgba(126,240,192,1);border-style:solid;',
        ' box-shadow:0 0 46px rgba(126,240,192,.55),inset 0 0 34px rgba(126,240,192,.3);transform:scale(1.05);}',
        '.lv14-safe.is-sealed{animation:lv14-seal .55s cubic-bezier(.34,1.56,.64,1) forwards;}',
        '@keyframes lv14-seal{0%{opacity:1;transform:scale(1);}55%{opacity:1;transform:scale(1.16);}',
        ' 100%{opacity:0;transform:scale(.5) rotate(9deg);}}',
        /* 文件夹状态 */
        '.lv14-created{filter:drop-shadow(0 0 20px rgba(255,201,77,.5)) drop-shadow(0 10px 16px rgba(0,0,0,.42));}',
        '.lv14-carried{filter:drop-shadow(0 0 14px rgba(120,180,255,.75)) drop-shadow(0 10px 16px rgba(0,0,0,.42));}',
        '.lv14-bounce{animation:lv14-bounce .5s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv14-bounce{0%{transform:scale(1.24) rotate(8deg) translateY(-10px);}',
        ' 42%{transform:scale(.9) rotate(-5deg) translateY(3px);}',
        ' 74%{transform:scale(1.05) rotate(2deg) translateY(-1px);}100%{transform:scale(1) rotate(0);}}',
        '.lv14-grab{filter:drop-shadow(0 0 22px rgba(255,212,92,.9)) brightness(1.08);}'
      ].join(''));

      scene = document.createElement('div');
      scene.className = 'lv14-scene';
      scene.dataset.phase = '1';
      scene.dataset.qa = 'l14';
      ctx.root.appendChild(scene);

      function rootRect() { return ctx.root.getBoundingClientRect(); }
      function toLocal(clientX, clientY) {
        var r = rootRect();
        return { x: clientX - r.left, y: clientY - r.top };
      }
      function clampPt(x, y) {
        return {
          x: OS.clamp(x, 84, W - 84),
          y: OS.clamp(y, 96, H - 116)
        };
      }
      function setPhase(p) {
        phase = p;
        scene.dataset.phase = String(p);
      }

      /* ---------------- 阶段 1：右键新建 ---------------- */
      function openMenuAt(x, y) {
        OS.closeMenus();
        OS.menu({
          x: x, y: y,
          items: [
            { id: 'view', label: '查看', icon: 'eye', disabled: true },
            { id: 'refresh', label: '刷新', icon: 'restart', onSelect: function () { NF.Audio.play('whoosh'); } },
            { separator: true },
            {
              id: 'new', label: '新建', icon: 'folder',
              submenu: [
                {
                  id: 'folder', label: '文件夹', icon: 'folder', testid: 'menu-item-folder',
                  onSelect: function () { createFolder(); }
                }
              ]
            },
            { separator: true },
            { id: 'personalize', label: '个性化', icon: 'gear', onSelect: function () { NF.Audio.play('deny'); } }
          ]
        });
      }

      function createFolder() {
        if (folder || completed) return;
        OS.closeMenus();
        var fx = Math.round(W / 2 - 38 + OS.rand(-26, 26));
        var fy = Math.round(H * 0.42 - 44 + OS.rand(-18, 18));
        folder = ctx.createdFolder({ x: fx, y: fy, label: '新建文件夹', testid: 'created-folder' });
        folder.classList.add('lv14-created');
        folder.dataset.state = 'idle';
        // 注意：.nf-folder 自带的 folder-pop 动画是 fill:both，会一直覆盖拖拽时的内联 transform，
        // 出场动画结束后必须清掉，否则后面拖不动（视觉上不跟手）。
        ctx.timer(560, function () { if (folder) folder.style.animation = 'none'; });
        NF.Audio.play('pop');
        var c = OS.center(folder);
        NF.FX.burst(c.x, c.y, {
          count: 22, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 6, gravity: 0.18
        });
        NF.FX.sparkle(c.x, c.y);
        setPhase(2);
        ctx.timer(1900, startRival);
      }

      ctx.on(ctx.root, 'contextmenu', function (e) {
        e.preventDefault();
        if (completed || folder) return;
        openMenuAt(e.clientX, e.clientY);
      });

      /* ---------------- 阶段 2：rival 冲进来抢走 ---------------- */
      function buildRival() {
        if (rival) return;
        rival = document.createElement('div');
        rival.className = 'lv14-rival';
        rival.dataset.t = 'rival';
        rival.dataset.hits = '0';
        rival.dataset.stunned = '0';
        rival.dataset.carried = '0';

        rivalIco = document.createElement('div');
        rivalIco.className = 'lv14-rival-ico';
        rivalIco.innerHTML = NF.icons.svg('cursor');
        rival.appendChild(rivalIco);

        var stars = document.createElement('div');
        stars.className = 'lv14-stars';
        stars.textContent = '✦ ✧ ✦';
        rival.appendChild(stars);

        scene.appendChild(rival);
      }

      function buildSafeZone() {
        if (safeZone) return;
        safeZone = document.createElement('div');
        safeZone.className = 'lv14-safe';
        safeZone.dataset.t = 'safe-zone';
        var ico = document.createElement('div');
        ico.className = 'lv14-safe-ico';
        ico.innerHTML = NF.icons.svg('folder');
        safeZone.appendChild(ico);
        scene.appendChild(safeZone);
      }

      function startRival() {
        if (completed || phase !== 2 || !folder) return;
        buildRival();
        buildSafeZone();
        pos = { x: W + 70, y: H + 70 };
        rival.style.transform = 'translate3d(' + (pos.x - 36) + 'px,' + (pos.y - 36) + 'px,0)';
        var rr = rootRect();
        var fr = OS.rect(folder);
        targetPt = { x: fr.left - rr.left + fr.width / 2, y: fr.top - rr.top + fr.height / 2 };
        targetAt = performance.now();
        NF.Audio.play('alarm', { volume: 0.24 });
        NF.Audio.play('whoosh', { volume: 0.6 });
        NF.FX.ripple(W - 60, H - 50, { color: 'rgba(120,180,255,.5)', radius: 80 });
        setPhase(2);
      }

      function grabFolder() {
        if (completed || carried || !folder) return;
        carried = true;
        stunned = false;
        hits = 0;
        rival.dataset.hits = '0';
        rival.dataset.stunned = '0';
        rival.dataset.carried = '1';
        folder.dataset.state = 'carried';
        folder.classList.remove('lv14-created');
        folder.classList.add('lv14-carried');
        folder.style.pointerEvents = 'none';
        NF.Audio.play('whoosh', { volume: 0.5 });
        NF.Audio.play('giggle', { volume: 0.32 });
        var c = OS.center(folder);
        NF.FX.sparkle(c.x, c.y, '#8ec4ff');
        setPhase(3);
        targetAt = 0;
        ctx.timer(750, function () { if (!completed && carried) ctx.replayHint(); });
      }

      /* ---------------- rival 运动 ---------------- */
      function placeRival(now, vx, vy) {
        rival.style.transform = 'translate3d(' + (pos.x - 36) + 'px,' + (pos.y - 36) + 'px,0)';
        rivalIco.style.transform = 'scaleX(' + (vx < -24 ? -1 : 1) + ') rotate(' +
          OS.clamp(vy * 0.022, -14, 14).toFixed(1) + 'deg)';
        if (now - trailLast > 62 && Math.hypot(vx, vy) > 130) {
          trailLast = now;
          var t = document.createElement('div');
          t.className = 'lv14-trail';
          t.style.left = pos.x + 'px';
          t.style.top = pos.y + 'px';
          scene.appendChild(t);
          trailNodes.push({ el: t, t: now });
          if (trailNodes.length > 26) {
            var old = trailNodes.shift();
            if (old.el.parentNode) old.el.remove();
          }
        }
      }

      function followFolder() {
        if (!folder || !carried) return;
        var fx = OS.clamp(pos.x - 38, 4, W - 88);
        var fy = OS.clamp(pos.y + 14, 4, H - 122);
        folder.style.left = fx + 'px';
        folder.style.top = fy + 'px';
        folder.style.transform = 'rotate(' + OS.clamp((targetPt.x - pos.x) * 0.018, -10, 10).toFixed(1) + 'deg)';
      }

      function tick(now) {
        if (!lastTs) lastTs = now;
        var dt = Math.min(0.05, (now - lastTs) / 1000 || 0.016);
        lastTs = now;
        if (!rival || completed || stunned) return;

        if (phase === 2) {
          var rdx = targetPt.x - pos.x;
          var rdy = targetPt.y - pos.y;
          var rd = Math.hypot(rdx, rdy) || 1;
          if (rd < 58) { grabFolder(); return; }
          var rsp = 1000;
          pos.x += rdx / rd * rsp * dt;
          pos.y += rdy / rd * rsp * dt;
          placeRival(now, rdx / rd * rsp, rdy / rd * rsp);
          return;
        }

        if (phase === 3 && carried) {
          var mx = lastMouse.x - pos.x;
          var my = lastMouse.y - pos.y;
          var md = Math.hypot(mx, my);
          var speed = 150;
          if (performance.now() < fleeBoostUntil) speed += 140;
          if (md < 120) {
            // 玩家靠近：稍微加速逃开，但不会像以前那样瞬间弹射
            speed = Math.max(speed, 360);
            var ang = Math.atan2(pos.y - lastMouse.y, pos.x - lastMouse.x) + OS.rand(-0.42, 0.42);
            targetPt = clampPt(pos.x + Math.cos(ang) * 250, pos.y + Math.sin(ang) * 250);
            targetAt = now;
          } else if (!targetAt || now - targetAt > targetTtl) {
            targetPt = clampPt(OS.rand(110, W - 110), OS.rand(120, H - 150));
            targetAt = now;
            targetTtl = OS.rand(900, 1800);
          }
          var dx = targetPt.x - pos.x;
          var dy = targetPt.y - pos.y;
          var d = Math.hypot(dx, dy) || 1;
          var vx = dx / d * speed;
          var vy = dy / d * speed;
          pos.x = OS.clamp(pos.x + vx * dt, 76, W - 76);
          pos.y = OS.clamp(pos.y + vy * dt, 100, H - 112);
          placeRival(now, vx, vy);
          followFolder();
        }
      }
      ctx.raf(tick);

      /* 尾迹节点定期清理（rAF 里已经限量，这里再兜底） */
      ctx.interval(420, function () {
        var now = performance.now();
        trailNodes = trailNodes.filter(function (t) {
          if (now - t.t > 700) {
            if (t.el.parentNode) t.el.remove();
            return false;
          }
          return true;
        });
      });

      /* ---------------- 点击 rival：敲晕（放宽：rival 周围 120px 都算命中） ---------------- */
      function onRootDown(e) {
        if (e.button !== undefined && e.button !== 0) return;
        if (completed || phase !== 3 || stunned || !carried || !rival) return;
        var c = OS.center(rival);
        if (Math.hypot(e.clientX - c.x, e.clientY - c.y) > 120) return;
        e.stopPropagation();
        registerHit();
      }
      ctx.on(ctx.root, 'pointerdown', onRootDown);

      function registerHit() {
        if (completed || phase !== 3 || stunned || !carried) return;
        hits += 1;
        rival.dataset.hits = String(hits);
        if (hits >= 2) { startStun(); return; }
        // 第一下只把它吓一跳：尖叫 + 短时间加速逃跑
        fleeBoostUntil = performance.now() + 520;
        NF.Audio.play('boing', { volume: 0.6 });
        NF.Audio.play('giggle', { volume: 0.3 });
        rivalIco.classList.remove('lv14-hit');
        void rivalIco.offsetWidth;
        rivalIco.classList.add('lv14-hit');
        var c = OS.center(rival);
        NF.FX.burst(c.x, c.y, {
          count: 10, colors: ['#8ec4ff', '#ffffff'], speed: 4, gravity: 0.1, life: 460
        });
        ctx.timer(320, function () { if (rivalIco) rivalIco.classList.remove('lv14-hit'); });
      }

      function startStun() {
        if (completed || stunned) return;
        stunned = true;
        carried = false;
        rival.dataset.stunned = '1';
        rival.classList.add('lv14-stunned');
        // 眩晕时别让 rival 挡住掉在地上的文件夹（它正好在文件落点上时也一样）
        rival.style.pointerEvents = 'none';
        NF.Audio.play('error', { volume: 0.6 });
        NF.Audio.play('robot', { volume: 0.4 });
        var c = OS.center(rival);
        NF.FX.burst(c.x, c.y, {
          count: 24, colors: ['#8ec4ff', '#ffffff', '#ffd45c'], speed: 8, gravity: 0.24
        });
        NF.FX.shake(4, 220);

        // 文件夹掉到桌面空白处（带一点弹跳），顺便避开 rival 的位置
        var dropHome = null;
        for (var tries = 0; tries < 24; tries++) {
          var cand = {
            x: Math.round(OS.rand(W * 0.26, W * 0.6)),
            y: Math.round(OS.rand(H * 0.18, H * 0.5))
          };
          if (Math.hypot(cand.x + 38 - pos.x, cand.y + 44 - pos.y) > 150) { dropHome = cand; break; }
        }
        if (!dropHome) dropHome = { x: Math.round(W * 0.3), y: Math.round(H * 0.3) };
        if (folder) {
          folder.dataset.state = 'dropping';
          folder.classList.remove('lv14-carried');
          folder.style.pointerEvents = 'none';
          folder.style.transform = '';
          folder.style.transition = 'left .42s cubic-bezier(.34,1.56,.64,1),top .42s cubic-bezier(.34,1.56,.64,1)';
          folder.style.left = dropHome.x + 'px';
          folder.style.top = dropHome.y + 'px';
        }
        setPhase(4);
        NF.Audio.play('thud', { volume: 0.55 });

        ctx.timer(340, function () {
          if (completed || !folder || phase !== 4) return;
          folder.style.transition = '';
          folder.classList.add('lv14-bounce');
          folder.dataset.state = 'dropped';
          ctx.timer(520, function () { if (folder) folder.classList.remove('lv14-bounce'); });
          folder.style.pointerEvents = 'auto';
          folder.style.zIndex = '42';   // 眩晕期间文件夹盖在 rival 上方，保证能拖
          var fc = OS.center(folder);
          NF.FX.dust(fc.x, fc.y);
          bindFolderDrag();
          // 从"真的可以拖"开始算 3.4 秒的黄金时间
          stunTimer = ctx.timer(3400, recoverRival);
        });
      }

      function recoverRival() {
        if (completed || phase !== 4) return;
        stunned = false;
        carried = true;
        hits = 0;
        rival.classList.remove('lv14-stunned');
        rival.dataset.stunned = '0';
        rival.dataset.hits = '0';
        rival.dataset.carried = '1';
        rival.style.pointerEvents = '';
        if (folder) {
          folder.dataset.state = 'carried';
          folder.classList.remove('lv14-grab');
          folder.classList.add('lv14-carried');
          folder.style.zIndex = '';
          folder.style.transition = '';
          folder.style.transform = '';
        }
        targetAt = 0;
        setPhase(3);
        NF.Audio.play('whoosh', { volume: 0.5 });
        NF.Audio.play('giggle', { volume: 0.3 });
        followFolder();
        ctx.timer(900, function () { if (!completed && carried) ctx.replayHint(); });
      }

      /* ---------------- 阶段 4：拖文件夹进安全区 ---------------- */
      function bindFolderDrag() {
        if (dragHandle || !folder) return;
        dragHandle = OS.makeDraggable(folder, {
          threshold: 3,
          canStart: function () { return phase === 4 && !completed; },
          onStart: function () {
            draggingFolder = true;
            folder.style.transition = '';
            folder.style.animation = 'none';
            folder.classList.remove('lv14-bounce');
            folder.classList.add('lv14-grab');
            NF.Audio.play('paper', { volume: 0.45 });
          },
          onMove: function (e, st) {
            folder.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) rotate(' +
              OS.clamp(st.dx * 0.04, -9, 9).toFixed(1) + 'deg)';
            if (safeZone) {
              var hot = OS.overlapRatio(folder, safeZone) > 0.16;
              safeZone.classList.toggle('is-hot', hot);
            }
          },
          onEnd: function (e, st) {
            draggingFolder = false;
            if (!folder) return;
            folder.classList.remove('lv14-grab');
            if (safeZone) safeZone.classList.remove('is-hot');
            if (completed || phase !== 4) return;
            var fc = OS.center(folder);
            var sr = OS.rect(safeZone);
            // 放宽判定：中心进入安全区外扩 40px / 重叠 18% / 离安全区中心 140px 内都算送达
            var inside = fc.x > sr.left - 40 && fc.x < sr.right + 40 && fc.y > sr.top - 40 && fc.y < sr.bottom + 40;
            var ov = safeZone ? OS.overlapRatio(folder, safeZone) : 0;
            var centerDist = Math.hypot(fc.x - (sr.left + sr.width / 2), fc.y - (sr.top + sr.height / 2));
            if (inside || ov > 0.18 || centerDist < 140) { deliver(); return; }
            // 没放进去：留在原地继续尝试
            var nx = (parseFloat(folder.style.left) || 0) + st.dx;
            var ny = (parseFloat(folder.style.top) || 0) + st.dy;
            folder.style.left = OS.clamp(nx, 2, W - 92) + 'px';
            folder.style.top = OS.clamp(ny, 2, H - 126) + 'px';
            folder.style.transform = '';
            var c2 = OS.center(folder);
            NF.Audio.play('thud', { volume: 0.4 });
            NF.FX.dust(c2.x, c2.y);
          }
        });
      }

      function deliver() {
        if (completed) return;
        completed = true;
        setPhase(5);
        clearTimeout(stunTimer);
        if (dragHandle) { dragHandle.destroy(); dragHandle = null; }
        if (folder) {
          folder.style.pointerEvents = 'none';
          folder.classList.remove('lv14-grab');
          var sc = OS.center(safeZone);
          var rr = rootRect();
          folder.style.transition = 'left .42s cubic-bezier(.34,1.56,.64,1),top .42s cubic-bezier(.34,1.56,.64,1),transform .42s cubic-bezier(.34,1.56,.64,1)';
          folder.style.left = Math.round(sc.x - rr.left - 38) + 'px';
          folder.style.top = Math.round(sc.y - rr.top - 42) + 'px';
          folder.style.transform = 'scale(.78)';
        }
        safeZone.classList.add('is-sealed');
        NF.Audio.play('snap', { volume: 0.9 });
        NF.Audio.play('sparkle', { volume: 0.9 });
        NF.FX.flash('rgba(255,247,214,.4)', 220);
        var sc2 = OS.center(safeZone);
        NF.FX.burst(sc2.x, sc2.y, {
          count: 40, colors: ['#7ef0c0', '#ffd45c', '#ffffff', '#8ec4ff'], speed: 10, gravity: 0.22
        });
        NF.FX.confetti({ count: 70 });

        // rival 被弹飞
        if (rival) {
          rival.classList.remove('lv14-stunned');
          rival.dataset.stunned = '0';
          rival.style.transition = 'transform .7s ease, opacity .7s ease';
          rival.style.transform = 'translate3d(' + (pos.x - 36) + 'px,' + (pos.y - 216) + 'px,0) scale(.36) rotate(540deg)';
          rival.style.opacity = '0';
          rival.style.pointerEvents = 'none';
        }
        ctx.timer(620, function () { ctx.complete({ el: folder }); });
      }

      /* ---------------- 鼠标位置（rival 的"玩家靠近"判定） ---------------- */
      ctx.on(window, 'pointermove', function (e) {
        lastMouse = toLocal(e.clientX, e.clientY);
      });

      /* ---------------- 幽灵演示 ---------------- */
      demo = async function () {
        if (completed) return;
        OS.closeMenus();
        if (phase === 1) {
          var px = Math.round(W * 0.54);
          var py = Math.round(H * 0.4);
          menuByHint = true;
          try {
            await NF.Ghost.play([
              { move: [px, py], dur: 420 },
              {
                click: 'right', target: [px, py],
                do: function () { if (!completed && !folder) openMenuAt(px, py); }
              },
              { wait: 260 },
              { move: '[data-t="menu-item-new"]', dur: 520 },
              { highlight: '[data-t="menu-item-new"]', dur: 560 },
              {
                do: function () {
                  var root = OS.rootMenu();
                  if (!root) return;
                  for (var i = 0; i < root.itemEls.length; i++) {
                    if (root.itemEls[i].item.id === 'new') { root.openSub(root.itemEls[i].item); return; }
                  }
                }
              },
              { wait: 200 },
              { highlight: '[data-t="menu-item-folder"]', dur: 720 },
              { click: 'left', target: '[data-t="menu-item-folder"]' },
              { wait: 160 }
            ]);
          } finally {
            if (menuByHint) { OS.closeMenus(); menuByHint = false; }
          }
          return;
        }
        if (phase === 2) {
          await NF.Ghost.play([
            { move: '[data-t="rival"]', dur: 420 },
            { highlight: '[data-t="rival"]', dur: 640 }
          ]);
          return;
        }
        if (phase === 3) {
          await NF.Ghost.play([
            { move: '[data-t="rival"]', dur: 460 },
            { highlight: '[data-t="rival"]', dur: 620 },
            { click: 'left', target: '[data-t="rival"]', after: 320 },
            { click: 'left', target: '[data-t="rival"]', after: 280 },
            { wait: 200 },
            { move: '[data-t="safe-zone"]', dur: 520 },
            { highlight: '[data-t="safe-zone"]', dur: 780 }
          ]);
          return;
        }
        if (phase === 4) {
          await NF.Ghost.play([
            { highlight: '[data-t="created-folder"]', dur: 460 },
            { drag: { from: '[data-t="created-folder"]', to: '[data-t="safe-zone"]', dur: 900, after: 180 } },
            { highlight: '[data-t="safe-zone"]', dur: 560 }
          ]);
        }
      };
      ctx.hint(demo);

      ctx.onCleanup(function () {
        OS.closeMenus();
        if (dragHandle) { try { dragHandle.destroy(); } catch (e) {} dragHandle = null; }
        clearTimeout(stunTimer);
        trailNodes.forEach(function (t) { if (t.el.parentNode) t.el.remove(); });
        trailNodes = [];
        if (folder && folder.parentNode) folder.remove();
        if (rival && rival.parentNode) rival.remove();
        if (safeZone && safeZone.parentNode) safeZone.remove();
      });
    }
  });
})();

</script>
<script data-src="js/levels/l15.js">
/* js/levels/l15.js */
/* 第 15 关：断电 —— 显示器电源被拔了，只剩鼠标周围一圈手电光。
   1. 全屏遮罩压暗桌面，鼠标周围 150px 是随鼠标平滑跟随的透明光斑；
   2. 桌上散落 6 个图标：1 个真·新建文件夹（有微弱金色呼吸光），5 个假图标（错位/单色/倒置）；
   3. 照亮并点中真图标 → 炸成光点，桌面中央点亮生成文件夹 → 过关；点假图标只有滑稽反馈并换位置；
   4. 右下角电量条 25 秒耗尽 → 全场闪三下变暗再亮起并回满，同时假图标全部换位置（循环，不失败）。
   方向键可以微调光斑。
*/
(function () {
  'use strict';
  var ID = 15;
  var OS = NF.OS;
  var demo = null;

  var BATTERY_MS = 25000;   // 手电电量：25 秒

  NF.Game.registerLevel({
    id: ID,
    icon: 'eyeClosed',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var scene = null;
      var darkness = null;
      var lamp = null;
      var flickerEl = null;
      var auraEl = null;
      var beaconEl = null;
      var powerBox = null;
      var powerFill = null;

      var icons = [];             // { el, x, y, real }
      var realIcon = null;
      var realPos = { x: 0, y: 0 };
      var completed = false;
      var powerMode = 'normal';   // normal | cycle
      var batteryLeft = BATTERY_MS;
      var batteryShown = -1;
      var powerCycles = 0;        // 断电循环次数（QA 读 data-cycles）

      var light = { x: W / 2, y: H / 2 };
      var lastMouse = { x: W / 2, y: H / 2 };
      var hintLight = null;
      var lastTs = 0;

      ctx.style([
        '.lv15-scene{position:absolute;inset:0;pointer-events:none;z-index:1;--lx:' + (W / 2) + 'px;--ly:' + (H / 2) + 'px;}',
        /* 手电光斑：透明圆 + 几乎全黑的遮罩 */
        '.lv15-darkness{position:absolute;inset:0;z-index:50;pointer-events:none;',
        ' background:radial-gradient(circle 150px at var(--lx) var(--ly),transparent 0,rgba(0,0,0,.985) 78%);}',
        '.lv15-darkness.lv15-blackout{background:#000;}',
        '.lv15-lamp{position:absolute;inset:0;z-index:51;pointer-events:none;',
        ' background:radial-gradient(circle 185px at var(--lx) var(--ly),rgba(255,240,200,.14),rgba(255,225,170,.04) 55%,transparent 72%);}',
        '.lv15-flicker{position:absolute;inset:0;z-index:54;pointer-events:none;opacity:0;',
        ' background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.4),rgba(255,255,255,.06) 60%,transparent);}',
        '.lv15-flicker.is-on{animation:lv15-flick3 .72s steps(1,end) both;}',
        '@keyframes lv15-flick3{0%{opacity:0;}8%{opacity:1;}17%{opacity:0;}28%{opacity:1;}37%{opacity:0;}',
        ' 48%{opacity:1;}60%{opacity:0;}100%{opacity:0;}}',
        '.lv15-flicker.is-flicker{animation:lv15-flick1 .22s ease-out both;}',
        '@keyframes lv15-flick1{0%{opacity:.55;}55%{opacity:.18;}100%{opacity:0;}}',
        /* 桌面图标 */
        '.lv15-icon{position:absolute;width:64px;height:64px;z-index:3;pointer-events:auto;cursor:pointer;line-height:0;}',
        '.lv15-icon-art{width:100%;height:100%;transition:transform .18s ease,filter .18s ease;}',
        '.lv15-icon-art svg{width:100%;height:100%;display:block;}',
        '.lv15-real .lv15-icon-art{filter:drop-shadow(0 0 10px rgba(255,201,77,.8)) saturate(1.1);}',
        '.lv15-real:hover .lv15-icon-art{transform:scale(1.14);}',
        '.lv15-fake:hover{filter:brightness(1.3);}',
        '.lv15-fake .lv15-icon-art{filter:grayscale(1) brightness(.72) contrast(1.15);}',
        '.lv15-icon.lv15-fake-hit{animation:lv15-fakehit .34s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv15-fakehit{0%{transform:scale(1);}35%{transform:scale(1.28) rotate(-12deg);}',
        ' 70%{transform:scale(.9) rotate(8deg);}100%{transform:scale(1);}}',
        '.lv15-icon.lv15-real-burst{animation:lv15-realburst .46s cubic-bezier(.3,.7,.4,1) forwards;}',
        '@keyframes lv15-realburst{0%{transform:scale(1);opacity:1;}55%{transform:scale(1.7) rotate(14deg);opacity:.9;}',
        ' 100%{transform:scale(.1) rotate(40deg);opacity:0;}}',
        /* 真图标自带的微弱金色呼吸光（在遮罩之下，只有手电光斑照到才看得清） */
        '.lv15-aura{position:absolute;width:150px;height:150px;border-radius:50%;z-index:2;pointer-events:none;',
        ' background:radial-gradient(circle,rgba(255,201,77,.4),rgba(255,201,77,.1) 55%,transparent 72%);',
        ' filter:blur(3px);animation:lv15-aura 2.6s ease-in-out infinite;}',
        '@keyframes lv15-aura{0%,100%{opacity:.35;transform:scale(.86);}50%{opacity:.95;transform:scale(1.08);}}',
        /* 幽灵演示时用来标出真图标位置的光标信标（演示结束就消失） */
        '.lv15-beacon{position:absolute;width:104px;height:104px;border-radius:50%;z-index:57;pointer-events:none;',
        ' border:2px dashed rgba(255,224,138,.92);box-shadow:0 0 36px rgba(255,212,92,.6),inset 0 0 22px rgba(255,212,92,.32);',
        ' animation:lv15-beacon 1.4s ease-in-out infinite;}',
        '@keyframes lv15-beacon{0%,100%{opacity:.4;transform:scale(.92);}50%{opacity:1;transform:scale(1.07);}}',
        /* 右下角电量条 */
        '.lv15-power{position:absolute;right:24px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;',
        ' pointer-events:none;opacity:.96;}',
        '.lv15-power-ico{width:20px;height:20px;line-height:0;filter:drop-shadow(0 0 6px rgba(255,212,92,.6));}',
        '.lv15-power-ico svg{width:100%;height:100%;display:block;}',
        '.lv15-power-track{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;',
        ' box-shadow:inset 0 0 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.12);}',
        '.lv15-power-fill{height:100%;width:100%;border-radius:5px;',
        ' background:linear-gradient(90deg,#7ef0c0,#ffd45c);',
        ' box-shadow:0 0 10px rgba(255,212,92,.5);transition:background .3s ease;}',
        '.lv15-power.is-low .lv15-power-fill{background:linear-gradient(90deg,#ff8a5c,#ff5d7a);',
        ' animation:lv15-lowblink .6s steps(1,end) infinite;}',
        '@keyframes lv15-lowblink{0%,100%{opacity:1;}50%{opacity:.42;}}',
        /* 点亮后的桌面 & 文件夹 */
        '.lv15-scene.lv15-reveal .lv15-darkness{opacity:.4;transition:opacity .55s ease;}',
        '.lv15-folder{filter:drop-shadow(0 0 30px rgba(255,212,92,.9)) drop-shadow(0 12px 18px rgba(0,0,0,.45));}'
      ].join(''));

      scene = document.createElement('div');
      scene.className = 'lv15-scene';
      scene.dataset.phase = 'search';
      scene.dataset.power = 'normal';
      scene.dataset.cycles = '0';
      scene.dataset.qa = 'l15';
      ctx.root.appendChild(scene);

      function rootRect() { return ctx.root.getBoundingClientRect(); }
      function toLocal(clientX, clientY) {
        var r = rootRect();
        return { x: clientX - r.left, y: clientY - r.top };
      }

      /* ---------------- 随机安全落点 ---------------- */
      function randomSpot(others, minDist, self) {
        var list = others.filter(function (o) { return o !== self; });
        for (var tries = 0; tries < 90; tries++) {
          var x = Math.round(OS.rand(120, Math.max(130, W - 120 - 64)));
          var y = Math.round(OS.rand(120, Math.max(130, H - 120 - 64)));
          var ok = true;
          for (var i = 0; i < list.length; i++) {
            if (Math.hypot(list[i].x - x, list[i].y - y) < minDist) { ok = false; break; }
          }
          if (ok) return { x: x, y: y };
        }
        return {
          x: Math.round(OS.rand(120, Math.max(130, W - 200))),
          y: Math.round(OS.rand(120, Math.max(130, H - 200)))
        };
      }

      /* ---------------- 图标 ---------------- */
      var FAKE_ICONS = ['file', 'gear', 'robot', 'trash', 'bug', 'disk', 'fileText', 'eyeClosed', 'cake', 'cloud'];

      function buildIcon(real, x, y, idx) {
        var el = document.createElement('div');
        el.className = 'lv15-icon ' + (real ? 'lv15-real' : 'lv15-fake');
        el.dataset.t = real ? 'power-icon-real' : 'power-icon-fake';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        var art = document.createElement('div');
        art.className = 'lv15-icon-art';
        var name = real ? 'folder' : FAKE_ICONS[idx % FAKE_ICONS.length];
        art.innerHTML = NF.icons.svg(name);
        if (!real) {
          // 错位 / 倒置 / 单色：每个假图标长得都不一样（内联 filter 会覆盖 CSS，所以写全）
          var rot = OS.rand(-16, 16);
          var mirror = Math.random() < 0.5 ? -1 : 1;
          var tint = Math.round(OS.rand(-40, 40));
          art.style.transform = 'rotate(' + rot.toFixed(1) + 'deg) scaleX(' + mirror + ')';
          art.style.filter = 'grayscale(1) sepia(.5) hue-rotate(' + tint + 'deg) brightness(.72) contrast(1.15)';
        }
        el.appendChild(art);
        var rec = { el: el, x: x, y: y, real: !!real };
        ctx.on(el, 'click', function (e) {
          e.stopPropagation();
          if (completed) return;
          if (real) finish();
          else fakeHit(rec);
        });
        scene.appendChild(el);
        return rec;
      }

      (function layoutIcons() {
        var placed = [];
        realPos = randomSpot(placed, 0, null);
        realIcon = buildIcon(true, realPos.x, realPos.y, 0);
        icons.push(realIcon);
        placed.push(realPos);
        for (var i = 0; i < 5; i++) {
          var spot = randomSpot(placed, 150, null);
          var rec = buildIcon(false, spot.x, spot.y, i);
          icons.push(rec);
          placed.push(spot);
        }
      })();

      /* ---------------- 遮罩 / 光斑 / 电量 ---------------- */
      darkness = document.createElement('div');
      darkness.className = 'lv15-darkness';
      darkness.dataset.t = 'darkness';
      scene.appendChild(darkness);

      lamp = document.createElement('div');
      lamp.className = 'lv15-lamp';
      scene.appendChild(lamp);

      flickerEl = document.createElement('div');
      flickerEl.className = 'lv15-flicker';
      scene.appendChild(flickerEl);

      auraEl = document.createElement('div');
      auraEl.className = 'lv15-aura';
      auraEl.style.left = (realPos.x + 32 - 75) + 'px';
      auraEl.style.top = (realPos.y + 32 - 75) + 'px';
      scene.appendChild(auraEl);

      powerBox = document.createElement('div');
      powerBox.className = 'lv15-power';
      powerBox.dataset.t = 'power-bar';
      var pIco = document.createElement('div');
      pIco.className = 'lv15-power-ico';
      pIco.innerHTML = NF.icons.svg('socket');
      powerBox.appendChild(pIco);
      var track = document.createElement('div');
      track.className = 'lv15-power-track';
      powerFill = document.createElement('div');
      powerFill.className = 'lv15-power-fill';
      track.appendChild(powerFill);
      powerBox.appendChild(track);
      scene.appendChild(powerBox);

      function updatePowerBar(force) {
        var pct = OS.clamp(batteryLeft / BATTERY_MS, 0, 1);
        var shown = Math.round(pct * 100);
        if (!force && shown === batteryShown) {
          if (pct < 0.25) powerBox.classList.add('is-low');
          return;
        }
        batteryShown = shown;
        powerFill.style.width = shown + '%';
        powerBox.dataset.pct = String(shown);
        powerBox.classList.toggle('is-low', pct < 0.25);
      }
      updatePowerBar(true);

      /* ---------------- 手电循环（电量耗尽，不失败） ---------------- */
      function drainBattery() {
        if (completed || powerMode === 'cycle') return;
        powerMode = 'cycle';
        scene.dataset.power = 'cycle';
        powerCycles += 1;
        scene.dataset.cycles = String(powerCycles);
        NF.Audio.play('powerdown', { volume: 0.85 });
        flickerEl.classList.remove('is-on');
        void flickerEl.offsetWidth;
        flickerEl.classList.add('is-on');
        darkness.classList.add('lv15-blackout');
        ctx.timer(240, function () { NF.Audio.play('alarm', { volume: 0.22 }); });
        ctx.timer(760, function () {
          if (completed) return;
          // 假图标全部换位置
          icons.forEach(function (rec) {
            if (rec.real) return;
            var spot = randomSpot(icons, 150, rec);
            rec.x = spot.x;
            rec.y = spot.y;
            rec.el.style.left = spot.x + 'px';
            rec.el.style.top = spot.y + 'px';
          });
          darkness.classList.remove('lv15-blackout');
          batteryLeft = BATTERY_MS;
          updatePowerBar(true);
          powerMode = 'normal';
          scene.dataset.power = 'normal';
          NF.Audio.play('sparkle', { volume: 0.45 });
        });
      }

      /* ---------------- 点中真图标 ---------------- */
      function finish() {
        if (completed) return;
        completed = true;
        scene.dataset.phase = 'done';
        batteryLeft = BATTERY_MS;
        updatePowerBar(true);
        NF.Audio.play('explode', { volume: 0.7 });
        NF.Audio.play('sparkle', { volume: 0.85 });
        var c = OS.center(realIcon.el);
        NF.FX.flash('rgba(255,244,205,.55)', 220);
        NF.FX.burst(c.x, c.y, {
          count: 46, colors: ['#ffc94d', '#ffe08a', '#ffb020', '#ffffff'], speed: 11, gravity: 0.24
        });
        NF.FX.ripple(c.x, c.y, { color: 'rgba(255,224,138,.95)', radius: 80 });
        realIcon.el.classList.add('lv15-real-burst');
        realIcon.el.style.pointerEvents = 'none';
        scene.classList.add('lv15-reveal');

        ctx.timer(420, function () {
          var fx = Math.round(W / 2 - 38);
          var fy = Math.round(H * 0.46);
          var folder = ctx.createdFolder({ x: fx, y: fy, label: '新建文件夹', testid: 'created-folder' });
          folder.classList.add('lv15-folder');
          folder.dataset.state = 'powered';
          var fc = OS.center(folder);
          NF.Audio.play('pop');
          NF.FX.flash('rgba(255,247,214,.5)', 260);
          NF.FX.sparkle(fc.x, fc.y, '#ffd45c');
          NF.FX.burst(fc.x, fc.y, {
            count: 34, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#7ef0c0'], speed: 8, gravity: 0.2
          });
          ctx.timer(560, function () { ctx.complete({ el: folder }); });
        });
      }

      /* ---------------- 点中假图标 ---------------- */
      function fakeHit(rec) {
        if (completed) return;
        NF.Audio.play('boing', { volume: 0.55, rate: 0.72 });
        NF.Audio.play('giggle', { volume: 0.35 });
        flickerEl.classList.remove('is-flicker');
        void flickerEl.offsetWidth;
        flickerEl.classList.add('is-flicker');
        var spot = randomSpot(icons, 150, rec);
        rec.x = spot.x;
        rec.y = spot.y;
        rec.el.style.left = spot.x + 'px';
        rec.el.style.top = spot.y + 'px';
        rec.el.classList.remove('lv15-fake-hit');
        void rec.el.offsetWidth;
        rec.el.classList.add('lv15-fake-hit');
        var c = OS.center(rec.el);
        NF.FX.dust(c.x, c.y);
        ctx.timer(360, function () { rec.el.classList.remove('lv15-fake-hit'); });
      }

      /* ---------------- 鼠标 / 键盘控制光斑 ---------------- */
      ctx.on(window, 'pointermove', function (e) {
        var p = toLocal(e.clientX, e.clientY);
        lastMouse = p;
        hintLight = null;
        hideBeacon();
      });

      function nudge(dx, dy) {
        if (completed) return;
        hintLight = null;
        hideBeacon();
        lastMouse.x = OS.clamp(lastMouse.x + dx, 0, W);
        lastMouse.y = OS.clamp(lastMouse.y + dy, 0, H);
      }
      ctx.on(window, 'keydown', function (e) {
        if (completed) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-26, 0); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(26, 0); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -26); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(0, 26); }
      });

      /* ---------------- 主循环：光斑平滑跟随 + 电量消耗 ---------------- */
      function tick(now) {
        if (!lastTs) lastTs = now;
        var dt = Math.min(0.05, (now - lastTs) / 1000 || 0.016);
        lastTs = now;
        var goal = hintLight || lastMouse;
        var k = Math.min(1, dt * 10);
        light.x += (goal.x - light.x) * k;
        light.y += (goal.y - light.y) * k;
        scene.style.setProperty('--lx', light.x.toFixed(1) + 'px');
        scene.style.setProperty('--ly', light.y.toFixed(1) + 'px');

        if (!completed && powerMode === 'normal') {
          batteryLeft -= dt * 1000;
          if (batteryLeft <= 0) {
            batteryLeft = 0;
            updatePowerBar(true);
            drainBattery();
          } else {
            updatePowerBar(false);
          }
        }
      }
      ctx.raf(tick);

      /* ---------------- 幽灵演示：先把手电照到真图标上，再点它 ---------------- */
      function showBeacon() {
        if (beaconEl || completed) return;
        beaconEl = document.createElement('div');
        beaconEl.className = 'lv15-beacon';
        beaconEl.style.left = (realPos.x + 32 - 52) + 'px';
        beaconEl.style.top = (realPos.y + 32 - 52) + 'px';
        scene.appendChild(beaconEl);
        NF.Audio.play('sparkle', { volume: 0.3 });
      }
      function hideBeacon() {
        if (beaconEl) {
          if (beaconEl.parentNode) beaconEl.remove();
          beaconEl = null;
        }
      }

      demo = async function () {
        if (completed) return;
        if (powerMode === 'cycle') {
          await NF.Ghost.play([{ wait: 500 }]);
          return;
        }
        var rr = rootRect();
        var px = realPos.x + 32 + rr.left;
        var py = realPos.y + 32 + rr.top;
        hintLight = { x: realPos.x + 32, y: realPos.y + 32 };
        showBeacon();
        try {
          await NF.Ghost.play([
            { move: [px, py], dur: 820 },
            { highlight: '[data-t="power-icon-real"]', dur: 900 },
            { click: 'left', target: '[data-t="power-icon-real"]', after: 220 },
            { wait: 260 }
          ]);
        } finally {
          // 演示结束后稍等一会儿就把手电交还给鼠标，信标也收掉：
          // 玩家记住了大概位置，但仍要自己打着手电找过去。
          ctx.timer(650, function () {
            hintLight = null;
            hideBeacon();
          });
        }
      };
      ctx.hint(demo);

      ctx.onCleanup(function () {
        hideBeacon();
        hintLight = null;
        if (realIcon && realIcon.el.parentNode) realIcon.el.remove();
        icons.forEach(function (rec) { if (rec.el.parentNode) rec.el.remove(); });
        icons = [];
      });
    }
  });
})();

</script>
<script data-src="js/levels/l16.js">
/* js/levels/l16.js */
/* 第 16 关：窗口大逃亡 —— "新建文件夹"对话框不想出现，它躲到屏幕外去了。
   流程：
   1. 屏幕右缘只露出 90px 的窗口，会慢慢往外滑，鼠标靠近标题栏还会小幅躲闪；
      把标题栏拖到屏幕中央（距离中心 < 190px）→ 吸附到正中；
   2. 窗口一分为三：一个真窗口（标题栏是文件夹图标）+ 两个假窗口（齿轮 / 机器人），
      三个窗口会乱序交换位置，把真窗口拖进中央的虚线槽里（错窗口会抖动弹开）；
   3. 真窗口就位后点"确定"（按钮会躲鼠标）或按 Enter → 文件夹从窗口里飞出来 → 过关。
*/
(function () {
  'use strict';
  var ID = 16;
  var OS = NF.OS;
  var demo = null;

  var WIN_W = 420;
  var WIN_H = 260;

  NF.Game.registerLevel({
    id: ID,
    icon: 'window',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);
      var CENTER = { x: W / 2, y: H / 2 };

      var scene = null;
      var slotEl = null;
      var escapeWin = null;
      var escBar = null;
      var escHandle = null;
      var escHome = { x: Math.max(60, W - 90), y: Math.round(H * 0.32) };
      var escPos = { x: escHome.x, y: escHome.y };
      var escDodge = 0;
      var escDragging = false;
      var escSnapping = false;
      var escReturning = false;

      var phase = 1;            // 1 屏幕边缘逃亡 / 2 三窗口 / 3 真窗口就位 / 4 完成
      var completed = false;
      var wins = [];
      var dragWin = null;
      var dockedWin = null;
      var swapTimer = 0;
      var swapFlip = 0;
      var lastMouse = { x: -9999, y: -9999 };
      var lastTs = 0;

      ctx.style([
        '.lv16-scene{position:absolute;inset:0;pointer-events:none;z-index:1;}',
        /* 仿系统窗口 */
        '.lv16-win{position:absolute;width:' + WIN_W + 'px;height:' + WIN_H + 'px;border-radius:12px;overflow:hidden;',
        ' z-index:30;pointer-events:auto;border:1px solid rgba(255,255,255,.16);',
        ' background:linear-gradient(165deg,rgba(32,28,66,.97),rgba(17,15,38,.97));',
        ' box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);',
        ' animation:lv16-win-in .32s cubic-bezier(.34,1.56,.64,1) both;will-change:left,top,transform;}',
        '.lv16-win.lv16-anim-done{animation:none;}',
        '@keyframes lv16-win-in{from{opacity:0;transform:scale(.86) translateY(12px);}to{opacity:1;transform:none;}}',
        '.lv16-bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;cursor:grab;',
        ' touch-action:none;background:rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.09);',
        ' user-select:none;-webkit-user-select:none;}',
        '.lv16-bar:active{cursor:grabbing;}',
        '.lv16-tb-ico{width:18px;height:18px;line-height:0;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));}',
        '.lv16-tb-ico svg{width:100%;height:100%;display:block;}',
        '.lv16-tb-title{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:.02em;',
        ' color:rgba(238,240,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
        '.lv16-dots{display:flex;gap:4px;flex:0 0 auto;}',
        '.lv16-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.26);}',
        '.lv16-x{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;',
        ' font-size:10px;color:rgba(255,255,255,.45);flex:0 0 auto;}',
        '.lv16-body{position:absolute;left:0;right:0;top:38px;bottom:0;display:flex;align-items:center;',
        ' justify-content:center;background:radial-gradient(ellipse at 30% 0%,rgba(96,72,190,.24),transparent 64%);}',
        '.lv16-dialog{width:302px;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:10px;',
        ' background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);',
        ' box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}',
        '.lv16-field{height:40px;border-radius:8px;background:rgba(8,10,24,.72);border:1px solid rgba(255,255,255,.18);',
        ' display:flex;align-items:center;padding:0 12px;gap:6px;font-size:14px;color:#eef2ff;}',
        '.lv16-caret{width:2px;height:16px;background:#8ec4ff;animation:lv16-blink 1s steps(1) infinite;}',
        '@keyframes lv16-blink{50%{opacity:0;}}',
        '.lv16-btns{display:flex;justify-content:flex-end;gap:10px;}',
        '.lv16-btn{height:32px;min-width:80px;padding:0 14px;border-radius:7px;font-size:12.5px;',
        ' display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);',
        ' background:rgba(255,255,255,.1);color:#eef2ff;cursor:default;font-family:inherit;}',
        '.lv16-btn.is-primary{background:linear-gradient(180deg,#5c7efc,#3f63e8);border-color:transparent;',
        ' color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(70,105,245,.35);',
        ' transition:filter .15s ease,box-shadow .2s ease;}',
        '.lv16-btn.is-primary:hover{filter:brightness(1.1);}',
        '.lv16-btn.is-primary:disabled{opacity:.38;filter:saturate(.35);pointer-events:none;box-shadow:none;}',
        '.lv16-btn.is-ready{box-shadow:0 0 0 2px rgba(255,224,138,.55),0 4px 18px rgba(255,201,77,.45);}',
        '.lv16-btn.lv16-tired{outline:2px dashed rgba(255,212,92,.75);outline-offset:2px;}',
        '.lv16-btn.is-ghost{opacity:.5;}',
        /* 状态类 */
        '.lv16-win.lv16-grabbing{transition:none!important;z-index:44!important;',
        ' border-color:rgba(140,168,255,.55);box-shadow:0 34px 80px rgba(0,0,0,.6),0 0 34px rgba(120,150,255,.28);}',
        '.lv16-win.lv16-over{border-color:rgba(255,212,92,.7);}',
        '.lv16-win.lv16-wrong{animation:lv16-wrong .42s ease;}',
        '@keyframes lv16-wrong{0%,100%{transform:none;}20%{transform:translateX(-9px) rotate(-.6deg);}',
        ' 45%{transform:translateX(8px) rotate(.5deg);}70%{transform:translateX(-5px);}}',
        '.lv16-win.lv16-docked{z-index:45;border-color:rgba(255,224,138,.75);',
        ' box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 46px rgba(255,212,92,.38);}',
        '.lv16-win.lv16-ready{border-color:rgba(255,238,180,.9);}',
        '.lv16-win.lv16-lose{animation:none!important;opacity:0!important;pointer-events:none!important;',
        ' transform:scale(.8) translateY(26px)!important;transition:opacity .5s ease,transform .5s ease!important;}',
        '.lv16-win.lv16-split{animation:lv16-split .3s ease forwards!important;}',
        '@keyframes lv16-split{0%{opacity:1;transform:scale(1);filter:brightness(1);}',
        ' 45%{opacity:1;transform:scale(1.04);filter:brightness(1.7);}',
        ' 100%{opacity:0;transform:scale(.9);filter:brightness(2.4);}}',
