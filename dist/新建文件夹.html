      dim.className = 'lv8-dim';
      stage.appendChild(dim);

      var floor = document.createElement('div');
      floor.className = 'lv8-floor';
      stage.appendChild(floor);

      var gx = Math.round((W - 450) / 2);
      var gy = Math.round(H * 0.5 - 150);
      frontHome.x = gx + 170;
      frontHome.y = gy + 95;

      var aura = document.createElement('div');
      aura.className = 'lv8-aura';
      aura.style.left = (gx + GW / 2 - 210) + 'px';
      aura.style.top = (gy + GH / 2 - 190) + 'px';
      aura.style.width = '420px';
      aura.style.height = '380px';
      stage.appendChild(aura);

      group = document.createElement('div');
      group.className = 'lv8-group';
      group.style.left = gx + 'px';
      group.style.top = gy + 'px';

      bob = document.createElement('div');
      bob.className = 'lv8-bob';

      var shadow = document.createElement('div');
      shadow.className = 'lv8-shadow';
      bob.appendChild(shadow);

      var sway = document.createElement('div');
      sway.className = 'lv8-sway';

      back = document.createElement('div');
      back.className = 'lv8-back';
      back.dataset.t = 'd3-back';
      back.innerHTML = '<div class="lv8-tab"></div>' +
        '<div class="lv8-back-face"><div class="lv8-back-inner"></div>' +
        '<div class="lv8-back-label">新建文件夹</div></div>';
      sway.appendChild(back);
      bob.appendChild(sway);
      group.appendChild(bob);
      stage.appendChild(group);

      // 卡扣转盘（阶段 2 才显示）
      dial = document.createElement('div');
      dial.className = 'lv8-dial';
      dial.dataset.t = 'd3-dial';
      dial.dataset.phase = '1';
      dial.innerHTML = '<div class="lv8-dial-ring"></div><div class="lv8-dial-notch"></div>' +
        '<div class="lv8-dial-needle"></div><div class="lv8-dial-knob"></div>';
      stage.appendChild(dial);

      front = document.createElement('div');
      front.className = 'lv8-front is-idle';
      front.dataset.t = 'd3-front';
      front.style.left = frontHome.x + 'px';
      front.style.top = frontHome.y + 'px';
      front.innerHTML = '<div class="lv8-front-face">' +
        '<div class="lv8-front-ico">' + NF.icons.svg('folder') + '</div>' +
        '<div class="lv8-front-label">新建文件夹</div>' +
        '<div class="lv8-front-shine"></div>' +
        '</div>';
      stage.appendChild(front);

      // 长按进度
      holdRing = document.createElement('div');
      holdRing.className = 'lv8-hold';
      holdRing.dataset.t = 'd3-hold';
      holdRing.innerHTML = '<svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="88"/>' +
        '<circle class="fg" cx="100" cy="100" r="88"/></svg><div class="lv8-hold-label">✊</div>';
      stage.appendChild(holdRing);

      // 阶段指示（三颗小灯）
      var pips = document.createElement('div');
      pips.className = 'lv8-pips';
      pips.innerHTML = '<i class="on"></i><i></i><i></i>';
      stage.appendChild(pips);
      function setPips() {
        Array.prototype.forEach.call(pips.children, function (p, i) {
          p.classList.toggle('on', i < phase);
        });
      }

      ctx.root.appendChild(stage);
      back.dataset.qa = 'l08-back';
      front.dataset.qa = 'l08-front';

      /* ---------------- 视差 ---------------- */
      function onPointer(e) {
        if (reduced || completed) return;
        var nx = (e.clientX / innerWidth - 0.5) * 2;
        var ny = (e.clientY / innerHeight - 0.5) * 2;
        group.style.setProperty('--rx', (-10 - ny * 6).toFixed(2) + 'deg');
        group.style.setProperty('--ry', (16 + nx * 9).toFixed(2) + 'deg');
        stage.style.setProperty('--px', (nx * 26).toFixed(1) + 'px');
        stage.style.setProperty('--py', (ny * 18).toFixed(1) + 'px');
      }
      ctx.on(document, 'pointermove', onPointer);

      /* ---------------- 基础动作 ---------------- */
      function distToBack() {
        var a = OS.center(front);
        var b = OS.center(back);
        return Math.hypot(a.x - b.x, a.y - b.y);
      }
      function overBack() {
        return OS.overlapRatio(front, back);
      }
      function backCenterLocal() {
        var bc = OS.center(back);
        var rr = OS.rect(ctx.root);
        return { x: bc.x - rr.left, y: bc.y - rr.top };
      }

      function springBack(msg) {
        front.classList.remove('lv8-near');
        back.classList.remove('lv8-target');
        front.classList.add('lv8-settle');
        front.style.left = frontHome.x + 'px';
        front.style.top = frontHome.y + 'px';
        if (msg !== false) NF.Audio.play('thud', { volume: 0.4 });
        NF.Audio.play('giggle', { volume: 0.16 });
        var c = OS.center(back);
        NF.FX.dust(c.x, c.y);
        ctx.timer(430, function () {
          front.classList.remove('lv8-settle');
          if (!completed && !busy) front.classList.add('is-idle');
        });
      }

      function settleToBack() {
        busy = true;
        if (frontHandle) frontHandle.locked = true;
        front.classList.remove('is-idle', 'lv8-near', 'lv8-dragging');
        back.classList.remove('lv8-target');
        front.classList.add('lv8-settle');
        var p = backCenterLocal();
        front.style.left = Math.round(p.x - FW / 2) + 'px';
        front.style.top = Math.round(p.y - FH / 2) + 'px';
        NF.Audio.play('snap', { volume: 0.85 });
      }

      function unlockDrag() {
        busy = false;
        if (frontHandle) frontHandle.locked = false;
        front.classList.remove('lv8-settle', 'is-idle');
        if (phase <= 2) front.classList.add('is-idle');
      }

      /* ---------------- 阶段 1：合上前封面 ---------------- */
      function snapPhase1() {
        settleToBack();
        ctx.timer(360, function () {
          back.classList.add('lv8-closed');
          var c = OS.center(back);
          NF.Audio.play('sparkle', { volume: 0.8 });
          NF.FX.flash('rgba(255,238,180,.35)', 220);
          NF.FX.burst(c.x, c.y, {
            count: 26, colors: ['#ffc94d', '#ffe08a', '#fff', '#8a6cff'], speed: 7, gravity: 0.18
          });
          ctx.timer(420, function () {
            // 又弹开了：进入卡扣对齐阶段
            back.classList.remove('lv8-closed');
            phase = 2;
            dial.dataset.phase = '2';
            setPips();
            targetAngle = OS.pick([-60, -45, -30, -15, 15, 30, 45, 60]);
            angle = 0;
            dial.style.setProperty('--target', targetAngle + 'deg');
            dial.style.setProperty('--angle', angle + 'deg');
            dial.classList.add('show');
            front.classList.remove('lv8-settle');
            front.style.left = frontHome.x + 'px';
            front.style.top = frontHome.y + 'px';
            front.classList.add('is-idle');
            NF.Audio.play('boing');
            NF.Audio.play('giggle', { volume: 0.35 });
            unlockDrag();
            ctx.timer(900, function () { if (!completed) ctx.replayHint(); });
          });
        });
      }

      /* ---------------- 阶段 2：对齐卡扣 ---------------- */
      function updateAlign() {
        aligned = Math.abs(angle - targetAngle) < 1;
        dial.classList.toggle('is-aligned', aligned);
        stage.classList.toggle('lv8-aligned', aligned);
        dial.dataset.aligned = aligned ? '1' : '0';
        dial.dataset.angle = String(angle);
        dial.dataset.target = String(targetAngle);
        dial.style.setProperty('--angle', angle + 'deg');
        if (aligned) NF.Audio.play('tick', { volume: 0.4 });
        else NF.Audio.play('hover', { volume: 0.18 });
      }

      function rotateBy(step) {
        if (phase !== 2 || busy || completed) return;
        angle = OS.clamp(angle + step, -90, 90);
        updateAlign();
      }

      ctx.on(window, 'keydown', function (e) {
        if (phase !== 2 || completed) return;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          rotateBy(-15);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          rotateBy(15);
        }
      });

      function snapPhase2() {
        settleToBack();
        ctx.timer(380, function () {
          back.classList.add('lv8-closed');
          var c = OS.center(back);
          NF.Audio.play('snap', { volume: 0.95 });
          NF.Audio.play('sparkle', { volume: 0.7 });
          NF.FX.flash('rgba(126,240,192,.32)', 220);
          NF.FX.burst(c.x, c.y, {
            count: 30, colors: ['#7ef0c0', '#ffd45c', '#ffffff'], speed: 8, gravity: 0.16
          });
          ctx.timer(520, function () {
            // 第三阶段：它想自己弹开
            phase = 3;
            dial.dataset.phase = '3';
            dial.classList.remove('show');
            setPips();
            back.classList.remove('lv8-closed');
            front.classList.remove('lv8-settle');
            front.classList.add('lv8-ajar');
            ctx.timer(420, function () { front.classList.remove('lv8-ajar'); });
            NF.Audio.play('boing', { volume: 0.9 });
            NF.Audio.play('giggle', { volume: 0.4 });
            showHold();
            unlockDrag();
            ctx.timer(700, function () { if (!completed) ctx.replayHint(); });
          });
        });
      }

      /* ---------------- 阶段 3：按住它 ---------------- */
      function showHold() {
        holdRing.classList.add('show');
        NF.Audio.play('select', { volume: 0.4 });
      }

      function startHold(e) {
        if (phase !== 3 || busy || completed || holding) return;
        if (e.button !== undefined && e.button !== 0) return;
        holding = true;
        var p = backCenterLocal();
        holdRing.style.left = p.x + 'px';
        holdRing.style.top = p.y + 'px';
        holdRing.classList.add('show');
        front.classList.add('lv8-wobble');
        var fg = holdRing.querySelector('.fg');
        var dur = 1500;
        var t0 = performance.now();
        NF.Audio.play('paper', { volume: 0.4 });
        function tick(now) {
          if (!holding) return;
          var pgs = Math.min(1, (now - t0) / dur);
          fg.style.strokeDashoffset = String(552 * (1 - pgs));
          if (pgs < 1) {
            holdRaf = requestAnimationFrame(tick);
          } else {
            finishHold();
          }
        }
        holdRaf = requestAnimationFrame(tick);
      }

      function cancelHold() {
        if (!holding) return;
        holding = false;
        cancelAnimationFrame(holdRaf);
        front.classList.remove('lv8-wobble');
        var fg = holdRing.querySelector('.fg');
        fg.style.strokeDashoffset = '552';
        holdRing.classList.remove('show');
        if (completed) return;
        front.classList.add('lv8-ajar');
        NF.Audio.play('boing', { volume: 0.8 });
        NF.Audio.play('deny', { volume: 0.4 });
        ctx.timer(500, function () { front.classList.remove('lv8-ajar'); });
        ctx.timer(250, function () { if (phase === 3 && !completed) holdRing.classList.add('show'); });
      }

      function finishHold() {
        if (!holding) return;
        holding = false;
        busy = true;
        completed = true;
        cancelAnimationFrame(holdRaf);
        front.classList.remove('lv8-wobble');
        holdRing.classList.remove('show');
        front.classList.add('lv8-settle');
        NF.Audio.play('snap', { volume: 1 });
        var c = OS.center(back);
        NF.FX.flash('rgba(255,238,180,.55)', 280);
        NF.FX.shake(7, 300);
        NF.FX.confetti({ count: 70 });
        ctx.timer(320, function () {
          NF.FX.sparkle(c.x, c.y);
          NF.Audio.play('success');
          group.classList.add('lv8-fly');
          front.classList.add('lv8-fly');
          ctx.timer(480, function () {
            ctx.complete({ el: back, delay: 1200 });
          });
        });
      }

      ctx.on(front, 'pointerdown', startHold);
      ctx.on(window, 'pointerup', cancelHold);

      /* ---------------- 拖拽 ---------------- */
      frontHandle = OS.makeDraggable(front, {
        threshold: 3,
        canStart: function () { return (phase === 1 || phase === 2) && !busy && !completed; },
        onStart: function () {
          front.classList.remove('is-idle');
          front.classList.add('lv8-dragging');
          NF.Audio.play('hover', { volume: 0.2 });
        },
        onMove: function (e, st) {
          front.style.left = (frontHome.x + st.dx) + 'px';
          front.style.top = (frontHome.y + st.dy) + 'px';
          var near = distToBack() < 210;
          front.classList.toggle('lv8-near', near);
          back.classList.toggle('lv8-target', near);
        },
        onEnd: function () {
          front.classList.remove('lv8-dragging');
          if (completed || busy) return;
          var d = distToBack();
          var ov = overBack();
          if (phase === 1) {
            if (d < 140 || ov > 0.42) snapPhase1();
            else springBack();
          } else if (phase === 2) {
            if (d < 125 || ov > 0.36) {
              if (aligned) snapPhase2();
              else {
                NF.Audio.play('deny');
                dial.classList.add('is-wrong');
                ctx.timer(400, function () { dial.classList.remove('is-wrong'); });
                springBack();
              }
            } else {
              springBack();
            }
          }
        }
      });

      /* ---------------- 幽灵演示（按阶段切换） ---------------- */
      demo = async function () {
        if (completed || busy) return;
        if (phase === 1) {
          await NF.Ghost.play([
            { move: '[data-t="d3-back"]', dur: 540 },
            { highlight: '[data-t="d3-back"]', dur: 650 },
            { move: '[data-t="d3-front"]', dur: 540 },
            { highlight: '[data-t="d3-front"]', dur: 620 },
            { drag: { from: '[data-t="d3-front"]', to: '[data-t="d3-back"]', dur: 950, after: 260 } },
            { wait: 200 }
          ]);
        } else if (phase === 2) {
          await NF.Ghost.play([
            { move: '[data-t="d3-dial"]', dur: 460 },
            { highlight: '[data-t="d3-dial"]', dur: 780 },
            { keys: 'ArrowLeft', dur: 700 },
            { keys: 'ArrowRight', dur: 700 },
            { wait: 150 },
            { drag: { from: '[data-t="d3-front"]', to: '[data-t="d3-back"]', dur: 900, after: 240 } },
            { wait: 150 }
          ]);
        } else {
          holdRing.classList.add('show');
          await NF.Ghost.play([
            { move: '[data-t="d3-back"]', dur: 420 },
            { highlight: '[data-t="d3-hold"]', dur: 620 },
            { hold: '[data-t="d3-back"]', dur: 1500 },
            { wait: 150 }
          ]);
          holdRing.classList.remove('show');
        }
      };
      ctx.hint(demo);

      setPips();
      ctx.qa('l08', ctx.root);
    }
  });
})();

</script>
<script data-src="js/levels/l09.js">
/* js/levels/l09.js */
/* 第 9 关：清理大师 —— 建好文件夹后，必须在机器人吸走它之前拖进安全罐，共 3 个 */
(function () {
  'use strict';
  var ID = 9;
  var OS = NF.OS;

  NF.Game.registerLevel({
    id: ID,
    icon: 'robot',
    init: function (ctx) {
      var saved = 0;
      var round = 0;           // 0..2
      var folder = null;
      var dragHandle = null;
      var robotState = 'patrol'; // patrol | hunt | dizzy | win
      var robotX = innerWidth - 180;
      var robotDir = -1;
      var targetX = 0;
      var huntSpeed = 190;
      var spotTimer = 0;
      var eatLocked = false;
      var finished = false;
      var demoFolder = null;

      var root = ctx.root;
      var jar = document.createElement('div');
      jar.className = 'lv9-jar';
      jar.dataset.t = 'jar-drop';
      jar.innerHTML = '<div class="lv9-jar-icon">' + NF.icons.svg('jar') + '</div>';
      var slotsWrap = document.createElement('div');
      slotsWrap.className = 'lv9-slots';
      for (var i = 0; i < 3; i++) {
        var slot = document.createElement('div');
        slot.className = 'lv9-slot';
        slot.dataset.t = 'slot-' + (i + 1);
        slotsWrap.appendChild(slot);
      }
      jar.appendChild(slotsWrap);
      root.appendChild(jar);

      var vignette = document.createElement('div');
      vignette.className = 'lv9-vignette';
      root.appendChild(vignette);

      var robot = document.createElement('div');
      robot.className = 'lv9-robot';
      robot.dataset.t = 'robot';
      robot.innerHTML = '<div class="lv9-beam"></div><div class="lv9-robot-body">' + NF.icons.svg('robot') + '</div><div class="lv9-robot-hint"></div>';
      root.appendChild(robot);

      var dust = document.createElement('div');
      dust.className = 'lv9-dust';
      root.appendChild(dust);

      var board = document.createElement('div');
      board.className = 'lv9-board';
      board.innerHTML = '<div class="lv9-board-title">' + NF.icons.svg('robot') + '<span class="lv9-pips"><i></i><i></i><i></i></span></div>';
      root.appendChild(board);
      var pips = board.querySelectorAll('.lv9-pips i');

      ctx.style([
        '.lv9-jar{position:absolute;right:46px;top:44px;width:150px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:42;transition:filter .25s ease;}',
        '.lv9-jar .lv9-jar-icon{width:116px;filter:drop-shadow(0 20px 28px rgba(0,0,0,.55));transition:transform .3s cubic-bezier(.34,1.56,.64,1);}',
        '.lv9-jar .lv9-jar-icon svg{width:100%;height:auto;display:block;}',
        '.lv9-jar.is-hot .lv9-jar-icon{animation:lv9-jar-hot 1.1s ease-in-out infinite;}',
        '@keyframes lv9-jar-hot{0%,100%{transform:scale(1);filter:drop-shadow(0 20px 28px rgba(0,0,0,.55));}50%{transform:scale(1.06);filter:drop-shadow(0 0 26px rgba(255,212,92,.55));}}',
        '.lv9-slots{display:flex;gap:8px;}',
        '.lv9-slot{width:36px;height:32px;border-radius:7px;border:2px dashed rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);transition:all .3s ease;}',
        '.lv9-slot .nf-ico{width:30px;height:30px;animation:folder-pop .45s cubic-bezier(.34,1.56,.64,1) both;}',
        '.lv9-slot.filled{border-color:transparent;background:rgba(255,212,92,.08);}',
        '.lv9-vignette{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 80%,transparent 45%,rgba(255,64,90,.22) 100%);transition:opacity .4s ease;z-index:34;}',
        '.lv9-vignette.on{opacity:1;}',
        '.lv9-robot{position:absolute;left:0;top:0;width:150px;z-index:38;pointer-events:none;will-change:transform;filter:drop-shadow(0 22px 26px rgba(0,0,0,.5));}',
        '.lv9-robot .lv9-robot-body{width:100%;animation:lv9-bob 1.6s ease-in-out infinite;}',
        '.lv9-robot .lv9-robot-body svg{width:100%;display:block;}',
        '@keyframes lv9-bob{0%,100%{transform:translateY(0) rotate(-1.2deg);}50%{transform:translateY(-5px) rotate(1.2deg);}}',
        '.lv9-beam{position:absolute;left:50%;bottom:42%;width:190px;height:220px;transform:translate(-50%,0) scaleY(.2);transform-origin:50% 100%;',
        'background:linear-gradient(0deg,rgba(126,240,192,.32),rgba(126,240,192,.02));clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);',
        'opacity:0;transition:opacity .25s ease,transform .3s ease;filter:blur(2px);}',
        '.lv9-robot.is-hunting .lv9-beam{opacity:1;transform:translate(-50%,0) scaleY(1);animation:lv9-beam-flicker .6s ease-in-out infinite;}',
        '@keyframes lv9-beam-flicker{0%,100%{opacity:.55;}50%{opacity:.95;}}',
        '.lv9-robot.is-hunting .lv9-robot-body{animation:lv9-shake .16s linear infinite;}',
        '@keyframes lv9-shake{0%,100%{transform:translate(0,0);}25%{transform:translate(-2px,1px);}75%{transform:translate(2px,-1px);}}',
        '.lv9-robot.is-dizzy .lv9-robot-body{animation:lv9-dizzy 1s ease-in-out infinite;}',
        '@keyframes lv9-dizzy{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg) translateY(-4px);}75%{transform:rotate(8deg) translateY(-4px);}}',
        '.lv9-robot.is-win .lv9-robot-body{animation:lv9-win 1.2s ease-in-out infinite;}',
        '@keyframes lv9-win{0%,100%{transform:rotate(0) scale(1);}50%{transform:rotate(12deg) scale(1.04);}}',
        '.lv9-board{position:absolute;left:50%;top:22px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;',
        'background:rgba(16,14,36,.6);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;z-index:43;pointer-events:none;}',
        '.lv9-board .nf-ico{width:24px;height:24px;}',
        '.lv9-board-title{display:flex;align-items:center;gap:12px;}',
        '.lv9-pips{display:flex;gap:6px;}',
        '.lv9-pips i{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.18);transition:all .3s ease;}',
        '.lv9-pips i.on{background:#ffc94d;box-shadow:0 0 10px rgba(255,201,77,.75);}',
        '.lv9-eat{animation:lv9-eat .6s cubic-bezier(.3,.7,.3,1) forwards !important;}',
        '@keyframes lv9-eat{0%{transform:scale(1) rotate(0);opacity:1;}60%{transform:scale(.6) rotate(35deg) translateY(10px);opacity:.9;}100%{transform:scale(.05) rotate(80deg) translateY(30px);opacity:0;}}',
        '.lv9-dust{position:absolute;right:150px;bottom:52px;width:220px;height:60px;pointer-events:none;opacity:0;transition:opacity .3s;}',
        '.lv9-dust.on{opacity:1;animation:lv9-dust 1.5s linear infinite;}',
        '@keyframes lv9-dust{0%{background:radial-gradient(circle at 10% 70%,rgba(255,255,255,.22),transparent 25%);}100%{background:radial-gradient(circle at 90% 30%,rgba(255,255,255,.12),transparent 25%);}}',
        '.lv9-demo{position:absolute;width:76px;pointer-events:none;z-index:44;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));}',
        '.lv9-demo svg{width:100%;height:auto;display:block;}'
      ].join(''));

      function jarRect() { return OS.rect(jar); }
      function levelH() { return root.clientHeight || innerHeight - 58; }
      function floorY() { return levelH() - 160; }

      function placeRobot() {
        robot.style.transform = 'translate3d(' + robotX.toFixed(1) + 'px,' + floorY().toFixed(1) + 'px,0)';
      }
      placeRobot();

      function playPips() {
        pips.forEach(function (p, i) { p.classList.toggle('on', i < saved); });
      }

      function openMenuAt(x, y) {
        OS.closeMenus();
        var canCreate = !folder && saved < 3 && !finished;
        OS.menu({
          x: x, y: y,
          items: [
            { id: 'view', label: '查看', icon: 'eye', disabled: true },
            { id: 'refresh', label: '刷新', icon: 'restart', onSelect: function () { NF.Audio.play('whoosh'); } },
            { separator: true },
            {
              id: 'new', label: '新建', icon: 'folder', disabled: !canCreate,
              submenu: [
                {
                  id: 'folder', label: '文件夹', icon: 'folder', testid: 'menu-item-folder', disabled: !canCreate,
                  onSelect: createFolder
                },
                { id: 'text', label: '文本文档', icon: 'fileText', onSelect: function () { NF.Audio.play('deny'); } }
              ]
            }
          ]
        });
      }

      function createFolder() {
        if (folder || saved >= 3 || finished) { NF.Audio.play('deny'); return; }
        OS.closeMenus();
        var x = OS.rand(innerWidth * 0.14, Math.min(innerWidth * 0.62, innerWidth - 220));
        var y = OS.rand(levelH() * 0.32, levelH() * 0.52);
        folder = ctx.createdFolder({ x: x, y: y, label: '新建文件夹', testid: 'created-folder' });
        NF.Audio.play('pop');
        NF.FX.burst(x + 38, y + 30, { count: 14, colors: ['#ffc94d', '#ffffff'], speed: 5, gravity: 0.2 });
        jar.classList.add('is-hot');
        dragHandle = OS.makeDraggable(folder, {
          threshold: 3,
          onStart: function () {
            NF.Audio.play('paper', { volume: 0.5 });
            folder.style.zIndex = '55';
          },
          onMove: function (e, st) {
            if (!folder) return;
            folder.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) rotate(' + Math.max(-8, Math.min(8, st.dx * 0.04)) + 'deg)';
            var jr = jarRect();
            var over = e.clientX > jr.left - 30 && e.clientX < jr.right + 30 && e.clientY > jr.top - 30 && e.clientY < jr.bottom + 60;
            folder.classList.toggle('lv9-over-jar', over);
          },
          onEnd: function (e, st) {
            if (!folder) return;
            var jr = jarRect();
            var within = e.clientX >= jr.left - 20 && e.clientX <= jr.right + 20 && e.clientY >= jr.top - 20 && e.clientY <= jr.bottom + 70;
            if (within) saveFolder();
            else {
              OS.commitDrag(folder, st.dx, st.dy);
              folder.style.transform = '';
              NF.Audio.play('thud', { volume: 0.4 });
            }
          }
        });

        var spotDelay = [900, 680, 480][Math.min(round, 2)];
        spotTimer = ctx.timer(spotDelay, function () {
          if (!folder || finished) return;
          startHunt();
        });
      }

      function startHunt() {
        if (!folder || robotState === 'dizzy' || robotState === 'win') return;
        robotState = 'hunt';
        robot.classList.add('is-hunting');
        vignette.classList.add('on');
        dust.classList.add('on');
        NF.Audio.play('robot', { volume: 0.8 });
        targetX = OS.center(folder).x - 75;
      }

      function stopHunt() {
        robotState = 'patrol';
        robot.classList.remove('is-hunting');
        vignette.classList.remove('on');
        dust.classList.remove('on');
      }

      function eatFolder() {
        if (!folder) { stopHunt(); return; }
        if (folder.classList.contains('dragging') || eatLocked) return; // 等玩家松手再吃，避免拖拽状态卡死
        eatLocked = true;
        stopHunt();
        robotState = 'dizzy';
        robot.classList.add('is-dizzy');
        NF.Audio.play('slurp');
        NF.Audio.play('error', { volume: 0.6 });
        if (dragHandle) { try { dragHandle.destroy(); } catch (e) {} dragHandle = null; }
        var f = folder;
        folder = null;
        f.classList.add('lv9-eat');
        f.style.transform = '';
        NF.FX.shake(7, 260);
        OS.toast({ icon: 'robot', title: '文件夹被清理了', kind: 'error', ms: 1600 });
        ctx.timer(650, function () { if (f.parentNode) f.remove(); });
        ctx.timer(1250, function () {
          robot.classList.remove('is-dizzy');
          robotState = 'patrol';
          eatLocked = false;
          jar.classList.add('is-hot');
          NF.Audio.play('powerdown', { volume: 0.4 });
        });
      }

      function saveFolder() {
        if (!folder || finished) return;
        NF.Audio.play('snap');
        NF.Audio.play('sparkle');
        var f = folder;
        folder = null;
        jar.classList.remove('is-hot');
        if (dragHandle) { dragHandle.destroy(); dragHandle = null; }
        f.classList.remove('dragging');
        f.style.transform = '';
        var fr = OS.rect(f);
        var jr = jarRect();
        NF.FX.fly(fr, jr, {
          duration: 620, arc: -110, html: NF.icons.svg('folder'),
          onDone: function () {
            NF.FX.burst(jr.left + jr.width / 2, jr.top + jr.height / 2, {
              count: 20, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 6, gravity: 0.12
            });
          }
        });
        f.remove();
        saved++;
        playPips();
        var slot = jar.querySelectorAll('.lv9-slot')[saved - 1];
        if (slot) {
          slot.classList.add('filled');
          slot.innerHTML = NF.icons.svg('folder');
          NF.FX.sparkle(OS.center(slot).x, OS.center(slot).y);
        }
        stopHunt();
        robotState = 'dizzy';
        robot.classList.add('is-dizzy');
        ctx.timer(950, function () {
          robot.classList.remove('is-dizzy');
          robotState = 'patrol';
          if (saved >= 3) winLevel();
          else startRound();
        });
      }

      function startRound() {
        if (saved >= 3 || finished) return;
        round = Math.min(2, saved);
        // 不强制清空 folder：玩家可能在机器人晕眩的窗口期已经抢先建好了下一个
        robotState = 'patrol';
        jar.classList.add('is-hot');
        // 提示安全罐
        var jr = jarRect();
        NF.FX.ripple(jr.left + jr.width / 2, jr.top + jr.height / 2, { color: 'rgba(255,212,92,.5)', radius: 90 });
      }

      function winLevel() {
        if (finished) return;
        finished = true;
        robotState = 'win';
        robot.classList.add('is-win');
        stopHunt();
        jar.classList.remove('is-hot');
        NF.Audio.play('success');
        NF.Audio.play('explode', { volume: 0.5 });
        NF.FX.confetti({ count: 110 });
        NF.FX.shake(6, 300);
        var jr = jarRect();
        NF.FX.burst(jr.left + jr.width / 2, jr.top + jr.height / 2, {
          count: 50, colors: ['#ffc94d', '#ff6ba9', '#8a6cff', '#7ef0c0', '#ffffff'], speed: 11, gravity: 0.24
        });
        ctx.complete({ x: jr.left + jr.width / 2, y: jr.top + jr.height / 2, delay: 1500 });
      }

      // ---------------- 机器人巡检 ----------------
      var last = performance.now();
      ctx.raf(function (now) {
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (finished) {
          robot.style.transform = 'translate3d(' + robotX.toFixed(1) + 'px,' + (floorY() - 8).toFixed(1) + 'px,0) rotate(-6deg)';
          return;
        }
        if (robotState === 'hunt') {
          var dx = targetX - robotX;
          var sp = [190, 235, 285][Math.min(round, 2)];
          if (Math.abs(dx) > 6) robotX += Math.sign(dx) * Math.min(Math.abs(dx), sp * dt);
          robot.classList.toggle('is-hunting', true);
          if (folder && !folder.classList.contains('dragging') && Math.abs(robotX + 75 - OS.center(folder).x) < 105) {
            eatFolder();
          }
        } else if (robotState === 'patrol') {
          robotX += robotDir * 62 * dt;
          if (robotX < 260) { robotX = 260; robotDir = 1; }
          if (robotX > innerWidth - 300) { robotX = innerWidth - 300; robotDir = -1; }
        }
        placeRobot();
      });

      ctx.on(root, 'contextmenu', function (e) {
        e.preventDefault();
        if (finished) return;
        openMenuAt(e.clientX, e.clientY);
      });

      ctx.on(window, 'keydown', function (e) {
        if (finished) return;
        if (OS.matchCombo(e, 'Ctrl+Shift+F')) {
          e.preventDefault();
          createFolder();
        }
      });

      startRound();
      ctx.hint = async function () {
        OS.closeMenus();
        if (demoFolder && demoFolder.parentNode) demoFolder.remove();
        var cx = innerWidth / 2, cy = levelH() * 0.44;
        await NF.Ghost.play([
          { move: [cx, cy], dur: 400 },
          {
            click: 'right', target: [cx, cy], after: 220,
            do: function () { openMenuAt(cx, cy); }
          },
          { move: '[data-t="menu-item-new"]', dur: 420 },
          {
            click: 'left', target: '[data-t="menu-item-new"]', after: 200,
            do: function () { var r = OS.rootMenu(); if (r) r.openSub(r.items.filter(function (i) { return i.id === 'new'; })[0]); }
          },
          { wait: 200 },
          { move: '[data-t="menu-item-folder"]', dur: 420 },
          { click: 'left', target: '[data-t="menu-item-folder"]', after: 220, do: function () { OS.closeMenus(); } },
          {
            do: function () {
              demoFolder = document.createElement('div');
              demoFolder.className = 'lv9-demo';
              demoFolder.innerHTML = NF.icons.svg('folder');
              demoFolder.style.left = (cx - 38) + 'px';
              demoFolder.style.top = (cy - 30) + 'px';
              root.appendChild(demoFolder);
              demoFolder.style.animation = 'folder-pop .5s cubic-bezier(.34,1.56,.64,1) both';
            }
          },
          { highlight: '[data-t="jar-drop"]', dur: 600 },
          { wait: 150 },
          {
            drag: {
              from: function () { return demoFolder; },
              to: '[data-t="jar-drop"]',
              dur: 1000
            }
          },
          { wait: 200 },
          {
            do: function () {
              if (demoFolder) { demoFolder.remove(); demoFolder = null; }
            }
          }
        ]);
      };
      ctx.onCleanup(function () { if (demoFolder && demoFolder.parentNode) demoFolder.remove(); });
    }
  });
})();

</script>
<script data-src="js/levels/l10.js">

   2. 把它拖到自己的"影子"上 → 递归炸裂；
   3. 游戏被折叠进两个迷你游戏窗口，把大文件夹丢进"正确"那个窗口的玻璃罐里。

      ctx.style([

        'animation:lv10-shadow-in .3s cubic-bezier(.34,1.56,.64,1) both;}',

        '.lv10-shadow::after{content:"";position:absolute;inset:-10px;border:2px dashed rgba(255,212,92,.75);border-radius:16px;animation:lv10-dash 6s linear infinite;}',
        '@keyframes lv10-shadow-in{from{opacity:0;transform:scale(.7);}to{opacity:.85;transform:scale(1);}}',
        '@keyframes lv10-dash{to{transform:rotate(360deg);}}',
        '.lv10-shadow.is-hot{filter:drop-shadow(0 0 30px rgba(255,212,92,.95));opacity:1;}',
        '.lv10-shadow.is-hot::after{border-color:#fff;box-shadow:0 0 30px rgba(255,212,92,.6);}',
        '.lv10-spark-ring{position:absolute;width:120px;height:120px;margin:-60px;border-radius:50%;border:2px solid rgba(255,212,92,.5);',
        'pointer-events:none;animation:lv10-ring 2.4s ease-out infinite;z-index:24;}',
        '@keyframes lv10-ring{0%{transform:scale(.5);opacity:.9;}100%{transform:scale(1.5);opacity:0;}}',
        '.lv10-demo{position:absolute;width:76px;pointer-events:none;z-index:44;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));}',
        '.lv10-demo svg{width:100%;height:auto;display:block;}',
        '.lv10-demo-shadow{position:absolute;width:76px;pointer-events:none;z-index:43;opacity:.55;filter:drop-shadow(0 0 11px rgba(255,212,92,.45));}',
        '.lv10-demo-shadow svg{width:100%;height:auto;display:block;}',
        '.lv10-vortex{position:absolute;inset:0;z-index:58;pointer-events:none;overflow:hidden;',
        'background:radial-gradient(circle at 50% 46%,rgba(255,212,92,.2),rgba(10,8,26,.2) 45%,transparent 70%);}',
        '.lv10-vortex::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,rgba(138,108,255,.16),transparent,rgba(255,107,169,.13),transparent);animation:lv10-spin 2.4s linear infinite;}',
        '@keyframes lv10-spin{to{transform:rotate(360deg);}}',
        '.lv10-layer{position:absolute;left:50%;top:46%;width:min(46vw,560px);height:min(31vw,330px);border-radius:14px;border:1px solid rgba(255,255,255,.22);',
        'background:rgba(16,14,38,.82);overflow:hidden;transform:translate(-50%,-50%) scale(var(--s));',
        'box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.05);',
        'animation:lv10-pulse var(--dur) ease-in-out infinite alternate;animation-delay:var(--d);}',
        '.lv10-layer .lv10-bar{height:22px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:5px;padding:0 8px;}',
        '.lv10-layer .lv10-bar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);}',
        '.lv10-layer .lv10-body{height:calc(100% - 22px);display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 20%,rgba(96,72,190,.35),transparent 60%);}',
        '.lv10-layer .lv10-body .nf-ico{width:100px;height:100px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));}',
        '@keyframes lv10-pulse{from{filter:brightness(.88);}to{filter:brightness(1.14);}}',
        'body.lv10-glitch #os{animation:lv10-glitch .28s steps(2) infinite;}',
        '@keyframes lv10-glitch{0%{filter:hue-rotate(0) saturate(1);}50%{filter:hue-rotate(26deg) saturate(1.5);}100%{filter:hue-rotate(-12deg) saturate(.9);}}',
        '.lv10-folder-pop{animation:lv10-folder-pop .6s cubic-bezier(.34,1.56,.64,1) both !important;}',
        '@keyframes lv10-folder-pop{0%{transform:scale(.2) rotate(-8deg);opacity:0;}60%{transform:scale(1.12) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(0);}}',
        /* ===== 迷你游戏窗口（第四面墙） ===== */
        '.lv10-meta{position:absolute;inset:0;z-index:60;pointer-events:none;overflow:hidden;',
        'background:radial-gradient(ellipse at 50% 42%,rgba(28,20,64,.9),rgba(5,4,14,.97));}',
        '.lv10-meta::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.7),transparent 60%),',
        'radial-gradient(1.5px 1.5px at 70% 20%,rgba(255,255,255,.55),transparent 60%),',
        'radial-gradient(1px 1px at 40% 75%,rgba(255,255,255,.5),transparent 60%),',
        'radial-gradient(1.4px 1.4px at 85% 65%,rgba(255,255,255,.6),transparent 60%);opacity:.6;}',
        '.lv10-frame{position:absolute;width:320px;height:212px;border-radius:12px;background:rgba(20,18,48,.92);',
        'border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 60px rgba(0,0,0,.55);overflow:hidden;',
        'transform:translate(-50%,-50%) rotate(var(--rot,0deg));opacity:0;transition:opacity .5s ease;will-change:left,top,transform;}',
        '.lv10-frame.show{opacity:1;}',
        '.lv10-frame.lv10-decoy{border-color:rgba(255,255,255,.1);filter:saturate(.7) brightness(.92);}',
        '.lv10-frame-bar{height:24px;display:flex;align-items:center;gap:5px;padding:0 9px;background:rgba(255,255,255,.08);}',
        '.lv10-frame-bar i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);}',
        '.lv10-frame-bar span{margin-left:6px;font-size:9.5px;color:rgba(238,240,255,.55);letter-spacing:.08em;}',
        '.lv10-frame-body{position:relative;height:calc(100% - 24px);background:',
        'radial-gradient(ellipse at 30% 20%,rgba(98,74,200,.5),transparent 60%),linear-gradient(150deg,#191338,#111a33 70%,#0c1126);}',
        '.lv10-frame-icons{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;}',
        '.lv10-frame-icons .nf-ico{width:34px;height:34px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));opacity:.9;}',
        '.lv10-frame-icons span{font-size:7.5px;color:rgba(255,255,255,.4);text-align:center;}',
        '.lv10-frame-taskbar{position:absolute;left:8px;right:8px;bottom:7px;height:32px;border-radius:8px;',
        'background:rgba(10,9,26,.75);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;padding:0 7px;}',
        '.lv10-frame-taskbar .nf-ico{width:22px;height:22px;}',
        '.lv10-frame-mascot{margin-left:auto;width:22px;height:22px;}',
        '.lv10-frame-mascot svg{width:100%;height:100%;}',
        '.lv10-frame-jar{position:relative;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;',
        'cursor:default;transition:transform .2s ease,box-shadow .3s ease;}',
        '.lv10-frame-jar svg{width:24px;height:24px;}',
        '.lv10-frame.is-real .lv10-frame-jar{box-shadow:0 0 0 1px rgba(255,212,92,.55),0 0 16px rgba(255,212,92,.55);animation:lv10-jar-pulse 1.6s ease-in-out infinite;}',
        '@keyframes lv10-jar-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}',
        '.lv10-frame.is-real .lv10-frame-mascot{filter:drop-shadow(0 0 6px rgba(255,201,77,.8));}',
        '.lv10-frame .lv10-frame-target{position:absolute;inset:auto 6px 5px 6px;height:36px;border-radius:8px;pointer-events:none;}',
        '.lv10-frame.is-real .lv10-frame-target{box-shadow:inset 0 0 0 1px rgba(255,212,92,.35);}',
        '.lv10-open-hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);text-align:center;color:rgba(238,240,255,.55);',
        'font-size:12px;letter-spacing:.2em;pointer-events:none;animation:fade-in .8s ease both;z-index:61;}',
        '.lv10-open-hint .nf-ico{width:30px;height:30px;display:block;margin:0 auto 6px;}',
        '.lv10-fake-glow{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;pointer-events:none;',
        'background:radial-gradient(circle,rgba(255,93,122,.7),transparent 65%);animation:lv10-ring 1.6s ease-out infinite;}'
      ].join(''));

      var glow = document.createElement('div');
      glow.className = 'lv10-glow';
      ctx.root.appendChild(glow);

      function levelH() { return ctx.root.clientHeight || (innerHeight - 58); }

      function menuItems() {
        var canCreate = !folder && !recursionStarted;
        return [
          { id: 'view', label: '查看', icon: 'eye', disabled: true },
          { id: 'sort', label: '排序方式', icon: 'arrowDown', disabled: true },
          { id: 'refresh', label: '刷新', icon: 'restart', onSelect: function () { NF.Audio.play('whoosh'); } },
          { separator: true },
          {
            id: 'new', label: '新建', icon: 'folder',
            submenu: [
              { id: 'folder', label: '文件夹', icon: 'folder', testid: 'menu-item-folder', disabled: !canCreate, onSelect: function () { openNameDialog(); } },
              { id: 'text', label: '文本文档', icon: 'fileText', onSelect: function () { NF.Audio.play('deny'); } }
            ]
          },
          { separator: true },
          { id: 'personalize', label: '个性化', icon: 'settings', onSelect: function () { NF.Audio.play('deny'); } }
        ];
      }

      function openMenuAt(x, y) {
        OS.closeMenus();
        OS.menu({ x: x, y: y, items: menuItems() });
      }

      function openNameDialog() {
        if (folder || dlg || recursionStarted) return;
        OS.closeMenus();
        dlg = OS.nameDialog({
          title: '新建文件夹',
          icon: 'folder',
          value: '新建文件夹',
          onSubmit: function (name) {
            dlg = null;
            makeFolder(name || '新建文件夹');
            return true;
          },
          onClose: function () { dlg = null; }
        });
      }

      /* ---------------- 阶段 1：建文件夹 ---------------- */
      function makeFolder(name) {
        if (folder || recursionStarted) return;
        stage = 2;
        folderHome.x = innerWidth / 2 - 38;
        folderHome.y = levelH() * 0.4 - 30;
        folder = ctx.createdFolder({ x: folderHome.x, y: folderHome.y, label: name, testid: 'created-folder' });
        folder.classList.add('lv10-folder-pop');
        NF.Audio.play('pop');
        NF.FX.burst(folderHome.x + 38, folderHome.y + 32, { count: 22, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 6, gravity: 0.18 });
        NF.FX.sparkle(folderHome.x + 38, folderHome.y + 32);

        var ring = document.createElement('div');
        ring.className = 'lv10-spark-ring';
        ring.style.left = (folderHome.x + 38) + 'px';
        ring.style.top = (folderHome.y + 34) + 'px';
        ctx.root.appendChild(ring);
        setTimeout(function () { if (ring.parentNode) ring.remove(); }, 5200);

        bindFolderDrag('shadow');
        ctx.timer(1000, function () { if (!recursionStarted) ctx.replayHint(); });
      }

      function bindFolderDrag(mode) {
        if (dragHandle) { try { dragHandle.destroy(); } catch (e) {} dragHandle = null; }
        dragHandle = OS.makeDraggable(folder, {
          threshold: 3,
          canStart: function () { return !completed && (mode === 'shadow' ? !recursionStarted : metaActive); },
          onStart: function () {
            NF.Audio.play('paper', { volume: 0.5 });
            if (mode === 'shadow') {
              NF.Audio.play('giggle', { volume: 0.3 });
              makeShadow();
            } else {
              folder.classList.add('lv10-big');
              metaDragging = true;
            }
          },
          onMove: function (e, st) {
            folder.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) scale(1.05) rotate(' + Math.max(-7, Math.min(7, st.dx * 0.03)) + 'deg)';
            if (mode === 'shadow' && shadow) {
              shadow.classList.toggle('is-hot', OS.overlapRatio(folder, shadow) > 0.18);
            } else if (mode === 'meta') {
              var real = jarReal.getBoundingClientRect();
              var fake = jarFake.getBoundingClientRect();
              var nearReal = Math.hypot(e.clientX - (real.left + real.width / 2), e.clientY - (real.top + real.height / 2)) < 110;
              var nearFake = Math.hypot(e.clientX - (fake.left + fake.width / 2), e.clientY - (fake.top + fake.height / 2)) < 110;
              folder.classList.toggle('lv10-over-jar', nearReal || nearFake);
              if (nearReal) jarReal.classList.add('lv10-hot');
              else jarReal.classList.remove('lv10-hot');
            }
          },
          onEnd: function (e, st) {
            if (mode === 'shadow') {
              if (shadow && OS.overlapRatio(folder, shadow) > 0.22) triggerRecursion();
              else {
                if (shadow) { shadow.remove(); shadow = null; }
                OS.commitDrag(folder, st.dx, st.dy);
                folder.style.transform = '';
                folderHome.x = parseFloat(folder.style.left) || folderHome.x;
                folderHome.y = parseFloat(folder.style.top) || folderHome.y;
                NF.Audio.play('thud', { volume: 0.4 });
              }
            } else {
              // 丢向迷你窗口的罐子
              var real = jarReal.getBoundingClientRect();
              var fake = jarFake.getBoundingClientRect();
              var dReal = Math.hypot(e.clientX - (real.left + real.width / 2), e.clientY - (real.top + real.height / 2));
              var dFake = Math.hypot(e.clientX - (fake.left + fake.width / 2), e.clientY - (fake.top + fake.height / 2));
              jarReal.classList.remove('lv10-hot');
              metaDragging = false;
              if (dReal < 104) metaSuccess();
              else if (dFake < 104) metaWrong();
              else {
                OS.commitDrag(folder, st.dx, st.dy);
                folder.style.transform = '';
                NF.Audio.play('thud', { volume: 0.35 });
              }
            }
          }
        });
      }

      function makeShadow() {
        if (shadow) { shadow.remove(); shadow = null; }
        shadow = document.createElement('div');
        shadow.className = 'lv10-shadow';
        shadow.dataset.t = 'folder-shadow';
        shadow.innerHTML = NF.icons.svg('folder');
        shadow.style.left = folder.style.left;
        shadow.style.top = folder.style.top;
        ctx.root.appendChild(shadow);
        var c = OS.center(shadow);
        NF.FX.ripple(c.x, c.y, { color: 'rgba(255,212,92,.55)', radius: 60 });
      }

      /* ---------------- 阶段 2：递归炸裂 ---------------- */
      function triggerRecursion() {
        if (recursionStarted || completed) return;
        recursionStarted = true;
        if (dragHandle) { dragHandle.destroy(); dragHandle = null; }
        if (shadow) { shadow.remove(); shadow = null; }
        folder.style.pointerEvents = 'none';
        folder.style.transition = 'transform .7s cubic-bezier(.34,1.56,.64,1),opacity .7s ease';
        folder.style.transform = 'scale(1.35) rotate(-5deg)';
        ctx.timer(650, function () { folder.style.opacity = '0'; });
        document.body.classList.add('lv10-glitch');
        NF.Audio.play('whoosh');
        NF.Audio.play('explode', { volume: 0.75 });
        ctx.timer(160, function () { NF.Audio.play('alarm', { volume: 0.35 }); });
        var vortex = buildVortex();
        NF.FX.flash('rgba(255,255,255,.5)', 180);
        NF.FX.shake(9, 600);
        var cx = innerWidth / 2, cy = levelH() * 0.42;
        NF.FX.confetti({ count: 60 });
        ctx.timer(900, function () {
          NF.FX.flash('rgba(255,247,220,.7)', 220);
          NF.FX.burst(cx, cy, { count: 60, colors: ['#ffc94d', '#ff6ba9', '#8a6cff', '#7ef0c0', '#ffffff'], speed: 14, gravity: -0.05 });
        });
        ctx.timer(1300, function () {
          if (vortex.parentNode) vortex.remove();
          enterMeta();
        });
      }

      function buildVortex() {
        var vortex = document.createElement('div');
        vortex.className = 'lv10-vortex';
        vortex.dataset.t = 'recursion-vortex';
        for (var i = 0; i < 9; i++) {
          var layer = document.createElement('div');
          layer.className = 'lv10-layer';
          var s = 1 - i * 0.085;
          layer.style.setProperty('--s', s.toFixed(3));
          layer.style.setProperty('--d', (i * 120) + 'ms');
          layer.style.setProperty('--dur', (1.4 + i * 0.15) + 's');
          layer.style.transform = 'translate(-50%,-50%) scale(' + s + ') rotate(' + ((i % 2 ? -1 : 1) * i * 0.5) + 'deg)';
          layer.innerHTML = '<div class="lv10-bar"><i></i><i></i><i></i></div><div class="lv10-body">' + NF.icons.svg(i % 3 === 0 ? 'folderFace' : 'folder') + '</div>';
          vortex.appendChild(layer);
        }
        ctx.root.appendChild(vortex);
        return vortex;
      }

      /* ---------------- 阶段 3：游戏里的游戏 ---------------- */
      function enterMeta() {
        if (completed) return;
        stage = 3;
        metaActive = true;
        document.body.classList.remove('lv10-glitch');
        if (folder) {
          folder.style.transition = 'opacity .3s ease, transform .3s ease';
          folder.style.opacity = '1';
          folder.style.transform = '';
          folder.style.left = (innerWidth / 2 - 38) + 'px';
          folder.style.top = (levelH() * 0.2) + 'px';
          folder.style.zIndex = '80';
          folderHome.x = innerWidth / 2 - 38;
          folderHome.y = levelH() * 0.2;
          ctx.timer(320, function () {
            folder.style.transition = '';
            folder.style.pointerEvents = 'auto';
            if (folder) bindFolderDrag('meta');
          });
        }

        meta = document.createElement('div');
        meta.className = 'lv10-meta';
        meta.dataset.t = 'meta-layer';
        var real = makeFrame(true);
        var fake = makeFrame(false);
        meta.appendChild(real);
        meta.appendChild(fake);
        frames = [real, fake];

        var hint = document.createElement('div');
        hint.className = 'lv10-open-hint';
        hint.innerHTML = NF.icons.svg('window');
        meta.appendChild(hint);

        ctx.root.appendChild(meta);
        jarReal = real.querySelector('[data-t="meta-jar"]');
        jarFake = fake.querySelector('[data-t="meta-jar-fake"]');
        real.classList.add('show');
        fake.classList.add('show');
        NF.Audio.play('open');
        NF.Audio.play('giggle', { volume: 0.4 });

        // 两个迷你窗口绕中心漂移
        var t0 = performance.now();
        function drift(now) {
          var t = (now - t0) / 1000;
          var tMove = t * (metaDragging ? 0.22 : 1);
          var cx = innerWidth / 2;
          var cy = levelH() * 0.55;
          var r1x = 225, r1y = 105, r2x = 270, r2y = 130;
          var ax = cx + Math.cos(tMove * 0.32) * r1x;
          var ay = cy + Math.sin(tMove * 0.42) * r1y;
          var bx = cx + Math.cos(tMove * 0.28 + Math.PI + 0.7) * r2x;
          var by = cy + Math.sin(tMove * 0.4 + Math.PI + 0.7) * r2y;
          ax = OS.clamp(ax, 180, innerWidth - 180);
          bx = OS.clamp(bx, 180, innerWidth - 180);
          ay = OS.clamp(ay, 150, levelH() - 130);
          by = OS.clamp(by, 150, levelH() - 130);
          real.style.left = ax + 'px';
          real.style.top = ay + 'px';
          real.style.setProperty('--rot', (Math.sin(t * 0.5) * 3).toFixed(2) + 'deg');
          fake.style.left = bx + 'px';
          fake.style.top = by + 'px';
          fake.style.setProperty('--rot', (Math.cos(t * 0.42) * 4).toFixed(2) + 'deg');
          real.classList.toggle('is-real', true);
          phaseMove = t;
        }
        rafStop = OS.raf(drift);
        ctx.onCleanup(function () { if (rafStop) rafStop(); });

        ctx.timer(900, function () { if (metaActive && !completed) ctx.replayHint(); });
      }

      function makeFrame(isReal) {
        var el = document.createElement('div');
        el.className = 'lv10-frame' + (isReal ? ' is-real' : ' lv10-decoy');
        el.dataset.t = isReal ? 'meta-window-real' : 'meta-window-fake';
        el.innerHTML = '<div class="lv10-frame-bar"><i></i><i></i><i></i><span>' +
          (isReal ? '新建文件夹.exe' : '新建文件夹(2).exe') + '</span></div>' +
          '<div class="lv10-frame-body">' +
          '<div class="lv10-frame-icons">' + NF.icons.svg('folder') + '<span>新建文件夹</span></div>' +
          '<div class="lv10-frame-taskbar">' +
          '<span class="lv10-frame-jar" data-t="' + (isReal ? 'meta-jar' : 'meta-jar-fake') + '">' + NF.icons.svg('jar') + '</span>' +
          '<div class="lv10-frame-mascot">' + NF.icons.svg(isReal ? 'folderFace' : 'robot') + '</div>' +
          '</div></div>';
        return el;
      }

      function metaWrong() {
        NF.Audio.play('error');
        NF.Audio.play('giggle', { volume: 0.5 });
        NF.FX.flash('rgba(255,93,122,.28)', 180);
        NF.FX.shake(7, 280);
        OS.toast({ icon: 'bug', title: '这个窗口里没有出口', kind: 'error', ms: 1400 });
        folder.style.transition = 'left .4s cubic-bezier(.34,1.56,.64,1),top .4s cubic-bezier(.34,1.56,.64,1)';
        folder.style.left = folderHome.x + 'px';
        folder.style.top = folderHome.y + 'px';
        folder.style.transform = '';
        ctx.timer(450, function () { if (folder) folder.style.transition = ''; });
      }

      function metaSuccess() {
        if (completed) return;
        completed = true;
        metaActive = false;
        if (dragHandle) { dragHandle.destroy(); dragHandle = null; }
        NF.Audio.play('snap');
        NF.Audio.play('sparkle', { volume: 0.9 });
        NF.Audio.play('alarm', { volume: 0.25 });
        var c = OS.rect(jarReal);
        var cx = c.left + c.width / 2, cy = c.top + c.height / 2;
        folder.style.transition = 'transform .55s cubic-bezier(.34,1.56,.64,1),opacity .55s ease';
        folder.style.transform = 'scale(.12) translate(' + (cx - (OS.rect(folder).left + 38)) + 'px,' + (cy - (OS.rect(folder).top + 30)) + 'px)';
        folder.style.opacity = '0';
        NF.FX.burst(cx, cy, { count: 40, colors: ['#ffc94d', '#ff6ba9', '#8a6cff', '#7ef0c0', '#ffffff'], speed: 11, gravity: 0.2 });
        NF.FX.confetti({ count: 60 });
        ctx.timer(500, function () {
          ctx.root.querySelectorAll('.lv10-frame').forEach(function (f) {
            f.style.transition = 'opacity .5s ease, transform .7s ease';
            f.style.opacity = '0';
            f.style.transform += ' scale(.6)';
          });
          NF.FX.flash('rgba(255,247,220,.8)', 260);
          document.body.classList.add('lv10-glitch');
          NF.Audio.play('explode', { volume: 0.4 });
        });
        ctx.timer(1200, function () {
          document.body.classList.remove('lv10-glitch');
          if (meta) meta.style.opacity = '0';
        });
        ctx.complete({ x: cx, y: cy, delay: 1800 });
      }

      /* ---------------- 输入 ---------------- */
      ctx.on(ctx.root, 'contextmenu', function (e) {
        e.preventDefault();
        if (recursionStarted || completed) return;
        openMenuAt(e.clientX, e.clientY);
      });

      ctx.on(window, 'keydown', function (e) {
        if (recursionStarted || completed) return;
        if (OS.matchCombo(e, 'Ctrl+Shift+F')) {
          e.preventDefault();
          openNameDialog();
        }
      });

      /* ---------------- 幽灵演示 ---------------- */
      ctx.hint = async function () {
        if (completed) return;
        OS.closeMenus();
        if (stage <= 2 && !folder) {
          if (!dlg) {
            await NF.Ghost.play([
              { move: [innerWidth / 2, innerHeight * 0.55], dur: 350 },
              { keys: 'Ctrl+Shift+F', dur: 900 },
              { do: function () { openNameDialog(); } },
              { wait: 240 },
              { highlight: '[data-t="dialog-ok"]', dur: 650 }
            ]);
          } else {
            await NF.Ghost.play([
              { move: '[data-t="dialog-ok"]', dur: 450 },
              { highlight: '[data-t="dialog-ok"]', dur: 650 }
            ]);
          }
          return;
        }
        if (stage === 2 && folder && !recursionStarted) {
          if (demoFolder && demoFolder.parentNode) demoFolder.remove();
          if (demoShadow && demoShadow.parentNode) demoShadow.remove();
          var fRect = OS.rect(folder);
          await NF.Ghost.play([
            { highlight: '[data-t="created-folder"]', dur: 550 },
            {
              do: function () {
                demoFolder = document.createElement('div');
                demoFolder.className = 'lv10-demo';
                demoFolder.innerHTML = NF.icons.svg('folder');
                demoFolder.style.left = (fRect.left - 120) + 'px';
                demoFolder.style.top = (fRect.top + 60) + 'px';
                demoShadow = document.createElement('div');
                demoShadow.className = 'lv10-demo-shadow';
                demoShadow.dataset.t = 'folder-shadow';
                demoShadow.innerHTML = NF.icons.svg('folder');
                demoShadow.style.left = demoFolder.style.left;
                demoShadow.style.top = demoFolder.style.top;
                ctx.root.appendChild(demoShadow);
                ctx.root.appendChild(demoFolder);
              }
            },
            { highlight: '[data-t="folder-shadow"]', dur: 550 },
            { drag: { from: function () { return demoFolder; }, to: function () { return demoShadow; }, dur: 1000 } },
            { wait: 200 },
            {
              do: function () {
                if (demoFolder) { demoFolder.remove(); demoFolder = null; }
                if (demoShadow) { demoShadow.remove(); demoShadow = null; }
              }
            }
          ]);
          return;
        }
        if (stage === 3 && metaActive) {
          await NF.Ghost.play([
            { move: '[data-t="meta-window-real"]', dur: 500 },
            { highlight: '[data-t="meta-jar"]', dur: 700 },
            { move: '[data-t="created-folder"]', dur: 450 },
            { highlight: '[data-t="created-folder"]', dur: 500 },
            { drag: { from: '[data-t="created-folder"]', to: '[data-t="meta-jar"]', dur: 1100, after: 200 } },
            { wait: 150 }
          ]);
        }
      };

      ctx.onCleanup(function () {
        if (demoFolder && demoFolder.parentNode) demoFolder.remove();
        if (demoShadow && demoShadow.parentNode) demoShadow.remove();
        if (shadow && shadow.parentNode) shadow.remove();
        if (rafStop) rafStop();
        if (dlg) { try { dlg.close('cleanup'); } catch (e) {} dlg = null; }
        document.body.classList.remove('lv10-glitch');
        if (folder && folder.parentNode) folder.remove();
      });

      ctx.qa('l10', ctx.root);
    }
  });
})();




</script>
<script data-src="js/levels/l11.js">
/* js/levels/l11.js */
/* 第 11 关：幽灵出逃 —— 教程幽灵偷走了"新建文件夹"命令，抓住它 3 次，再把它掉落的卡片拖成文件夹 */
(function () {
  'use strict';
  var ID = 11;
  var OS = NF.OS;
  var demo = null;

  NF.Game.registerLevel({
    id: ID,
    icon: 'cursor',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var MAX_HITS = 3;
      var hits = 0;
      var completed = false;
      var escaped = false;
      var stunnedUntil = 0;
      var speedUp = 0;          // 每抓一次，瞬移间隔减少 180ms
      var card = null;
      var cardHandle = null;
      var createdEl = null;
      var rogueEl = null;
      var rafStop = null;

      var rogue = {
        x: W / 2, y: H * 0.4,
        flying: false, nextAt: 0,
        fromX: 0, fromY: 0, toX: 0, toY: 0, startT: 0, dur: 250,
        lastTrail: 0
      };

      ctx.style([
        '.lv11-veil{position:absolute;inset:0;pointer-events:none;z-index:1;',
        ' background:radial-gradient(ellipse at 50% 42%,transparent 42%,rgba(5,3,18,.4));}',
        '.lv11-rogue{position:absolute;left:0;top:0;width:64px;height:64px;z-index:6;cursor:pointer;',
        ' touch-action:none;will-change:transform;}',
        '.lv11-rogue .lv11-arrow{position:absolute;inset:9px;display:block;',
        ' filter:drop-shadow(0 0 12px rgba(255,212,92,.8)) drop-shadow(0 3px 6px rgba(0,0,0,.5));}',
        '.lv11-rogue .lv11-arrow svg{display:block;width:100%;height:100%;}',
        '.lv11-rogue .lv11-ring{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;',
        ' background:radial-gradient(circle,rgba(255,212,92,.22),rgba(255,212,92,.05) 55%,transparent 70%);',
        ' animation:lv11-ring 1.4s ease-in-out infinite alternate;}',
        '@keyframes lv11-ring{from{opacity:.25;transform:scale(.86);}to{opacity:.85;transform:scale(1.08);}}',
        '.lv11-rogue.lv11-hit .lv11-arrow{animation:lv11-hit .32s ease;}',
        '@keyframes lv11-hit{0%,100%{filter:drop-shadow(0 0 10px rgba(255,255,255,.85));}',
        ' 35%{filter:drop-shadow(0 0 26px #fff) brightness(2.2);}}',
        '.lv11-rogue.lv11-scream .lv11-arrow{animation:lv11-scream .38s ease-in-out infinite;}',
        '@keyframes lv11-scream{0%,100%{transform:rotate(0);}25%{transform:rotate(-14deg) translateY(-5px);}',
        ' 75%{transform:rotate(14deg) translateY(-2px);}}',
        '.lv11-trail{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:4;',
        ' background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);',
        ' box-shadow:0 0 12px rgba(255,255,255,.55);animation:lv11-trail .55s ease-out forwards;}',
        '@keyframes lv11-trail{from{opacity:.9;transform:scale(1);}to{opacity:0;transform:scale(.15);}}',
        '.lv11-decoy{position:absolute;width:56px;height:56px;z-index:5;cursor:pointer;opacity:.42;',
        ' filter:hue-rotate(165deg) drop-shadow(0 0 10px rgba(140,220,255,.8));animation:lv11-decoy-in .18s ease both;}',
        '.lv11-decoy .lv11-arrow{position:absolute;inset:8px;display:block;}',
        '.lv11-decoy .lv11-arrow svg{display:block;width:100%;height:100%;}',
        '.lv11-decoy::after{content:"";position:absolute;inset:1px;border:1px dashed rgba(180,230,255,.55);border-radius:50%;',
        ' animation:lv11-spin 4.5s linear infinite;}',
        '@keyframes lv11-decoy-in{from{opacity:0;transform:scale(.4);}to{opacity:.42;transform:scale(1);}}',
        '@keyframes lv11-spin{to{transform:rotate(360deg);}}',
        '.lv11-stunfx{position:absolute;inset:0;pointer-events:none;z-index:9;',
        ' background:radial-gradient(circle at 50% 45%,transparent 26%,rgba(255,93,122,.34) 100%);',
        ' animation:lv11-stun .52s ease-out forwards;}',
        '@keyframes lv11-stun{0%{opacity:0;transform:scale(1.06);}25%{opacity:1;}100%{opacity:0;transform:scale(1);}}',
        '.lv11-card{position:absolute;width:76px;height:76px;z-index:7;cursor:grab;touch-action:none;',
        ' filter:drop-shadow(0 0 20px rgba(255,212,92,.85)) drop-shadow(0 14px 20px rgba(0,0,0,.45));',
        ' animation:lv11-card-bob 1.8s ease-in-out infinite alternate;}',
        '.lv11-card svg{display:block;width:100%;height:100%;}',
        '.lv11-card::before{content:"";position:absolute;inset:-14px;border-radius:50%;pointer-events:none;',
        ' border:2px dashed rgba(255,240,190,.8);animation:lv11-spin 7s linear infinite;}',
        '.lv11-card::after{content:"";position:absolute;inset:-22px;border-radius:50%;pointer-events:none;',
        ' background:radial-gradient(circle,rgba(255,212,92,.35),transparent 68%);',
        ' animation:lv11-pulse 1.4s ease-in-out infinite alternate;}',
        '@keyframes lv11-card-bob{from{transform:translateY(0) rotate(-3deg);}to{transform:translateY(-8px) rotate(3deg);}}',
        '@keyframes lv11-pulse{from{opacity:.35;transform:scale(.9);}to{opacity:.9;transform:scale(1.12);}}',
        '.lv11-card.lv11-grabbed{animation:none;cursor:grabbing;z-index:40;',
        ' filter:drop-shadow(0 0 32px rgba(255,212,92,1)) drop-shadow(0 18px 26px rgba(0,0,0,.55));}',
        '.lv11-card.lv11-settle{transition:transform .34s cubic-bezier(.34,1.56,.64,1);}',
        '.lv11-card.lv11-card-open{animation:lv11-card-open .38s ease-out forwards;}',
        '@keyframes lv11-card-open{0%{transform:scale(1);opacity:1;}55%{transform:scale(1.55) rotate(6deg);opacity:1;}',
        ' 100%{transform:scale(.2) rotate(-14deg);opacity:0;}}',
        '.lv11-born{filter:drop-shadow(0 0 26px rgba(255,212,92,.9)) drop-shadow(0 16px 20px rgba(0,0,0,.5));}'
      ].join(''));

      var veil = document.createElement('div');
      veil.className = 'lv11-veil';
      ctx.root.appendChild(veil);

      /* ---------------- 出逃的幽灵 ---------------- */
      rogueEl = document.createElement('div');
      rogueEl.className = 'lv11-rogue';
      rogueEl.dataset.t = 'rogue-ghost';
      rogueEl.dataset.hits = '0';
      rogueEl.innerHTML = '<span class="lv11-arrow">' + NF.icons.svg('cursor') + '</span>' +
        '<span class="lv11-ring"></span>';
      ctx.root.appendChild(rogueEl);

      function setRoguePos() {
        rogueEl.style.transform = 'translate3d(' + Math.round(rogue.x - 32) + 'px,' +
          Math.round(rogue.y - 32) + 'px,0)';
      }
      setRoguePos();

      function randPoint() {
        var m = 96;
        return {
          x: OS.rand(m, Math.max(m + 40, W - m)),
          y: OS.rand(m, Math.max(m + 40, H - m))
        };
      }

      function nextInterval() {
        return Math.max(500, OS.rand(1100, 1500) - speedUp);
      }

      function addTrail(x, y) {
        var t = document.createElement('i');
        t.className = 'lv11-trail';
        t.style.left = x + 'px';
        t.style.top = y + 'px';
        ctx.root.appendChild(t);
        t.addEventListener('animationend', function () { if (t.parentNode) t.remove(); });
      }

      function startFlight(now) {
        var p = randPoint();
        var guard = 0;
        while (Math.hypot(p.x - rogue.x, p.y - rogue.y) < 120 && guard++ < 8) p = randPoint();
        rogue.fromX = rogue.x;
        rogue.fromY = rogue.y;
        rogue.toX = p.x;
        rogue.toY = p.y;
        rogue.startT = now;
        rogue.dur = 250;
        rogue.flying = true;
      }

      rogue.nextAt = performance.now() + 650;
      rafStop = ctx.raf(function (now) {
        if (completed || escaped) return;
        if (rogue.flying) {
          var t = Math.min(1, (now - rogue.startT) / rogue.dur);
          var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          rogue.x = rogue.fromX + (rogue.toX - rogue.fromX) * e;
          rogue.y = rogue.fromY + (rogue.toY - rogue.fromY) * e;
          setRoguePos();
          if (t < 1) {
            if (now - rogue.lastTrail > 44) {
              rogue.lastTrail = now;
              addTrail(rogue.x, rogue.y);
            }
          } else {
            rogue.flying = false;
            rogue.nextAt = now + nextInterval();
          }
        } else if (now >= rogue.nextAt) {
          startFlight(now);
        }
      });

      /* ---------------- 抓幽灵 ---------------- */
      function onRogueDown(e) {
        if (e.button !== 0 || completed || escaped) return;
        if (performance.now() < stunnedUntil) {
          NF.Audio.play('deny', { volume: 0.3 });
          return;
        }
        hits++;
        speedUp = hits * 180;
        rogueEl.dataset.hits = String(hits);
        rogueEl.classList.remove('lv11-hit');
        void rogueEl.offsetWidth;
        rogueEl.classList.add('lv11-hit');
        ctx.timer(340, function () { rogueEl.classList.remove('lv11-hit'); });

        NF.Audio.play('giggle', { volume: 0.55 });
        NF.Audio.play('error', { volume: 0.32 });
        NF.FX.burst(rogue.x, rogue.y, {
          count: 18, colors: ['#ffffff', '#ffd45c', '#8a6cff'], speed: 7, gravity: 0.1
        });
        NF.FX.ripple(rogue.x, rogue.y, { color: 'rgba(255,255,255,.85)', radius: 46 });
        spawnDecoys(2);

        if (hits >= MAX_HITS) escapeWithCard();
      }
      ctx.on(rogueEl, 'pointerdown', onRogueDown);

      function spawnDecoys(n) {
        for (var i = 0; i < n; i++) {
          var d = document.createElement('div');
          d.className = 'lv11-decoy';
          d.dataset.t = 'ghost-decoy';
          d.innerHTML = '<span class="lv11-arrow">' + NF.icons.svg('cursor') + '</span>';
          var ang = OS.rand(0, Math.PI * 2);
          var dist = OS.rand(66, 124);
          var x = OS.clamp(rogue.x + Math.cos(ang) * dist, 52, W - 52);
          var y = OS.clamp(rogue.y + Math.sin(ang) * dist, 52, H - 52);
          d.style.left = (x - 28) + 'px';
          d.style.top = (y - 28) + 'px';
          ctx.root.appendChild(d);
          (function (el) {
            ctx.on(el, 'pointerdown', function (ev) {
              ev.stopPropagation();
              if (completed) return;
              if (performance.now() < stunnedUntil) return;
              decoyPunish(el);
            });
            ctx.timer(800, function () {
              if (el.parentNode && !el._poof) el.remove();
            });
          })(d);
        }
      }

      function decoyPunish(el) {
        el._poof = true;
        if (el.parentNode) el.remove();
        NF.Audio.play('deny');
        NF.Audio.play('error', { volume: 0.5 });
        NF.FX.shake(6, 260);
        NF.FX.flash('rgba(255,93,122,.18)', 180);
        stunnedUntil = performance.now() + 500;
        var stun = document.createElement('div');
        stun.className = 'lv11-stunfx';
        ctx.root.appendChild(stun);
        ctx.timer(540, function () { if (stun.parentNode) stun.remove(); });
        var c = OS.center(el);
        NF.FX.burst(c.x, c.y, {
          count: 12, colors: ['#ff7a90', '#ffffff'], speed: 5, gravity: 0.2
        });
      }

      /* ---------------- 抓满 3 次：掉卡片 + 逃跑 ---------------- */
      function escapeWithCard() {
        if (escaped) return;
        escaped = true;
        rogue.flying = false;
        rogueEl.style.pointerEvents = 'none';
        rogueEl.classList.add('lv11-scream');
        NF.Audio.play('boing', { volume: 0.9 });
        NF.Audio.play('giggle', { volume: 0.6 });
        NF.FX.shake(7, 320);
        NF.FX.flash('rgba(255,255,255,.25)', 160);
        var drop = { x: rogue.x, y: rogue.y };

        ctx.timer(380, function () {
          spawnCard(drop.x, drop.y);
          var fromX = Math.round(rogue.x - 32);
          var fromY = Math.round(rogue.y - 32);
          rogueEl.style.transition = 'transform .85s cubic-bezier(.4,0,.7,1),opacity .7s ease';
          rogueEl.style.transform = 'translate3d(' + (fromX - 220) + 'px,' + (fromY - 260) + 'px,0) ' +
            'rotate(-55deg) scale(.35)';
          rogueEl.style.opacity = '0';
          NF.Audio.play('whoosh', { volume: 0.7 });
        });
      }

      function spawnCard(x, y) {
        card = document.createElement('div');
        card.className = 'lv11-card';
        card.dataset.t = 'stolen-folder';
        card.innerHTML = NF.icons.svg('folder');
        card.style.left = Math.round(x - 38) + 'px';
        card.style.top = Math.round(y - 38) + 'px';
        ctx.root.appendChild(card);

        NF.Audio.play('select', { volume: 0.6 });
        NF.Audio.play('pop', { volume: 0.8 });
        NF.FX.sparkle(x, y, '#ffd45c');
        NF.FX.burst(x, y, {
          count: 26, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 8, gravity: 0.2
        });

        cardHandle = OS.makeDraggable(card, {
          threshold: 3,
          canStart: function () { return !completed; },
          onStart: function () {
            card.classList.add('lv11-grabbed');
            NF.Audio.play('hover', { volume: 0.2 });
          },
          onMove: function (e, st) {
            card.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) rotate(' +
              OS.clamp(st.dx * 0.03, -8, 8).toFixed(2) + 'deg) scale(1.05)';
          },
          onEnd: function (e, st) {
            card.classList.remove('lv11-grabbed');
            if (completed) return;
            if (Math.hypot(st.dx, st.dy) < 18) {
              card.classList.add('lv11-settle');
              card.style.transform = '';
              NF.Audio.play('thud', { volume: 0.35 });
              ctx.timer(360, function () { card.classList.remove('lv11-settle'); });
              return;
            }
            cardSuccess();
          }
        });
        ctx.timer(900, function () { if (!completed) ctx.replayHint(); });
      }

      function cardSuccess() {
        if (completed || !card) return;
        completed = true;
        if (cardHandle) cardHandle.locked = true;
        var r = OS.rect(card);
        var rr = OS.rect(ctx.root);
        var cx = r.left + r.width / 2;
        var cy = r.top + r.height / 2;

        card.classList.remove('lv11-grabbed');
        card.classList.add('lv11-card-open');
        NF.Audio.play('snap');
        NF.Audio.play('sparkle', { volume: 0.9 });
        NF.FX.flash('rgba(255,244,205,.5)', 220);
        NF.FX.burst(cx, cy, {
          count: 40, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#8a6cff'], speed: 11, gravity: 0.2
        });

        ctx.timer(380, function () {
          var left = Math.round(r.left - rr.left);
          var top = Math.round(r.top - rr.top);
          if (card && card.parentNode) card.remove();
          card = null;
          createdEl = ctx.createdFolder({
            x: left, y: top, label: '新建文件夹', testid: 'created-folder'
          });
          createdEl.classList.add('lv11-born');
          var c = OS.center(createdEl);
          NF.FX.sparkle(c.x, c.y, '#ffd45c');
          NF.Audio.play('pop');
          ctx.timer(560, function () { ctx.complete({ el: createdEl }); });
        });
      }

      /* ---------------- 幽灵演示 ---------------- */
      demo = async function () {
        if (completed) return;
        if (card) {
          var tx = Math.round(W * 0.72);
          var ty = Math.round(H * 0.62);
          await NF.Ghost.play([
            { move: '[data-t="stolen-folder"]', dur: 480 },
            { highlight: '[data-t="stolen-folder"]', dur: 680 },
            { drag: { from: '[data-t="stolen-folder"]', to: [tx, ty], dur: 1000, after: 240 } },
            { wait: 180 }
          ]);
        } else {
          await NF.Ghost.play([
            { move: function () { return [rogue.x, rogue.y]; }, dur: 520 },
            { click: 'left', target: function () { return [rogue.x, rogue.y]; }, after: 260 },
            { move: function () { return [rogue.x, rogue.y]; }, dur: 440 },
            { click: 'left', target: function () { return [rogue.x, rogue.y]; }, after: 260 },
            { wait: 180 }
          ]);
        }
      };
      ctx.hint(demo);

      ctx.qa('l11', ctx.root);
    }
  });
})();

</script>
<script data-src="js/levels/l12.js">
/* js/levels/l12.js */
/* 第 12 关：游戏里的游戏 —— 迷你游戏窗口在桌面上运行，从里面右键新建，再把迷你文件夹拖出游戏 */
(function () {
  'use strict';
  var ID = 12;
  var OS = NF.OS;
  var demo = null;

  NF.Game.registerLevel({
    id: ID,
    icon: 'window',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var WIN_W = 440;
      var WIN_H = 300;
      var SLOT = { x: 238, y: 96 };   // 迷你文件夹在窗口内的落点

      var winHome = { x: Math.round(W / 2 - WIN_W / 2), y: Math.round(H * 0.16) };
      var win = null;
      var bodyEl = null;
      var miniFolder = null;
      var miniMenu = null;
      var menuOff = null;
      var createdEl = null;

      var phase = 'idle';   // idle | folder | dragging | done
      var dragging = false;
      var completed = false;

      ctx.style([
        '.lv12-aura{position:absolute;left:50%;top:48%;width:640px;height:460px;margin:-320px 0 0 -230px;',
        ' border-radius:50%;pointer-events:none;z-index:2;filter:blur(30px);',
        ' background:radial-gradient(ellipse,rgba(120,90,240,.22),transparent 68%);',
        ' animation:lv12-aura 4.5s ease-in-out infinite alternate;}',
        '@keyframes lv12-aura{from{opacity:.4;transform:scale(.94);}to{opacity:.85;transform:scale(1.06);}}',
        /* 迷你游戏窗口 */
        '.lv12-window{position:absolute;width:' + WIN_W + 'px;height:' + WIN_H + 'px;z-index:8;overflow:hidden;',
        ' border-radius:12px;background:rgba(18,16,40,.95);border:1px solid rgba(160,150,255,.32);',
        ' box-shadow:0 30px 60px rgba(0,0,0,.58),0 0 40px rgba(120,90,240,.22),inset 0 0 0 1px rgba(255,255,255,.05);}',
        '.lv12-titlebar{height:26px;display:flex;align-items:center;gap:6px;padding:0 9px;',
        ' background:rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.08);}',
        '.lv12-titlebar i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);}',
        '.lv12-titlebar i:nth-child(1){background:#ff6b8a;}',
        '.lv12-titlebar i:nth-child(2){background:#ffc94d;}',
        '.lv12-titlebar i:nth-child(3){background:#7ef0c0;}',
        '.lv12-title{display:flex;align-items:center;gap:5px;margin-left:5px;font-size:10px;',
        ' color:rgba(238,240,255,.72);letter-spacing:.04em;}',
        '.lv12-title .nf-ico{width:14px;height:14px;}',
        '.lv12-title em{font-style:normal;}',
        '.lv12-win-x{margin-left:auto;font-size:13px;line-height:1;color:rgba(238,240,255,.4);}',
        '.lv12-body{position:relative;height:calc(100% - 26px);overflow:hidden;}',
        /* 被缩放的迷你桌面 */
        '.lv12-screen{position:absolute;left:0;top:0;width:800px;height:498px;transform:scale(.55);',
        ' transform-origin:top left;overflow:hidden;',
        ' background:linear-gradient(150deg,#191338,#111a33 70%,#0c1126);}',
        '.lv12-wall{position:absolute;inset:0;background:',
        ' radial-gradient(ellipse 45% 40% at 30% 22%,rgba(120,90,240,.5),transparent 62%),',
        ' radial-gradient(ellipse 40% 36% at 78% 70%,rgba(30,120,200,.42),transparent 62%);}',
        '.lv12-stars{position:absolute;inset:0;opacity:.6;background-image:',
        ' radial-gradient(2px 2px at 18% 28%,rgba(255,255,255,.8),transparent 60%),',
        ' radial-gradient(1px 1px at 42% 62%,rgba(220,230,255,.7),transparent 60%),',
        ' radial-gradient(1.5px 1.5px at 66% 22%,rgba(255,255,255,.6),transparent 60%),',
        ' radial-gradient(1px 1px at 86% 58%,rgba(200,220,255,.6),transparent 60%);}',
        '.lv12-icons{position:absolute;left:26px;top:28px;display:flex;flex-direction:column;gap:22px;}',
        '.lv12-icon{width:64px;text-align:center;}',
        '.lv12-icon .nf-ico{display:block;width:44px;height:44px;margin:0 auto;',
        ' filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));}',
        '.lv12-icon span{display:block;margin-top:6px;font-size:11px;color:rgba(255,255,255,.55);}',
        '.lv12-task{position:absolute;left:20px;right:20px;bottom:18px;height:66px;border-radius:12px;',
        ' background:rgba(10,9,26,.82);border:1px solid rgba(255,255,255,.1);',
        ' display:flex;align-items:center;gap:16px;padding:0 16px;}',
        '.lv12-start{width:34px;height:34px;border-radius:8px;background:linear-gradient(140deg,#7cb2ff,#4f74ff);',
        ' box-shadow:0 0 14px rgba(91,124,250,.6);}',
        '.lv12-task svg{display:block;width:34px;height:34px;}',
        '.lv12-jar{position:relative;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;',
        ' justify-content:center;box-shadow:0 0 0 1px rgba(255,212,92,.5),0 0 14px rgba(255,212,92,.4);}',
        '.lv12-jar b{position:absolute;right:-5px;top:-5px;min-width:14px;height:14px;border-radius:7px;',
        ' background:#ffc94d;color:#4a2c00;font-size:8px;font-weight:800;display:flex;align-items:center;',
        ' justify-content:center;padding:0 3px;}',
        '.lv12-mascot{margin-left:auto;width:38px;height:38px;}',
        '.lv12-mascot svg{width:38px;height:38px;}',
        '.lv12-scan{position:absolute;inset:0;pointer-events:none;',
        ' background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);}',
        '.lv12-glass{position:absolute;inset:0;pointer-events:none;border-radius:12px;',
        ' box-shadow:inset 0 0 40px rgba(120,90,240,.18);}',
        /* 被拉出来的迷你文件夹 */
        '.lv12-mini-folder{position:absolute;width:34px;height:34px;z-index:6;cursor:grab;touch-action:none;',
        ' filter:drop-shadow(0 0 10px rgba(255,212,92,.8)) drop-shadow(0 6px 8px rgba(0,0,0,.5));}',
