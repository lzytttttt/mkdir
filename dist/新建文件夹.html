        '.lv16-win.lv16-swap{border-color:rgba(180,200,255,.5);filter:brightness(1.1);}',
        '.lv16-win.lv16-confirmed{filter:brightness(1.5);}',
        /* 中央虚线槽 */
        '.lv16-slot{position:absolute;width:300px;height:190px;border-radius:26px;z-index:5;pointer-events:none;',
        ' border:2.5px dashed rgba(255,212,92,.55);display:flex;align-items:center;justify-content:center;',
        ' background:radial-gradient(circle at 50% 50%,rgba(255,201,77,.13),transparent 72%);',
        ' box-shadow:inset 0 0 30px rgba(255,201,77,.1);animation:lv16-slot-pulse 2.4s ease-in-out infinite;}',
        '.lv16-slot svg{width:64px;height:64px;opacity:.28;}',
        '@keyframes lv16-slot-pulse{0%,100%{transform:scale(1);border-color:rgba(255,212,92,.45);}',
        ' 50%{transform:scale(1.015);border-color:rgba(255,224,138,.75);}}',
        '.lv16-slot.lv16-near{border-style:solid;border-color:rgba(255,224,138,.95);',
        ' box-shadow:0 0 40px rgba(255,212,92,.4),inset 0 0 30px rgba(255,212,92,.18);}',
        '.lv16-slot.lv16-deny{animation:lv16-deny .42s ease!important;}',
        '@keyframes lv16-deny{0%,100%{border-color:rgba(255,93,122,.9);}50%{border-color:rgba(255,93,122,1);',
        ' box-shadow:0 0 40px rgba(255,93,122,.4);}}',
        '.lv16-slot.lv16-filled{border-style:solid;border-color:rgba(126,240,192,.9);',
        ' box-shadow:0 0 52px rgba(126,240,192,.4),inset 0 0 34px rgba(126,240,192,.2);}',
        /* 飞出来的文件夹 */
        '.lv16-folder-out{filter:drop-shadow(0 0 26px rgba(255,212,92,.85)) drop-shadow(0 12px 18px rgba(0,0,0,.45));}'
      ].join(''));

      scene = document.createElement('div');
      scene.className = 'lv16-scene';
      scene.dataset.phase = '1';
      scene.dataset.qa = 'l16';
      ctx.root.appendChild(scene);

      function rootRect() { return ctx.root.getBoundingClientRect(); }
      function setPhase(p) {
        phase = p;
        scene.dataset.phase = String(p);
      }

      /* ---------------- 通用窗口骨架 ---------------- */
      function dialogBody(real) {
        return '<div class="lv16-dialog">' +
          '<div class="lv16-field"><span class="lv16-caret"></span><span>新建文件夹</span></div>' +
          '<div class="lv16-btns">' +
          '<span class="lv16-btn">取消</span>' +
          (real
            ? '<button type="button" class="lv16-btn is-primary" data-t="dialog-ok" disabled>确定</button>'
            : '<span class="lv16-btn is-ghost">确定</span>') +
          '</div></div>';
      }

      function makeWindow(cfg) {
        var el = document.createElement('div');
        el.className = 'lv16-win' + (cfg.cls ? ' ' + cfg.cls : '');
        el.dataset.t = cfg.testid;
        el.style.left = cfg.x + 'px';
        el.style.top = cfg.y + 'px';

        var bar = document.createElement('div');
        bar.className = 'lv16-bar';
        if (cfg.bartestid) bar.dataset.t = cfg.bartestid;
        if (cfg.icon) {
          var ic = document.createElement('span');
          ic.className = 'lv16-tb-ico';
          ic.innerHTML = NF.icons.svg(cfg.icon);
          bar.appendChild(ic);
        }
        var ti = document.createElement('span');
        ti.className = 'lv16-tb-title';
        ti.textContent = cfg.title || '新建文件夹';
        bar.appendChild(ti);
        var dots = document.createElement('span');
        dots.className = 'lv16-dots';
        dots.innerHTML = '<i></i><i></i><i></i>';
        bar.appendChild(dots);
        var x = document.createElement('span');
        x.className = 'lv16-x';
        x.textContent = '✕';
        bar.appendChild(x);
        el.appendChild(bar);

        var body = document.createElement('div');
        body.className = 'lv16-body';
        body.innerHTML = cfg.body || '';
        el.appendChild(body);

        scene.appendChild(el);
        var rec = {
          el: el, bar: bar, body: body,
          x: cfg.x, y: cfg.y,
          homeX: cfg.x, homeY: cfg.y,
          isReal: !!cfg.real, dragging: false,
          okBtn: null, barHandle: null
        };
        rec.okBtn = body.querySelector('[data-t="dialog-ok"]');
        ctx.timer(420, function () { el.classList.add('lv16-anim-done'); });
        return rec;
      }

      /* ---------------- 阶段 1：屏幕边缘的逃亡窗口 ---------------- */
      function buildEscape() {
        escapeWin = makeWindow({
          testid: 'escape-window',
          bartestid: 'escape-titlebar',
          icon: 'folder',
          title: '新建文件夹',
          body: dialogBody(false),
          x: escPos.x, y: escPos.y,
          cls: 'lv16-escape'
        });
        escBar = escapeWin.bar;
        escHandle = OS.makeDraggable(escBar, {
          threshold: 3,
          canStart: function () { return !completed && phase === 1 && !escSnapping && !escReturning; },
          onStart: function () {
            escDragging = true;
            escPos.x = parseFloat(escapeWin.el.style.left);
            escPos.y = parseFloat(escapeWin.el.style.top);
            if (!isFinite(escPos.x)) escPos.x = escHome.x;
            if (!isFinite(escPos.y)) escPos.y = escHome.y;
            escapeWin.el.style.transition = 'none';
            escapeWin.el.classList.add('lv16-grabbing');
            NF.Audio.play('paper', { volume: 0.45 });
          },
          onMove: function (e, st) {
            var nx = OS.clamp(escPos.x + st.dx, -WIN_W + 70, W - 70);
            var ny = OS.clamp(escPos.y + st.dy, -16, H - 90);
            escapeWin.el.style.left = nx + 'px';
            escapeWin.el.style.top = ny + 'px';
          },
          onEnd: function () {
            escDragging = false;
            escapeWin.el.classList.remove('lv16-grabbing');
            if (completed || phase !== 1) return;
            var nx = parseFloat(escapeWin.el.style.left) || escPos.x;
            var ny = parseFloat(escapeWin.el.style.top) || escPos.y;
            escPos.x = nx;
            escPos.y = ny;
            escapeWin.x = nx;
            escapeWin.y = ny;
            if (Math.hypot(nx + WIN_W / 2 - CENTER.x, ny + WIN_H / 2 - CENTER.y) < 150) {
              snapCenter();
              return;
            }
            returnToEdge();
          }
        });
      }

      /* 没拖到中央：窗口又溜回屏幕边缘 */
      function returnToEdge() {
        if (completed || phase !== 1) return;
        escReturning = true;
        escPos.x = escHome.x;
        escPos.y = escHome.y;
        escapeWin.el.style.transition = 'left .42s cubic-bezier(.34,1.56,.64,1),top .42s cubic-bezier(.34,1.56,.64,1)';
        escapeWin.el.style.left = escPos.x + 'px';
        escapeWin.el.style.top = escPos.y + 'px';
        NF.Audio.play('dodge', { volume: 0.55 });
        ctx.timer(450, function () { escReturning = false; });
      }

      function snapCenter() {
        if (completed || phase !== 1) return;
        escSnapping = true;
        setPhase(2);
        escPos.x = Math.round(CENTER.x - WIN_W / 2);
        escPos.y = Math.round(CENTER.y - WIN_H / 2);
        escapeWin.el.style.transition = 'left .34s cubic-bezier(.34,1.56,.64,1),top .34s cubic-bezier(.34,1.56,.64,1)';
        escapeWin.el.style.left = escPos.x + 'px';
        escapeWin.el.style.top = escPos.y + 'px';
        NF.Audio.play('snap', { volume: 0.9 });
        NF.Audio.play('sparkle', { volume: 0.7 });
        NF.FX.flash('rgba(255,240,190,.32)', 190);
        NF.FX.ripple(CENTER.x, CENTER.y, { color: 'rgba(255,224,138,.85)', radius: 90 });
        NF.FX.shake(3, 200);
        ctx.timer(420, splitWindows);
      }

      /* 窗口一分为三 */
      function splitWindows() {
        if (completed) return;
        escapeWin.el.classList.add('lv16-split');
        NF.Audio.play('whoosh', { volume: 0.7 });
        NF.Audio.play('open', { volume: 0.6 });
        NF.FX.flash('rgba(255,255,255,.5)', 200);
        ctx.timer(320, function () {
          if (completed) return;
          escapeWin.el.style.display = 'none';
          buildSlot();
          buildThree();
          setPhase(2);
          NF.Audio.play('giggle', { volume: 0.4 });
          ctx.timer(1000, function () { if (!completed) ctx.replayHint(); });
        });
      }

      function buildSlot() {
        if (slotEl) return;
        slotEl = document.createElement('div');
        slotEl.className = 'lv16-slot';
        slotEl.dataset.t = 'window-slot';
        slotEl.style.left = Math.round(CENTER.x - 150) + 'px';
        slotEl.style.top = Math.round(CENTER.y - 95) + 'px';
        slotEl.innerHTML = NF.icons.svg('folder');
        scene.appendChild(slotEl);
      }

      function buildThree() {
        var spots = [
          { x: Math.round(W * 0.09), y: Math.round(H * 0.1) },
          { x: Math.round(W - WIN_W - Math.max(56, W * 0.06)), y: Math.round(H * 0.08) },
          { x: Math.round(W * 0.34), y: Math.round(H - WIN_H - 44) }
        ];
        var defs = [
          { real: true, icon: 'folder', title: '新建文件夹' },
          { real: false, icon: 'gear', title: '新建文件夹 (2)' },
          { real: false, icon: 'robot', title: '新建文件夹 (3)' }
        ];
        // 打乱：真窗口每次出现在不同的位置
        shuffle(defs);
        shuffle(spots);
        for (var i = 0; i < 3; i++) {
          var rec = makeWindow({
            testid: defs[i].real ? 'real-window' : 'decoy-window',
            icon: defs[i].icon,
            title: defs[i].title,
            body: dialogBody(defs[i].real),
            x: spots[i].x,
            y: spots[i].y,
            real: defs[i].real,
            cls: defs[i].real ? 'lv16-real' : 'lv16-decoy'
          });
          rec.dropped = false;
          wins.push(rec);
          bindWinDrag(rec);
          if (defs[i].real) setupOkDodge(rec);
        }
        // 每 4.2s 交换一次位置（拖拽时暂停）
        swapTimer = ctx.interval(4200, function () {
          if (phase !== 2 || completed || dragWin || wins.length < 3) return;
          var i = swapFlip % 3;
          swapFlip++;
          var j = (i + 1 + Math.floor(Math.random() * 2)) % 3;
          if (i === j) return;
          swapTwo(wins[i], wins[j]);
        });
      }

      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
      }

      function nearSlot(cx, cy) {
        if (!slotEl) return false;
        return Math.hypot(cx - CENTER.x, cy - CENTER.y) < 190;
      }

      function bindWinDrag(w) {
        w.barHandle = OS.makeDraggable(w.bar, {
          threshold: 3,
          canStart: function () { return phase === 2 && !completed; },
          onStart: function () {
            dragWin = w;
            w.dragging = true;
            w.el.style.transition = 'none';
            w.el.classList.add('lv16-grabbing');
            w.x = parseFloat(w.el.style.left) || w.x;
            w.y = parseFloat(w.el.style.top) || w.y;
            NF.Audio.play('paper', { volume: 0.4 });
          },
          onMove: function (e, st) {
            var nx = OS.clamp(w.x + st.dx, -120, W - 160);
            var ny = OS.clamp(w.y + st.dy, 0, H - 110);
            w.el.style.left = nx + 'px';
            w.el.style.top = ny + 'px';
            if (slotEl) {
              var near = nearSlot(nx + WIN_W / 2, ny + WIN_H / 2);
              slotEl.classList.toggle('lv16-near', near && w.isReal);
              w.el.classList.toggle('lv16-over', near);
            }
          },
          onEnd: function () {
            w.dragging = false;
            dragWin = null;
            w.el.classList.remove('lv16-grabbing', 'lv16-over');
            if (slotEl) slotEl.classList.remove('lv16-near');
            if (completed || phase !== 2) return;
            var nx = parseFloat(w.el.style.left) || w.x;
            var ny = parseFloat(w.el.style.top) || w.y;
            w.x = nx;
            w.y = ny;
            var near = nearSlot(nx + WIN_W / 2, ny + WIN_H / 2);
            if (near && w.isReal) { dockReal(w); return; }
            if (near && !w.isReal) { wrongWindow(w); return; }
            w.homeX = nx;
            w.homeY = ny;
          }
        });
      }

      function swapTwo(a, b) {
        if (!a || !b || a.dragging || b.dragging || a === b) return;
        var ax = a.x;
        var ay = a.y;
        a.x = b.x;
        a.y = b.y;
        b.x = ax;
        b.y = ay;
        [a, b].forEach(function (w) {
          w.el.classList.toggle('lv16-swap', true);
          w.el.style.transition = 'left .35s cubic-bezier(.34,1.56,.64,1),top .35s cubic-bezier(.34,1.56,.64,1)';
          w.el.style.left = w.x + 'px';
          w.el.style.top = w.y + 'px';
        });
        NF.Audio.play('whoosh', { volume: 0.22 });
        ctx.timer(430, function () {
          [a, b].forEach(function (w) {
            w.el.style.transition = '';
            w.el.classList.remove('lv16-swap');
            w.homeX = w.x;
            w.homeY = w.y;
          });
        });
      }

      function wrongWindow(w) {
        NF.Audio.play('deny', { volume: 0.85 });
        NF.Audio.play('giggle', { volume: 0.38 });
        NF.FX.shake(5, 220);
        if (slotEl) {
          slotEl.classList.add('lv16-deny');
          ctx.timer(460, function () { slotEl.classList.remove('lv16-deny'); });
        }
        w.el.classList.add('lv16-wrong');
        ctx.timer(380, function () { w.el.classList.remove('lv16-wrong'); });
        // 弹回原位
        w.el.style.transition = 'left .38s cubic-bezier(.34,1.56,.64,1),top .38s cubic-bezier(.34,1.56,.64,1)';
        w.el.style.left = w.homeX + 'px';
        w.el.style.top = w.homeY + 'px';
        w.x = w.homeX;
        w.y = w.homeY;
        ctx.timer(430, function () { w.el.style.transition = ''; });
      }

      /* ---------------- 阶段 3：真窗口就位 ---------------- */
      function dockReal(w) {
        if (completed || phase !== 2) return;
        setPhase(3);
        dockedWin = w;
        if (swapTimer) { clearInterval(swapTimer); swapTimer = 0; }
        if (slotEl) {
          slotEl.classList.add('lv16-filled');
          slotEl.classList.remove('lv16-near');
        }
        wins.forEach(function (o) {
          if (o === w) return;
          if (o.barHandle) o.barHandle.locked = true;
          o.el.style.transition = '';
          o.el.classList.add('lv16-lose');
        });
        if (w.barHandle) w.barHandle.locked = true;
        w.el.style.animation = 'none';
        w.el.style.transition = 'left .4s cubic-bezier(.34,1.56,.64,1),top .4s cubic-bezier(.34,1.56,.64,1),transform .4s cubic-bezier(.34,1.56,.64,1)';
        w.el.classList.add('lv16-docked');
        w.el.style.left = Math.round(CENTER.x - WIN_W / 2) + 'px';
        w.el.style.top = Math.round(CENTER.y - WIN_H / 2) + 'px';
        w.el.style.transform = 'scale(.86)';
        w.x = CENTER.x - WIN_W / 2;
        w.y = CENTER.y - WIN_H / 2;
        NF.Audio.play('snap', { volume: 1 });
        NF.Audio.play('sparkle', { volume: 0.8 });
        NF.FX.flash('rgba(255,240,190,.4)', 220);
        var c = OS.center(w.el);
        NF.FX.burst(c.x, c.y, {
          count: 40, colors: ['#ffc94d', '#7ef0c0', '#ffffff', '#ffe08a'], speed: 9, gravity: 0.2
        });
        ctx.timer(480, function () {
          if (completed) return;
          w.el.classList.add('lv16-ready');
          if (w.okBtn) {
            w.okBtn.disabled = false;
            w.okBtn.classList.add('is-ready');
          }
          NF.Audio.play('select', { volume: 0.4 });
          if (!completed) ctx.replayHint();
        });
      }

      /* "确定"按钮会躲鼠标（躲三次会喘口气，给玩家一点机会） */
      function setupOkDodge(w) {
        var ok = w.okBtn;
        if (!ok) return;
        ctx.on(ok, 'click', function (e) {
          e.stopPropagation();
          if (phase === 3 && !completed) confirmReal();
        });
        var dodgeCount = 0;
        var lastDodgeAt = 0;
        var tiredUntil = 0;
        var dx = 0;
        var dy = 0;
        ctx.on(ok, 'pointermove', function (e) {
          if (phase !== 3 || completed) return;
          var now = performance.now();
          if (now < tiredUntil || now - lastDodgeAt < 90) return;
          var r = OS.rect(ok);
          var cx = r.left + r.width / 2;
          var cy = r.top + r.height / 2;
          if (Math.hypot(cx - e.clientX, cy - e.clientY) > 115) return;
          lastDodgeAt = now;
          dodgeCount += 1;
          dx = OS.clamp(dx + OS.rand(-64, 64), -84, 84);
          dy = OS.clamp(dy + OS.rand(-30, 30), -36, 36);
          ok.style.transition = 'transform .2s cubic-bezier(.22,.8,.3,1)';
          ok.style.transform = 'translate(' + dx.toFixed(0) + 'px,' + dy.toFixed(0) + 'px)';
          NF.Audio.play('dodge', { volume: 0.5 });
          if (dodgeCount % 3 === 0) {
            tiredUntil = now + 1200;
            ok.classList.add('lv16-tired');
            ctx.timer(1300, function () { ok.classList.remove('lv16-tired'); });
          }
        });
      }

      /* ---------------- 完成：文件夹从窗口里飞出来 ---------------- */
      function confirmReal() {
        if (completed || phase !== 3 || !dockedWin) return;
        completed = true;
        setPhase(4);
        var w = dockedWin;
        w.el.classList.add('lv16-confirmed');
        NF.Audio.play('enter', { volume: 0.7 });
        NF.Audio.play('sparkle', { volume: 0.85 });
        NF.FX.flash('rgba(255,247,220,.55)', 240);

        var lx = Math.round(W / 2 - 38);
        var ly = Math.round(H * 0.74);
        var folder = ctx.createdFolder({ x: lx, y: ly, label: '新建文件夹', testid: 'created-folder' });
        folder.classList.add('lv16-folder-out');
        folder.dataset.state = 'out';
        var wr = OS.rect(w.el);
        var fc = OS.center(folder);
        NF.FX.fly(
          { left: wr.left + wr.width / 2 - 34, top: wr.top + wr.height / 2 - 34, width: 68, height: 68 },
          { left: lx + 4, top: ly + 4, width: 68, height: 68 },
          {
            html: NF.icons.svg('folder'), duration: 620, arc: -150,
            onDone: function () { NF.FX.sparkle(fc.x, fc.y, '#ffd45c'); }
          }
        );
        NF.FX.burst(fc.x, fc.y, {
          count: 38, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#7ef0c0'], speed: 9, gravity: 0.2
        });
        NF.FX.confetti({ count: 70 });
        ctx.timer(720, function () { ctx.complete({ el: folder }); });
      }

      /* ---------------- 主循环：边缘缓慢外滑 + 靠近标题栏时躲闪 ---------------- */
      function tick(now) {
        if (!lastTs) lastTs = now;
        var dt = Math.min(0.05, (now - lastTs) / 1000 || 0.016);
        lastTs = now;
        if (phase !== 1 || completed || escDragging || escSnapping || escReturning) return;
        // 慢慢滑出屏幕
        escPos.x = Math.min(escPos.x + 3 * dt, W - 36);
        // 鼠标靠近标题栏就在屏幕内小幅躲闪
        var nearX = OS.clamp(lastMouse.x, escPos.x + escDodge, escPos.x + WIN_W + escDodge);
        var nearY = OS.clamp(lastMouse.y, escPos.y, escPos.y + 38);
        var near = Math.hypot(lastMouse.x - nearX, lastMouse.y - nearY) < 130;
        var want = near ? 16 : 0;
        escDodge += (want - escDodge) * Math.min(1, dt * 7);
        escapeWin.el.style.left = (escPos.x + escDodge).toFixed(1) + 'px';
        escapeWin.el.style.top = escPos.y + 'px';
      }
      ctx.raf(tick);

      ctx.on(window, 'pointermove', function (e) {
        var r = rootRect();
        lastMouse.x = e.clientX - r.left;
        lastMouse.y = e.clientY - r.top;
      });

      ctx.on(document, 'keydown', function (e) {
        if (completed || phase !== 3) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmReal();
        }
      });

      /* ---------------- 幽灵演示（按阶段切换） ---------------- */
      demo = async function () {
        if (completed) return;
        if (phase === 1) {
          var r = OS.rect(escBar);
          var from = {
            x: OS.clamp(r.left + 26, 18, W - 18),
            y: OS.clamp(r.top + r.height / 2, 18, H - 18)
          };
          await NF.Ghost.play([
            { move: from, dur: 520 },
            { highlight: '[data-t="escape-titlebar"]', dur: 720 },
            { drag: { from: from, to: [CENTER.x, CENTER.y], dur: 980, after: 220 } },
            { wait: 200 }
          ]);
          return;
        }
        if (phase === 2) {
          var rw = null;
          wins.forEach(function (w) { if (w.isReal) rw = w; });
          if (!rw) return;
          await NF.Ghost.play([
            { move: '[data-t="real-window"]', dur: 520 },
            { highlight: '[data-t="real-window"]', dur: 820 },
            {
              drag: {
                from: function () {
                  var b = OS.rect(rw.bar);
                  return { x: b.left + 60, y: b.top + 19 };
                },
                to: '[data-t="window-slot"]',
                dur: 1000, after: 220
              }
            },
            { wait: 160 }
          ]);
          return;
        }
        if (phase === 3) {
          await NF.Ghost.play([
            { move: '[data-t="dialog-ok"]', dur: 460 },
            { highlight: '[data-t="dialog-ok"]', dur: 700 },
            { keys: 'Enter', dur: 900 },
            { wait: 150 }
          ]);
        }
      };
      ctx.hint(demo);

      /* 兜底：一张隐形纸片帮助玩家理解"往中间拖"，不显示文字 */
      ctx.onCleanup(function () {
        if (swapTimer) { clearInterval(swapTimer); swapTimer = 0; }
        if (escHandle) { try { escHandle.destroy(); } catch (e) {} escHandle = null; }
        wins.forEach(function (w) {
          if (w.barHandle) { try { w.barHandle.destroy(); } catch (e) {} w.barHandle = null; }
        });
        wins = [];
      });

      buildEscape();
    }
  });
})();

</script>
<script data-src="js/levels/l17.js">
/* js/levels/l17.js */
/* 第 17 关：小夹的凝视
   —— 小夹长成了巨型 Boss，盯着谁谁就不能动。
   1. 睁眼时全局 capture 吞掉所有点击（红色闪烁 + deny），菜单/对话被强制关闭；
   2. 闭眼窗口（1.3-1.9s）里右键 → 新建 → 文件夹（直接生成，不弹命名框）；
   3. 文件夹一出现，Boss 强制闭眼 2.4s：必须在它睁眼前把文件夹拖进右下角玻璃罐；
   4. 睁眼时文件夹还在外面 → 被盯成灰烬，无限重试。 */
(function () {
  'use strict';
  var ID = 17;
  var OS = NF.OS;

  NF.Game.registerLevel({
    id: ID,
    icon: 'folderFace',
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var DASH_MS = 2400;          // 文件夹出现后的闭眼抢跑窗口
      var OPEN_MS = 2400;          // 每轮睁眼持续
      var completed = false;
      var winning = false;         // 文件夹已安全入罐
      var eyesOpen = false;
      var eyeTimer = 0;
      var dashTimer = 0;
      var lastGazeAt = 0;
      var folder = null;
      var folderDrag = null;
      var demoMenu = null;
      var boss = null;
      var jar = null;
      var dashBar = null;
      var gazeFlash = null;

      ctx.style([
        /* ---------- 场景 ---------- */
        '.lv17-vignette{position:absolute;inset:0;pointer-events:none;z-index:0;',
        ' background:radial-gradient(ellipse 58% 46% at 50% 30%,rgba(255,60,90,.10),transparent 62%),',
        ' radial-gradient(ellipse 90% 70% at 50% 108%,rgba(0,0,0,.5),transparent 64%);}',

        /* ---------- Boss ---------- */
        '.lv17-boss{position:absolute;left:50%;top:46px;width:360px;height:360px;margin-left:-180px;z-index:30;',
        ' pointer-events:none;filter:drop-shadow(0 34px 60px rgba(0,0,0,.55));',
        ' animation:lv17-bob 4.6s ease-in-out infinite alternate;transition:filter .25s ease;}',
        '@keyframes lv17-bob{from{transform:translateY(0) rotate(-.7deg);}to{transform:translateY(-12px) rotate(.7deg);}}',
        '.lv17-face{position:absolute;inset:0;}',
        '.lv17-face svg{width:100%;height:100%;display:block;}',
        /* 闭眼时藏掉眼白与瞳孔（folderFace 里第 1、2 个 ellipse 是眼睛，circle 全是瞳孔/高光） */
        '.lv17-boss[data-eyes="closed"] .lv17-face svg ellipse:nth-of-type(1),',
        '.lv17-boss[data-eyes="closed"] .lv17-face svg ellipse:nth-of-type(2),',
        '.lv17-boss[data-eyes="closed"] .lv17-face svg circle{opacity:0;}',
        /* 闭眼的眼皮弧线 */
        '.lv17-lid{position:absolute;width:78px;height:24px;top:184px;border-radius:0 0 62% 62%/0 0 100% 100%;',
        ' border-bottom:7px solid #8a5a12;opacity:0;transition:opacity .1s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}',
        '.lv17-lid-l{left:90px;}',
        '.lv17-lid-r{left:192px;}',
        '.lv17-boss[data-eyes="closed"] .lv17-lid{opacity:1;}',
        /* 睁眼的气场 + 眼神红光 */
        '.lv17-aura{position:absolute;inset:-46px;border-radius:50%;pointer-events:none;opacity:0;filter:blur(8px);',
        ' background:radial-gradient(circle at 50% 54%,rgba(255,54,84,.26),rgba(255,54,84,.07) 46%,transparent 68%);',
        ' transition:opacity .3s ease;}',
        '.lv17-boss[data-eyes="open"] .lv17-aura{opacity:1;animation:lv17-aura 2.4s ease-in-out infinite;}',
        '@keyframes lv17-aura{0%,100%{transform:scale(.95);opacity:.55;}50%{transform:scale(1.05);opacity:1;}}',
        '.lv17-glare{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;transition:opacity .2s ease;',
        ' background:radial-gradient(circle 44px at 36% 54.7%,rgba(255,54,84,.6),transparent 70%),',
        ' radial-gradient(circle 44px at 64% 54.7%,rgba(255,54,84,.6),transparent 70%);}',
        '.lv17-boss[data-eyes="open"] .lv17-glare{opacity:1;animation:lv17-glare 1.2s ease-in-out infinite;}',
        '@keyframes lv17-glare{0%,100%{filter:brightness(1);}50%{filter:brightness(1.7);}}',
        '.lv17-boss.is-glaring{filter:drop-shadow(0 0 46px rgba(255,54,84,.85)) drop-shadow(0 30px 60px rgba(0,0,0,.55));}',
        /* 闭眼时飘 zZ */
        '.lv17-zzz{position:absolute;right:26px;top:48px;font-family:var(--mono);font-size:26px;font-weight:900;',
        ' letter-spacing:7px;color:rgba(205,228,255,.85);text-shadow:0 4px 16px rgba(0,0,0,.55);opacity:0;transition:opacity .2s ease;}',
        '.lv17-boss[data-eyes="closed"] .lv17-zzz{opacity:.9;animation:lv17-zzz 2.2s ease-in-out infinite;}',
        '@keyframes lv17-zzz{0%,100%{transform:translate(0,4px) scale(.9);opacity:.5;}50%{transform:translate(5px,-9px) scale(1.06);opacity:.95;}}',
        /* 入罐后晕眩 */
        '.lv17-boss.is-dizzy{animation:lv17-dizzy 1s ease-in-out infinite !important;',
        ' filter:drop-shadow(0 0 34px rgba(255,212,92,.8)) drop-shadow(0 30px 60px rgba(0,0,0,.5));}',
        '@keyframes lv17-dizzy{0%,100%{transform:rotate(-3.5deg) translateY(0);}50%{transform:rotate(3.5deg) translateY(-8px);}}',
        '.lv17-dizzy-stars{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:26px;letter-spacing:12px;',
        ' color:#ffd45c;opacity:0;text-shadow:0 0 16px rgba(255,212,92,.9);pointer-events:none;}',
        '.lv17-boss.is-dizzy .lv17-dizzy-stars{opacity:1;animation:lv17-stars 1.2s ease-in-out infinite;}',
        '@keyframes lv17-stars{0%,100%{transform:translate(-50%,-4px) rotate(-6deg);}50%{transform:translate(-50%,4px) rotate(6deg);}}',

        /* ---------- 睁眼全屏红闪 ---------- */
        '.lv17-gaze-flash{position:absolute;inset:0;z-index:70;pointer-events:none;opacity:0;',
        ' background:radial-gradient(ellipse at 50% 42%,rgba(255,32,64,.34),rgba(150,0,32,.18) 46%,transparent 74%),',
        ' linear-gradient(rgba(255,40,70,.1),rgba(255,40,70,.1));}',
        '.lv17-gaze-flash.on{animation:lv17-gaze .34s ease-out;}',
        '@keyframes lv17-gaze{0%{opacity:0;}16%{opacity:1;}100%{opacity:0;}}',

        /* ---------- 抢跑倒计时条 ---------- */
        '.lv17-dash{position:absolute;left:50%;top:424px;width:300px;height:8px;margin-left:-150px;border-radius:6px;',
        ' background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);overflow:hidden;z-index:32;',
        ' opacity:0;transition:opacity .18s ease;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35);}',
        '.lv17-dash.show{opacity:1;}',
        '.lv17-dash i{display:block;height:100%;width:100%;transform-origin:0 50%;',
        ' background:linear-gradient(90deg,#ffd45c,#ff8a5c,#ff5d7a);box-shadow:0 0 14px rgba(255,150,90,.85);',
        ' animation:lv17-dash-run 2400ms linear forwards;}',
        '@keyframes lv17-dash-run{from{transform:scaleX(1);}to{transform:scaleX(0);}}',

        /* ---------- 右下角玻璃罐 ---------- */
        '.lv17-jar{position:absolute;right:64px;bottom:38px;width:174px;display:flex;align-items:flex-end;justify-content:center;',
        ' z-index:34;transition:filter .25s ease;}',
        '.lv17-jar-ring{position:absolute;left:50%;bottom:2px;width:158px;height:158px;margin-left:-79px;border-radius:50%;',
        ' border:2px dashed rgba(255,212,92,.38);opacity:.55;pointer-events:none;animation:lv17-ring 9s linear infinite;}',
        '@keyframes lv17-ring{to{transform:rotate(360deg);}}',
        '.lv17-jar-icon{position:relative;width:128px;z-index:1;filter:drop-shadow(0 22px 30px rgba(0,0,0,.55));',
        ' transition:transform .25s cubic-bezier(.34,1.56,.64,1),filter .25s ease;}',
        '.lv17-jar-icon svg{display:block;width:100%;height:auto;}',
        '.lv17-jar.is-hot .lv17-jar-icon{animation:lv17-jar-hot 1s ease-in-out infinite;}',
        '@keyframes lv17-jar-hot{0%,100%{transform:scale(1);filter:drop-shadow(0 22px 30px rgba(0,0,0,.55));}',
        ' 50%{transform:scale(1.08);filter:drop-shadow(0 0 30px rgba(255,212,92,.9));}}',
        '.lv17-jar.is-fed .lv17-jar-icon{filter:drop-shadow(0 0 40px rgba(255,212,92,.95)) drop-shadow(0 20px 28px rgba(0,0,0,.5));',
        ' animation:lv17-jar-fed 1.1s ease-in-out infinite;}',
        '@keyframes lv17-jar-fed{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px) scale(1.03);}}',

        /* ---------- 桌面文件夹 ---------- */
        /* 关掉 .nf-folder 的 folder-pop 动画：它的 fill-mode 会覆盖拖拽用的 inline transform */
        '.lv17-folder{z-index:44;cursor:grab;animation:none;',
        ' filter:drop-shadow(0 14px 22px rgba(0,0,0,.5)) drop-shadow(0 0 16px rgba(255,212,92,.32));}',
        '.lv17-folder.lv17-folder-grab{filter:drop-shadow(0 18px 28px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,212,92,.6));}',
        '.lv17-folder.lv17-burn{animation:lv17-burn .62s ease-in forwards;pointer-events:none;}',
        '@keyframes lv17-burn{0%{filter:grayscale(0) brightness(1);opacity:1;}',
        ' 28%{filter:grayscale(1) brightness(.72) contrast(1.5);}',
        ' 100%{filter:grayscale(1) brightness(.15);transform:scale(.2) translateY(-170px) rotate(26deg);opacity:0;}}',

        /* ---------- 幽灵演示用的假菜单 ---------- */
        '.lv17-demo-menu{position:absolute;width:206px;padding:6px;border-radius:11px;z-index:52;pointer-events:none;',
        ' background:rgba(249,250,255,.94);color:#262941;border:1px solid rgba(255,255,255,.9);',
        ' box-shadow:0 18px 42px rgba(0,0,0,.42);font-size:13px;animation:lv17-menu-in .18s ease both;}',
        '@keyframes lv17-menu-in{from{opacity:0;transform:scale(.94) translateY(-4px);}to{opacity:1;transform:scale(1) translateY(0);}}',
        '.lv17-demo-row{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:6px;transition:background .16s ease;}',
        '.lv17-demo-row span{flex:1 1 auto;}',
        '.lv17-demo-row .nf-ico{width:18px;height:18px;flex:0 0 auto;}',
        '.lv17-demo-row.sub{padding-left:30px;}',
        '.lv17-demo-row.on{background:rgba(91,124,250,.2);box-shadow:inset 0 0 0 1px rgba(91,124,250,.24);}',
        '.lv17-demo-arrow{flex:0 0 auto !important;width:12px;color:rgba(38,41,65,.5);text-align:right;}'
      ].join(''));

      /* ============================================================
         骨架：暗角 / Boss / 倒计时条 / 罐子 / 红闪
         ============================================================ */

      var vignette = document.createElement('div');
      vignette.className = 'lv17-vignette';
      ctx.root.appendChild(vignette);

      boss = document.createElement('div');
      boss.className = 'lv17-boss';
      boss.dataset.t = 'mascot-boss';
      boss.dataset.eyes = 'closed';
      boss.dataset.phase = 'build';
      boss.innerHTML = '<div class="lv17-aura"></div>' +
        '<div class="lv17-face">' + NF.icons.svg('folderFace') + '</div>' +
        '<div class="lv17-glare"></div>' +
        '<div class="lv17-lid lv17-lid-l"></div>' +
        '<div class="lv17-lid lv17-lid-r"></div>' +
        '<div class="lv17-zzz">zZ</div>' +
        '<div class="lv17-dizzy-stars">✦ ✦ ✦</div>';
      ctx.root.appendChild(boss);

      dashBar = document.createElement('div');
      dashBar.className = 'lv17-dash';
      dashBar.dataset.t = 'dash-bar';
      dashBar.innerHTML = '<i></i>';
      ctx.root.appendChild(dashBar);

      jar = document.createElement('div');
      jar.className = 'lv17-jar';
      jar.dataset.t = 'boss-jar';
      jar.innerHTML = '<div class="lv17-jar-ring"></div>' +
        '<div class="lv17-jar-icon">' + NF.icons.svg('jar') + '</div>';
      ctx.root.appendChild(jar);

      gazeFlash = document.createElement('div');
      gazeFlash.className = 'lv17-gaze-flash';
      ctx.root.appendChild(gazeFlash);

      /* ============================================================
         眼睛状态机
         ============================================================ */

      function scheduleEyes(ms, fn) {
        clearTimeout(eyeTimer);
        eyeTimer = ctx.timer(ms, fn);
      }

      function applyEyes(open, opts) {
        opts = opts || {};
        eyesOpen = !!open;
        clearTimeout(eyeTimer);
        eyeTimer = 0;
        if (boss) {
          boss.dataset.eyes = eyesOpen ? 'open' : 'closed';
          boss.dataset.phase = winning ? 'dizzy' : (folder ? 'dash' : 'build');
        }
        if (completed || winning) return;
        if (eyesOpen) {
          // 睁眼：收起所有菜单/对话，开始凝视
          try { OS.closeMenus(); } catch (e) { /* 忽略 */ }
          if (typeof OS.closeDialogs === 'function') {
            try { OS.closeDialogs(); } catch (e2) { /* 忽略 */ }
          }
          flashGaze();
          NF.Audio.play('robot', { volume: 0.14 });
          if (folder) ctx.timer(170, burnIfSeen);
          scheduleEyes(OPEN_MS, function () {
            if (!completed && !winning) applyEyes(false);
          });
        } else if (!opts.hold) {
          // 闭眼：随机 1.3 - 1.9 秒后睁开
          scheduleEyes(OS.rand(1300, 1900), function () {
            if (!completed && !winning) applyEyes(true);
          });
        }
      }

      function flashGaze() {
        if (!gazeFlash) return;
        gazeFlash.classList.remove('on');
        void gazeFlash.offsetWidth;
        gazeFlash.classList.add('on');
      }

      function gazeLocked() {
        return eyesOpen && !completed && !winning;
      }

      /* 睁眼时被点：拒绝 + 红闪 + 抖动 + 涟漪 */
      function gazeFeedback(x, y) {
        var now = performance.now();
        if (now - lastGazeAt < 240) return;
        lastGazeAt = now;
        NF.Audio.play('deny', { volume: 0.5 });
        flashGaze();
        if (boss) {
          boss.classList.add('is-glaring');
          ctx.timer(260, function () { if (boss) boss.classList.remove('is-glaring'); });
        }
        NF.FX.ripple(x, y, { color: 'rgba(255,72,96,.55)', radius: 48 });
        NF.FX.shake(3, 160);
      }

      function onGazePointer(e) {
        if (!gazeLocked()) return;
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        gazeFeedback(e.clientX, e.clientY);
      }

      function onGazeSilent(e) {
        if (!gazeLocked()) return;
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      }

      // capture 阶段吞掉全局点击：闭眼窗口里完全放行
      ctx.on(document, 'pointerdown', onGazePointer, true);
      ctx.on(document, 'click', onGazeSilent, true);
      ctx.on(document, 'dblclick', onGazeSilent, true);
      ctx.on(document, 'contextmenu', onGazeSilent, true);

      /* ============================================================
         右键菜单 / 建文件夹
         ============================================================ */

      function menuItems() {
        var canCreate = !folder && !winning && !completed && !eyesOpen;
        return [
          { id: 'view', label: '查看', icon: 'eye', disabled: true },
          { id: 'refresh', label: '刷新', icon: 'restart', onSelect: function () { NF.Audio.play('whoosh', { volume: 0.5 }); } },
          { separator: true },
          {
            id: 'new', label: '新建', icon: 'folder', disabled: !canCreate,
            submenu: [
              {
                id: 'folder', label: '文件夹', icon: 'folder', testid: 'menu-item-folder',
                disabled: !canCreate, onSelect: createFolder
              },
              {
                id: 'text', label: '文本文档', icon: 'fileText',
                onSelect: function () { NF.Audio.play('deny', { volume: 0.4 }); }
              }
            ]
          }
        ];
      }

      function openMenuAt(x, y) {
        if (eyesOpen || completed || winning) return;
        OS.closeMenus();
        OS.menu({ x: x, y: y, items: menuItems() });
      }

      function createFolder() {
        if (completed || winning || folder) return;
        if (eyesOpen) { NF.Audio.play('deny', { volume: 0.4 }); return; }
        OS.closeMenus();
        var fx = OS.clamp(Math.round(W * 0.5 - 38 + OS.rand(-80, 80)), 40, Math.max(40, W - 170));
        var fy = OS.clamp(Math.round(H * 0.56 + OS.rand(-26, 26)), 300, Math.max(300, H - 190));
        folder = ctx.createdFolder({ x: fx, y: fy, label: '新建文件夹', testid: 'created-folder' });
        folder.classList.add('lv17-folder');
        folder.dataset.qa = 'l17-folder';
        NF.Audio.play('pop');
        NF.Audio.play('sparkle', { volume: 0.35 });
        var c = OS.center(folder);
        NF.FX.burst(c.x, c.y, {
          count: 20, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 6, gravity: 0.2
        });
        bindFolderDrag();
        enterDash();
      }

      function pointInJar(x, y) {
        var r = OS.rect(jar);
        return x > r.left - 30 && x < r.right + 30 && y > r.top - 30 && y < r.bottom + 40;
      }

      function bindFolderDrag() {
        if (!folder) return;
        if (folderDrag) { try { folderDrag.destroy(); } catch (e) { /* 忽略 */ } folderDrag = null; }
        var el = folder;
        var base = { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0 };

        folderDrag = OS.makeDraggable(el, {
          threshold: 3,
          canStart: function () { return !completed && !winning; },
          onStart: function () {
            el.style.zIndex = '52';
            el.classList.add('lv17-folder-grab');
            NF.Audio.play('paper', { volume: 0.5 });
          },
          onMove: function (e, st) {
            el.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) rotate(' +
              OS.clamp(st.dx * 0.03, -7, 7).toFixed(2) + 'deg)';
            var hot = pointInJar(e.clientX, e.clientY) || OS.overlapRatio(el, jar) > 0.16;
            jar.classList.toggle('is-hot', hot);
          },
          onEnd: function (e, st) {
            el.classList.remove('lv17-folder-grab');
            if (completed || winning) return;
            var hot = pointInJar(e.clientX, e.clientY) || OS.overlapRatio(el, jar) > 0.18;
            jar.classList.remove('is-hot');
            OS.commitDrag(el, st.dx, st.dy);
            el.style.transform = '';
            base.x = parseFloat(el.style.left) || base.x;
            base.y = parseFloat(el.style.top) || base.y;
            if (hot) saveFolder();
            else {
              NF.Audio.play('thud', { volume: 0.4 });
              NF.FX.dust(OS.center(el).x, OS.center(el).y);
            }
          }
        });
      }

      /* 文件夹出现后：强制闭眼 2.4s 抢跑 */
      function enterDash() {
        dashBar.innerHTML = '<i style="animation-duration:' + DASH_MS + 'ms"></i>';
        dashBar.classList.add('show');
        clearTimeout(dashTimer);
        clearTimeout(eyeTimer);
        applyEyes(false, { hold: true });
        boss.dataset.phase = 'dash';
        NF.Audio.play('alarm', { volume: 0.18 });
        dashTimer = ctx.timer(DASH_MS, function () {
          dashBar.classList.remove('show');
          if (completed || winning || !folder) return;
          applyEyes(true);
        });
        ctx.timer(480, function () {
          if (!completed && !winning && folder) ctx.replayHint();
        });
      }

      /* 睁眼时文件夹还在外面：被盯成灰烬 */
      function burnIfSeen() {
        if (completed || winning || !folder || !eyesOpen) return;
        var f = folder;
        folder = null;
        if (folderDrag) { try { folderDrag.destroy(); } catch (e) { /* 忽略 */ } folderDrag = null; }
        var fr = OS.rect(f);
        f.style.pointerEvents = 'none';
        f.style.transform = '';
        f.classList.add('lv17-burn');
        boss.classList.add('is-glaring');
        boss.dataset.phase = 'build';
        dashBar.classList.remove('show');
        NF.Audio.play('explode', { volume: 0.34 });
        NF.Audio.play('error', { volume: 0.55 });
        NF.Audio.play('giggle', { volume: 0.3 });
        NF.FX.flash('rgba(255,54,84,.18)', 220);
        NF.FX.shake(6, 280);
        NF.FX.ripple(fr.left + fr.width / 2, fr.top + fr.height / 2, {
          color: 'rgba(255,92,112,.55)', radius: 72
        });
        ctx.timer(240, function () {
          NF.FX.burst(fr.left + fr.width / 2, fr.top + fr.height / 2, {
            count: 30, colors: ['#8e8a9e', '#c9c4d6', '#5c5868'], speed: 8, gravity: -0.05
          });
        });
        ctx.timer(420, function () { boss.classList.remove('is-glaring'); });
        ctx.timer(640, function () { if (f.parentNode) f.remove(); });
        ctx.toast({ icon: 'eye', title: '被盯上了', kind: 'error', ms: 1400 });
        ctx.timer(760, function () {
          if (!completed && !winning && !folder) ctx.replayHint();
        });
      }

      /* 成功入罐：罐子发光，Boss 晕眩，过关 */
      function saveFolder() {
        if (completed || winning || !folder) return;
        winning = true;
        clearTimeout(eyeTimer);
        clearTimeout(dashTimer);
        eyeTimer = 0;
        dashTimer = 0;
        dashBar.classList.remove('show');
        if (folderDrag) { try { folderDrag.destroy(); } catch (e) { /* 忽略 */ } folderDrag = null; }

        var f = folder;
        folder = null;
        jar.classList.remove('is-hot');
        jar.classList.add('is-fed');
        boss.dataset.eyes = 'closed';
        boss.dataset.phase = 'dizzy';
        boss.classList.add('is-dizzy');

        var jr = OS.rect(jar);
        var fr = OS.rect(f);
        var dx = (jr.left + jr.width / 2) - (fr.left + fr.width / 2);
        var dy = (jr.top + jr.height * 0.62) - (fr.top + fr.height / 2);
        f.style.zIndex = '45';
        f.style.transition = 'left .42s cubic-bezier(.34,1.56,.64,1),top .42s cubic-bezier(.34,1.56,.64,1),' +
          'transform .42s cubic-bezier(.34,1.56,.64,1),opacity .3s ease';
        f.style.left = ((parseFloat(f.style.left) || 0) + dx) + 'px';
        f.style.top = ((parseFloat(f.style.top) || 0) + dy) + 'px';
        f.style.transform = 'scale(.42) rotate(-8deg)';
        NF.Audio.play('snap', { volume: 0.9 });
        NF.Audio.play('sparkle', { volume: 0.8 });

        ctx.timer(430, function () {
          f.style.opacity = '0.92';
          NF.FX.flash('rgba(255,240,190,.5)', 240);
          NF.FX.burst(jr.left + jr.width / 2, jr.top + jr.height / 2, {
            count: 44, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#ff6ba9'], speed: 10, gravity: 0.18
          });
          NF.FX.confetti({ count: 60 });
          NF.Audio.play('explode', { volume: 0.4 });
          NF.Audio.play('giggle', { volume: 0.2 });
        });
        ctx.timer(1100, function () {
          if (completed) return;
          ctx.complete({ el: f, delay: 1400 });
        });
      }

      /* ============================================================
         幽灵演示（假菜单 + 拖拽路径，不替玩家操作）
         ============================================================ */

      function removeDemoMenu() {
        if (demoMenu && demoMenu.parentNode) demoMenu.remove();
        demoMenu = null;
      }

      function markDemo(testid, cls) {
        if (!demoMenu) return;
        var row = demoMenu.querySelector('[data-t="' + testid + '"]');
        if (row) row.classList.add(cls || 'on');
      }

      function showDemoMenu() {
        removeDemoMenu();
        var px = OS.clamp(Math.round(W * 0.5 - 104), 28, Math.max(28, W - 250));
        var py = OS.clamp(Math.round(H * 0.70), 80, Math.max(80, H - 210));
        demoMenu = document.createElement('div');
        demoMenu.className = 'lv17-demo-menu';
        demoMenu.dataset.t = 'lv17-demo-menu';
        demoMenu.style.left = px + 'px';
        demoMenu.style.top = py + 'px';
        demoMenu.innerHTML =
          '<div class="lv17-demo-row" data-t="lv17-demo-refresh">' + NF.icons.svg('restart') + '<span>刷新</span></div>' +
          '<div class="lv17-demo-row" data-t="lv17-demo-new">' + NF.icons.svg('folder') + '<span>新建</span><span class="lv17-demo-arrow">▸</span></div>' +
          '<div class="lv17-demo-row sub" data-t="lv17-demo-folder">' + NF.icons.svg('folder') + '<span>文件夹</span></div>';
        ctx.root.appendChild(demoMenu);
        NF.Audio.play('open', { volume: 0.35 });
      }

      function waitClosed(maxMs) {
        return new Promise(function (resolve) {
          var t0 = performance.now();
          (function poll() {
            if (!eyesOpen || completed || winning) { resolve(true); return; }
            if (performance.now() - t0 >= maxMs) { resolve(false); return; }
            setTimeout(poll, 70);
          })();
        });
      }

      function buildDemoSteps() {
        var cx = Math.round(W * 0.5);
        var cy = Math.round(H * 0.66);
        return [
          { move: '[data-t="mascot-boss"]', dur: 380 },
          { highlight: '[data-t="mascot-boss"]', dur: 560 },
          { do: function () { return waitClosed(3200); } },
          { move: [cx, cy], dur: 320 },
          { click: 'right', target: [cx, cy], after: 140 },
          { do: showDemoMenu },
          { move: '[data-t="lv17-demo-new"]', dur: 300 },
          { click: 'left', target: '[data-t="lv17-demo-new"]', after: 160 },
          { do: function () { markDemo('lv17-demo-new'); } },
          { move: '[data-t="lv17-demo-folder"]', dur: 240 },
          { click: 'left', target: '[data-t="lv17-demo-folder"]', after: 160 },
          { do: function () { markDemo('lv17-demo-folder'); } },
          { wait: 140 },
          { do: removeDemoMenu },
          { move: '[data-t="boss-jar"]', dur: 520 },
          { highlight: '[data-t="boss-jar"]', dur: 560 }
        ];
      }

      function dashDemoSteps() {
        return [
          { move: '[data-t="created-folder"]', dur: 420 },
          { highlight: '[data-t="created-folder"]', dur: 520 },
          { drag: { from: '[data-t="created-folder"]', to: '[data-t="boss-jar"]', dur: 900, after: 200 } },
          { highlight: '[data-t="boss-jar"]', dur: 560 }
        ];
      }

      var demo = async function () {
        if (completed || winning) return;
        removeDemoMenu();
        try {
          await NF.Ghost.play(folder ? dashDemoSteps() : buildDemoSteps());
        } finally {
          removeDemoMenu();
        }
      };
      ctx.hint(demo);

      /* ============================================================
         输入
         ============================================================ */

      ctx.on(ctx.root, 'contextmenu', function (e) {
        e.preventDefault();
        if (gazeLocked() || completed || winning) return;
        openMenuAt(e.clientX, e.clientY);
      });

      ctx.timer(900, function () {
        if (completed || winning) return;
        var c = OS.center(jar);
        NF.FX.ripple(c.x, c.y, { color: 'rgba(255,212,92,.35)', radius: 84 });
      });

      /* ============================================================
         清理 & 启动
         ============================================================ */

      ctx.onCleanup(function () {
        removeDemoMenu();
        clearTimeout(eyeTimer);
        clearTimeout(dashTimer);
        eyeTimer = 0;
        dashTimer = 0;
        if (folderDrag) { try { folderDrag.destroy(); } catch (e) { /* 忽略 */ } folderDrag = null; }
        if (gazeFlash) gazeFlash.classList.remove('on');
        folder = null;
      });

      applyEyes(false); // 开局先闭眼一个窗口，给玩家缓冲
      ctx.qa('l17', ctx.root);
    }
  });
})();

</script>
<script data-src="js/levels/l18.js">
/* js/levels/l18.js */
/* 第 18 关：假结局
   —— 游戏提前播放了自己的结局页，试图骗玩家"已经通关"。
   1. 全屏假结局层（暗夜、星空、3 个文件夹的玻璃罐、滚动字幕、会躲的"再玩一次"）；
   2. 唯一可行的操作：Ctrl+Shift+F 调出 OS 命名对话框（在 ui-layer，会盖在假结局上）→ 确定；
   3. 文件夹出现在假结局层上方；把它拖到标题中央的发光裂缝（rewind-target）；
   4. 松手 → 屏幕倒带撕裂 → 假结局碎裂消失，露出真实桌面 → 过关。 */
(function () {
  'use strict';
  var ID = 18;
  var OS = NF.OS;

  NF.Game.registerLevel({
    id: ID,
    icon: 'star',
    init: function (ctx) {
      var VW = innerWidth;
      var VH = innerHeight;

      var LH = ctx.root.clientHeight || (VH - 58);

      var completed = false;
      var folder = null;
      var drag = null;
      var dlg = null;
      var fake = null;
      var fakeTitle = null;
      var jarEl = null;
      var restartBtn = null;
      var target = null;
      var tauntEl = null;
      var tauntTimer = 0;
      var dodge = { x: 0, y: 0 };
      var lastDodgeAt = 0;

      ctx.style([
        /* ---------- 假结局层（挂到 #os 上，z 75：盖住任务栏但低于 ui-layer 的对话框） ---------- */
        '.lv18-fake-ending{position:absolute;inset:0;z-index:75;overflow:hidden;pointer-events:auto;',
        ' background:radial-gradient(ellipse 46% 38% at 50% 58%,rgba(255,176,32,.10),transparent 70%),',
        ' radial-gradient(ellipse 62% 60% at 50% 112%,rgba(70,56,160,.5),transparent 70%),',
        ' linear-gradient(180deg,#0a0a1a,#161331 55%,#241a4d 100%);',
        ' filter:saturate(.72) brightness(.94);transition:opacity .42s ease,transform .48s ease,filter .2s ease;}',
        '.lv18-fake-ending.lv18-gone{opacity:0;transform:scale(1.07) rotate(.5deg);',
        ' filter:invert(1) hue-rotate(160deg);pointer-events:none;}',
        /* 撕裂光条 */
        '.lv18-fake-ending::before,.lv18-fake-ending::after{content:"";position:absolute;left:0;right:0;height:2px;',
        ' background:rgba(255,255,255,.9);opacity:0;pointer-events:none;z-index:30;box-shadow:0 0 22px rgba(255,255,255,.8);}',
        '.lv18-fake-ending.lv18-rewind::before{top:31%;opacity:.9;animation:lv18-tear .28s steps(2) infinite;}',
        '.lv18-fake-ending.lv18-rewind::after{top:64%;opacity:.75;animation:lv18-tear .22s steps(2) infinite reverse;}',
        '@keyframes lv18-tear{0%{transform:translateX(-14px) scaleY(1);}50%{transform:translateX(10px) scaleY(3);}100%{transform:translateX(-4px) scaleY(.6);}}',
        /* 星空 */
        '.lv18-stars{position:absolute;inset:0;pointer-events:none;opacity:.55;',
        ' background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent 60%),',
        ' radial-gradient(1px 1px at 28% 64%,#dfe8ff,transparent 60%),',
        ' radial-gradient(2px 2px at 45% 18%,#fff,transparent 60%),',
        ' radial-gradient(1px 1px at 61% 76%,#e6dcff,transparent 60%),',
        ' radial-gradient(1.5px 1.5px at 76% 34%,#fff,transparent 60%),',
        ' radial-gradient(1px 1px at 88% 58%,#d6eeff,transparent 60%),',
        ' radial-gradient(1.5px 1.5px at 36% 88%,#fff,transparent 60%),',
        ' radial-gradient(1px 1px at 8% 82%,#ffe6c8,transparent 60%);',
        ' animation:lv18-twinkle 5s ease-in-out infinite alternate;}',
        '@keyframes lv18-twinkle{from{opacity:.3;}to{opacity:.6;}}',
        /* 标题（假） */
        '.lv18-title{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:48px;font-weight:900;',
        ' letter-spacing:.34em;padding-left:.34em;white-space:nowrap;',
        ' background:linear-gradient(180deg,#d9d9e4,#a9a3b8 58%,#7d7590);-webkit-background-clip:text;background-clip:text;',
        ' color:transparent;filter:drop-shadow(0 8px 26px rgba(140,120,200,.25));',
        ' animation:lv18-fake-flicker 7s steps(1) infinite;}',
        '@keyframes lv18-fake-flicker{0%,93%,100%{opacity:.95;}94%{opacity:.5;transform:translateX(-50%) skewX(2deg);}',
        ' 95%{opacity:.95;transform:translateX(-50%);}97%{opacity:.7;transform:translateX(-50%) translateY(1px);}}',
        '.lv18-sub{position:absolute;left:50%;top:calc(15% + 74px);transform:translateX(-50%);font-size:13px;',
        ' letter-spacing:.42em;color:rgba(214,210,236,.38);white-space:nowrap;}',
        /* 假玻璃罐：里面只有 3 个文件夹 */
        '.lv18-jar{position:absolute;left:50%;top:44%;width:214px;margin-left:-107px;pointer-events:auto;cursor:default;',
        ' filter:grayscale(.25) brightness(.9);transition:transform .2s ease,filter .2s ease;}',
        '.lv18-jar svg{display:block;width:100%;height:auto;filter:drop-shadow(0 26px 38px rgba(0,0,0,.55));}',
        '.lv18-jar-folders{position:absolute;left:0;right:0;bottom:13%;height:38%;pointer-events:none;}',
        '.lv18-jar-folders span{position:absolute;width:38px;height:32px;filter:brightness(.92);}',
        '.lv18-jar-folders span svg{width:100%;height:100%;}',
        '.lv18-jar-folders span:nth-child(1){left:29%;bottom:8%;transform:rotate(-9deg);}',
        '.lv18-jar-folders span:nth-child(2){left:41%;bottom:22%;transform:rotate(3deg);}',
        '.lv18-jar-folders span:nth-child(3){left:53%;bottom:6%;transform:rotate(11deg);}',
        '.lv18-jar.lv18-jar-taunt{animation:lv18-jar-taunt .5s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv18-jar-taunt{0%,100%{transform:rotate(0);}30%{transform:rotate(-4deg) scale(1.03);}70%{transform:rotate(3deg);}}',
        /* 标题中央的裂缝目标 */
        '.lv18-crack-target{position:absolute;width:40px;height:80px;z-index:20;pointer-events:none;border-radius:12px;',
        ' filter:drop-shadow(0 0 16px rgba(255,212,92,.85));animation:lv18-crack-breathe 1.5s ease-in-out infinite;}',
        '.lv18-crack-target svg{display:block;width:100%;height:100%;opacity:.95;}',
        '.lv18-crack-target::after{content:"";position:absolute;inset:-14px;border-radius:50%;',
        ' background:radial-gradient(circle,rgba(255,212,92,.34),transparent 68%);}',
        '@keyframes lv18-crack-breathe{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.12);opacity:1;}}',
        /* 字幕条 */
        '.lv18-credits{position:absolute;left:0;right:0;bottom:26px;height:34px;overflow:hidden;pointer-events:none;',
        ' -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);',
        ' mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);}',
        '.lv18-credits-track{position:absolute;left:100%;top:0;display:flex;align-items:center;gap:64px;height:100%;',
        ' white-space:nowrap;color:rgba(222,218,242,.4);font-size:12px;letter-spacing:.28em;',
        ' animation:lv18-credits 26s linear infinite;}',
        '@keyframes lv18-credits{from{transform:translateX(0);}to{transform:translateX(calc(-100% - 100vw));}}',
        '.lv18-credits-track span{display:flex;align-items:center;gap:10px;}',
        '.lv18-credits-track .nf-ico{width:16px;height:16px;opacity:.6;}',
        /* 会躲的"再玩一次" */
        '.lv18-restart{position:absolute;right:84px;bottom:98px;z-index:22;display:flex;align-items:center;gap:10px;',
        ' padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.24);',
        ' background:rgba(34,30,64,.72);color:#cfcae8;font-size:13px;font-weight:700;letter-spacing:.1em;',
        ' cursor:pointer;backdrop-filter:blur(10px);box-shadow:0 16px 36px rgba(0,0,0,.4);',
        ' transition:transform .2s cubic-bezier(.22,.8,.3,1),box-shadow .2s ease,opacity .2s ease;}',
        '.lv18-restart .nf-ico{width:20px;height:20px;opacity:.8;}',
        '.lv18-restart:hover{box-shadow:0 18px 40px rgba(0,0,0,.5);}',
        /* 嘲讽气泡 */
        '.lv18-taunt{position:absolute;left:50%;top:calc(44% - 34px);transform:translate(-50%,0) scale(.8);z-index:24;',
        ' padding:8px 16px;border-radius:10px;background:rgba(18,15,36,.92);color:#d8d2ef;font-size:12.5px;',
        ' letter-spacing:.08em;border:1px solid rgba(255,255,255,.16);opacity:0;pointer-events:none;',
        ' box-shadow:0 12px 30px rgba(0,0,0,.45);transition:opacity .18s ease,transform .24s cubic-bezier(.34,1.56,.64,1);}',
        '.lv18-taunt.show{opacity:1;transform:translate(-50%,-14px) scale(1);}',
        /* 回到真实桌面后的文件夹 */
        /* 关掉 .nf-folder 的 folder-pop 动画：它的 fill-mode 会覆盖拖拽用的 inline transform */
        '.lv18-folder{z-index:12;animation:none;',
        ' filter:drop-shadow(0 14px 22px rgba(0,0,0,.5)) drop-shadow(0 0 18px rgba(255,212,92,.45));}',
        '.lv18-folder.is-target-hot{filter:drop-shadow(0 0 26px rgba(255,212,92,.95)) brightness(1.08);}',
        '.lv18-folder.is-rewinding{pointer-events:none;}'
      ].join(''));

      /* ============================================================
         假结局层
         ============================================================ */

      var host = document.getElementById('os') || ctx.root;

      function buildFakeEnding() {
        fake = document.createElement('div');
        fake.className = 'lv18-fake-ending';
        fake.dataset.t = 'fake-ending';

        var stars = document.createElement('div');
        stars.className = 'lv18-stars';
        fake.appendChild(stars);

        fakeTitle = document.createElement('div');
        fakeTitle.className = 'lv18-title';
        fakeTitle.dataset.t = 'fake-ending-title';
        fakeTitle.textContent = '新建文件夹';
        fake.appendChild(fakeTitle);

        var sub = document.createElement('div');
        sub.className = 'lv18-sub';
        sub.textContent = '20 / 20';
        fake.appendChild(sub);

        jarEl = document.createElement('div');
        jarEl.className = 'lv18-jar';
        jarEl.dataset.t = 'fake-ending-jar';
        jarEl.innerHTML = NF.icons.svg('jar') +
          '<div class="lv18-jar-folders"><span>' + NF.icons.svg('folder') + '</span>' +
          '<span>' + NF.icons.svg('folder') + '</span>' +
          '<span>' + NF.icons.svg('folder') + '</span></div>';
        fake.appendChild(jarEl);

        target = document.createElement('div');
        target.className = 'lv18-crack-target';
        target.dataset.t = 'rewind-target';
        target.innerHTML = NF.icons.svg('crack');
        fake.appendChild(target);

        var credits = document.createElement('div');
        credits.className = 'lv18-credits';
        var track = document.createElement('div');
        track.className = 'lv18-credits-track';
        ['STAFF', '小夹', '美术', '音乐', '特别感谢', '你', '再见'].forEach(function (word, i) {
          var span = document.createElement('span');
          span.appendChild(NF.icons.el(i % 2 ? 'folder' : 'sparkle'));
          var txt = document.createElement('i');
          txt.style.fontStyle = 'normal';
          txt.textContent = word;
          span.appendChild(txt);
          track.appendChild(span);
        });
        credits.appendChild(track);
        fake.appendChild(credits);

        restartBtn = document.createElement('div');
        restartBtn.className = 'lv18-restart';
        restartBtn.dataset.t = 'fake-restart';
        restartBtn.setAttribute('role', 'button');
        restartBtn.innerHTML = NF.icons.svg('restart') + '<span>再玩一次</span>';
        fake.appendChild(restartBtn);

        tauntEl = document.createElement('div');
        tauntEl.className = 'lv18-taunt';
        tauntEl.dataset.t = 'fake-taunt';
        fake.appendChild(tauntEl);

        host.appendChild(fake);

        placeTarget();
        if (typeof ResizeObserver === 'function') {
          try {
            var ro = new ResizeObserver(function () { placeTarget(); });
            ro.observe(fake);
            ctx.onCleanup(function () { try { ro.disconnect(); } catch (e) { /* 忽略 */ } });
          } catch (e) { /* 旧浏览器忽略 */ }
        } else {
          ctx.on(window, 'resize', placeTarget);
        }
        wireFakeActions();
      }

      /* 把裂缝对准标题中央 */
      function placeTarget() {
        if (!fake || !target || !fakeTitle) return;
        var fr = OS.rect(fake);
        var tr = OS.rect(fakeTitle);
        target.style.left = Math.round(tr.left - fr.left + tr.width / 2 - 20) + 'px';
        target.style.top = Math.round(tr.top - fr.top + tr.height / 2 - 40) + 'px';
      }

      function showTaunt(text) {
        if (!tauntEl) return;
        tauntEl.textContent = text;
        tauntEl.classList.add('show');
        clearTimeout(tauntTimer);
        tauntTimer = ctx.timer(1300, function () {
          if (tauntEl) tauntEl.classList.remove('show');
        });
      }

      /* 假结局上的一切按钮/罐子都只有嘲讽 */
      function wireFakeActions() {
        var tauntWords = ['已经通关了', '别点了', '真的结束了', '你来得太早了'];

        if (jarEl) {
          ctx.on(jarEl, 'click', function (e) {
            e.stopPropagation();
            NF.Audio.play('giggle', { volume: 0.5 });
            NF.Audio.play('deny', { volume: 0.3 });
            jarEl.classList.remove('lv18-jar-taunt');
            void jarEl.offsetWidth;
            jarEl.classList.add('lv18-jar-taunt');
            showTaunt(tauntWords[Math.floor(Math.random() * tauntWords.length)]);
          });
        }

        if (restartBtn) {
          // 鼠标靠近就躲
          ctx.on(restartBtn, 'pointermove', function (e) {
            var now = performance.now();
            if (now - lastDodgeAt < 90) return;
            lastDodgeAt = now;
            var r = OS.rect(restartBtn);
            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;
            var dx = cx - e.clientX;
            var dy = cy - e.clientY;
            if (Math.hypot(dx, dy) > 130) return;
            var ang = Math.atan2(dy, dx) + (Math.random() * 0.9 - 0.45);
            dodge.x = OS.clamp(dodge.x + Math.cos(ang) * OS.rand(40, 70), -190, 40);
            dodge.y = OS.clamp(dodge.y + Math.sin(ang) * OS.rand(18, 40), -90, 30);
            restartBtn.style.transform = 'translate(' + dodge.x.toFixed(1) + 'px,' + dodge.y.toFixed(1) + 'px) rotate(' +
              ((Math.random() * 2 - 1) * 3).toFixed(1) + 'deg)';
            NF.Audio.play('dodge', { volume: 0.6 });
          });
          ctx.on(restartBtn, 'click', function (e) {
            e.stopPropagation();
            e.preventDefault();
            NF.Audio.play('giggle', { volume: 0.7 });
            showTaunt('想得美');
            dodge.x = OS.rand(-160, 30);
            dodge.y = OS.rand(-80, 20);
            restartBtn.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
            restartBtn.style.transform = 'translate(' + dodge.x.toFixed(1) + 'px,' + dodge.y.toFixed(1) + 'px) rotate(-4deg)';
          });
        }

        ctx.on(fake, 'contextmenu', function (e) { e.preventDefault(); });
      }

      /* ============================================================
         Ctrl+Shift+F → 命名对话框 → 文件夹
         ============================================================ */

      function openNameDialog() {
        if (completed) return;
        if (dlg && !dlg.closed) { dlg.shake(); return; }
        NF.Audio.play('open', { volume: 0.4 });
        dlg = OS.nameDialog({
          title: '新建文件夹',
          icon: 'folder',
          value: '新建文件夹',
          onSubmit: function (name) {
            dlg = null;
            spawnFolder(name || '新建文件夹');
            return true;
          },
          onClose: function () { dlg = null; }
        });
      }

      function spawnFolder(name) {
        if (completed || folder || !fake) return;
        var fx = OS.clamp(Math.round(VW * 0.5 - 38 + 170), 40, VW - 180);
        var fy = OS.clamp(Math.round(VH * 0.60), 80, VH - 150);
        folder = ctx.createdFolder({ x: fx, y: fy, label: String(name).slice(0, 24), testid: 'created-folder' });
        folder.classList.add('lv18-folder');
        folder.dataset.qa = 'l18-folder';
        // 假结局层在 #os 上（z 75），文件夹必须是它的子元素才能出现在最上面
        if (folder.parentNode) folder.parentNode.removeChild(folder);
        fake.appendChild(folder);
        folder.style.zIndex = '12';
        NF.Audio.play('pop');
        NF.Audio.play('sparkle', { volume: 0.5 });
        var c = OS.center(folder);
        NF.FX.burst(c.x, c.y, { count: 24, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 7, gravity: 0.2 });
        bindFolderDrag();
        ctx.timer(420, function () {
          if (!completed && folder) ctx.replayHint();
        });
      }

      function nearTarget() {
        if (!folder || !target) return false;
        var fc = OS.center(folder);
        var tc = OS.center(target);
        if (Math.hypot(fc.x - tc.x, fc.y - tc.y) < 96) return true;
        return OS.overlapRatio(folder, target) > 0.18;
      }

      function bindFolderDrag() {
        if (!folder) return;
        if (drag) { try { drag.destroy(); } catch (e) { /* 忽略 */ } drag = null; }
        var el = folder;
        var base = { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0 };
        drag = OS.makeDraggable(el, {
          threshold: 3,
          canStart: function () { return !completed; },
          onStart: function () {
            el.style.zIndex = '18';
            el.classList.add('is-target-hot');
            NF.Audio.play('paper', { volume: 0.5 });
          },
          onMove: function (e, st) {
            el.style.transform = 'translate(' + st.dx + 'px,' + st.dy + 'px) rotate(' +
              OS.clamp(st.dx * 0.03, -7, 7).toFixed(2) + 'deg)';
            el.classList.toggle('is-target-hot', nearTarget());
          },
          onEnd: function (e, st) {
            if (completed) return;
            el.classList.remove('is-target-hot');
            if (nearTarget()) {
              rewind(el);
              return;
            }
            base.x = OS.clamp(base.x + st.dx, 16, VW - 110);
            base.y = OS.clamp(base.y + st.dy, 16, VH - 130);
            el.style.left = base.x + 'px';
            el.style.top = base.y + 'px';
            el.style.transform = '';
            NF.Audio.play('thud', { volume: 0.4 });
            NF.FX.dust(OS.center(el).x, OS.center(el).y);
          }
        });
      }

      /* ============================================================
         倒带：假结局碎裂，露出真实桌面
         ============================================================ */

      function rewind(el) {
        if (completed) return;
        completed = true;
        if (drag) { try { drag.destroy(); } catch (e) { /* 忽略 */ } drag = null; }
        folder = null;
        el.classList.add('is-rewinding');

        var fr = OS.rect(el);
        var tr = OS.rect(target);
        var jc = { x: tr.left + tr.width / 2, y: tr.top + tr.height / 2 };

        NF.Audio.play('whoosh');
        NF.Audio.play('powerdown');
        NF.Audio.play('explode', { volume: 0.34 });
        NF.FX.flash('rgba(255,255,255,.85)', 300);
        NF.FX.shake(9, 520);
        NF.FX.ripple(jc.x, jc.y, { color: 'rgba(255,212,92,.9)', radius: 110 });

        // 文件夹被吸进裂缝
        el.style.transition = 'transform .34s cubic-bezier(.5,0,.8,.4),opacity .34s ease';
        el.style.transform = 'translate(' + (jc.x - (fr.left + fr.width / 2)) + 'px,' +
          (jc.y - (fr.top + fr.height / 2)) + 'px) scale(.16) rotate(200deg)';
        el.style.opacity = '0.15';

        // 屏幕倒带撕裂
        if (fake) fake.classList.add('lv18-rewind');
        ctx.timer(120, function () {
          NF.FX.flash('rgba(255,255,255,.55)', 180);
          NF.FX.burst(jc.x, jc.y, {
            count: 46, colors: ['#ffc94d', '#ff6ba9', '#8a6cff', '#7ef0c0', '#ffffff'], speed: 13, gravity: 0.05
          });
        });

        // 把文件夹搬回真实桌面（坐标原点相同），再滑到桌面中央
        ctx.timer(340, function () {
          if (el.parentNode) el.parentNode.removeChild(el);
          el.style.transition = 'none';
          el.style.transform = '';
          el.style.opacity = '0';
          el.style.left = Math.round(VW / 2 - 38) + 'px';
          el.style.top = Math.round(VH * 0.56) + 'px';
          ctx.root.appendChild(el);
          void el.offsetWidth;
          el.style.transition = 'left .5s cubic-bezier(.34,1.56,.64,1),top .5s cubic-bezier(.34,1.56,.64,1),opacity .32s ease';
          el.style.left = Math.round(VW / 2 - 38) + 'px';
          el.style.top = Math.round(VH * 0.5 - 38) + 'px';
          el.style.opacity = '1';
        });

        // 假结局退场
        ctx.timer(360, function () {
          if (!fake) return;
          fake.classList.add('lv18-gone');
        });
        ctx.timer(820, function () {
          if (fake && fake.parentNode) fake.parentNode.removeChild(fake);
          fake = null;
          jarEl = null;
          restartBtn = null;
          target = null;
          fakeTitle = null;
          NF.Audio.play('sparkle', { volume: 0.8 });
          var c = OS.center(el);
          NF.FX.burst(c.x, c.y, {
            count: 30, colors: ['#ffc94d', '#ffe08a', '#7ef0c0', '#ffffff'], speed: 8, gravity: 0.16
          });
        });
        ctx.timer(1080, function () {
          if (completed) ctx.complete({ el: el, delay: 1400 });
        });
      }

      /* ============================================================
         幽灵演示
         ============================================================ */

      function demoForFolder() {
        return [
          { move: '[data-t="created-folder"]', dur: 420 },
          { highlight: '[data-t="created-folder"]', dur: 540 },
          { drag: { from: '[data-t="created-folder"]', to: '[data-t="rewind-target"]', dur: 1000, after: 200 } },
          { highlight: '[data-t="rewind-target"]', dur: 620 }
        ];
      }

      function demoForDialog() {
        return [
          { move: [Math.round(VW / 2), Math.round(VH * 0.5)], dur: 340 },
          { keys: 'Ctrl+Shift+F', dur: 1050 },
          { do: function () { if (!dlg || dlg.closed) openNameDialog(); } },
          { wait: 420 },
          { move: '[data-t="dialog-ok"]', dur: 520 },
          { highlight: '[data-t="dialog-ok"]', dur: 720 }
        ];
      }

      var demo = async function () {
        if (completed) return;
        try {
          await NF.Ghost.play(folder ? demoForFolder() : demoForDialog());
        } catch (err) { /* 演示失败无所谓 */ }
      };
      ctx.hint(demo);

      /* ============================================================
         输入 & 清理
         ============================================================ */

      ctx.on(window, 'keydown', function (e) {
        if (completed) return;
        if (!OS.matchCombo(e, 'Ctrl+Shift+F')) return;
        e.preventDefault();
        e.stopPropagation();
        openNameDialog();
      });

      ctx.onCleanup(function () {
        clearTimeout(tauntTimer);
        if (drag) { try { drag.destroy(); } catch (e) { /* 忽略 */ } drag = null; }
        if (dlg && !dlg.closed) {
          try { dlg.close('cleanup'); } catch (e2) { /* 忽略 */ }
        }
        dlg = null;
        if (fake && fake.parentNode) fake.remove();
        fake = null;
        folder = null;
      });

      buildFakeEnding();
      NF.Audio.play('giggle', { volume: 0.4 });
      ctx.qa('l18', ctx.root);
    }
  });
})();

</script>

   3. 把正确 token 拖进对应槽（吸附），错误 token → 槽抖动 + error + 弹回；
   4. 两个槽都正确后运行键亮起，点击运行 → 绿色扫描线 + createFolder() 色块滚过 → 生成文件夹。 */

        ' border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);',
        ' transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,border-color .25s ease,filter .2s ease,opacity .2s ease;}',
        '.lv19-token:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 18px 30px rgba(0,0,0,.46);}',
        '.lv19-token svg{width:52px;height:52px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}',
        '.lv19-token-folder{border-color:rgba(255,201,77,.42);background:linear-gradient(160deg,rgba(255,201,77,.16),rgba(255,176,32,.04));}',
        '.lv19-token-play{border-color:rgba(126,240,192,.44);background:linear-gradient(160deg,rgba(126,240,192,.15),rgba(52,211,153,.04));}',
        '.lv19-token-bug{border-color:rgba(138,108,255,.5);background:linear-gradient(160deg,rgba(138,108,255,.18),rgba(91,63,208,.05));}',

        '.lv19-tray::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;',
