<script data-src="js/levels/l04.js">
/* js/levels/l04.js */
/* 第 4 关：命名地狱 —— 输入框被塞爆，确定键还会躲鼠标 */
(function () {
  'use strict';
  var ID = 4;
  var OS = NF.OS;

  NF.Game.registerLevel({
    id: ID,
    icon: 'fileText',
    init: function (ctx) {
      var created = false;
      var dlg = null;

      ctx.style([
        '.nf-btn.is-ready{box-shadow:0 0 0 4px rgba(91,124,250,.22),0 6px 18px rgba(70,105,245,.45);}',
        '.lv4-dialog .nf-helper span{transition:color .2s ease;}',
        '.lv4-dialog .nf-helper.is-ok span{color:#1f9e6e;}',
        '.lv4-spark{position:absolute;pointer-events:none;font-size:22px;}'
      ].join(''));

      var helpIcon = null;

      function prankValue() {
        var s = '';
        for (var i = 0; i < 140; i++) s += '新建文件夹';
        return s;
      }

      function openDialog() {
        if (created || dlg) return;
        OS.closeMenus();
        dlg = OS.nameDialog({
          title: '新建文件夹',
          icon: 'folder',
          value: prankValue(),
          selectAll: false,
          caretAtEnd: true,
          okDisabled: true,
          okDodge: true,
          helperIcon: 'warning',
          helperText: '名称过长',
          className: 'lv4-dialog',
          onSubmit: function (name) {
            var v = String(name || '').trim();
            if (!v || v.length > 24) {
              dlg.shake();
              NF.Audio.play('deny');
              return false;
            }
            dlg = null;
            createFolder(v);
            return true;
          },
          onClose: function () { dlg = null; }
        });

        var input = dlg.input;
        var okBtn = dlg.okBtn;
        var helper = dlg.body.querySelector('.nf-helper');
        helpIcon = helper ? helper.querySelector('.nf-ico-wrap') : null;

        function validate() {
          var v = input.value.trim();
          var valid = v.length > 0 && v.length <= 24;
          dlg.setOkEnabled(valid);
          okBtn.style.transform = '';
          okBtn._dodgeOff = valid;
          if (helper) {
            helper.classList.toggle('is-ok', valid);
            var span = helper.querySelector('span:not(.nf-ico-wrap)');
            if (span) span.textContent = valid ? '' : '名称过长';
            if (helpIcon) helpIcon.innerHTML = NF.icons.svg(valid ? 'check' : 'warning');
          }
          input.classList.toggle('is-bad', !valid && input.value.length > 0);
          if (valid && !input.dataset.wasValid) {
            input.dataset.wasValid = '1';
            NF.Audio.play('sparkle', { volume: 0.55 });
            NF.FX.burst(OS.center(okBtn).x, OS.center(okBtn).y, { count: 14, colors: ['#5b7cfa', '#9cb0ff', '#ffffff'], speed: 5, gravity: 0.14 });
          }
          if (!valid) delete input.dataset.wasValid;
        }
        input.addEventListener('input', validate);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !okBtn.disabled) {
            e.preventDefault();
            okBtn.click();
          }
        });
        setTimeout(function () {
          validate();
          if (input.value.length > 40) {
            // 输入框巨大内容，光标停在最后
            try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {}
          }
        }, 120);
      }

      function createFolder(name) {
        if (created) return;
        created = true;
        OS.closeMenus();
        OS.closeDialogs();
        var x = innerWidth / 2 - 38, y = innerHeight * 0.38 - 26;
        var folder = ctx.createdFolder({ x: x, y: y, label: name, testid: 'created-folder' });
        NF.Audio.play('pop');
        NF.FX.burst(x + 38, y + 32, { count: 24, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#8a6cff'], speed: 7, gravity: 0.2 });
        ctx.complete({ el: folder });
      }

      function items() {
        return [
          { id: 'view', label: '查看', icon: 'eye', disabled: true },
          { id: 'refresh', label: '刷新', icon: 'restart', onSelect: function () { NF.Audio.play('whoosh'); } },
          { separator: true },
          {
            id: 'new', label: '新建', icon: 'folder',
            submenu: [
              { id: 'folder', label: '文件夹', icon: 'folder', testid: 'menu-item-folder', onSelect: function () { openDialog(); } },
              { id: 'text', label: '文本文档', icon: 'fileText', onSelect: function () { NF.Audio.play('deny'); } }
            ]
          }
        ];
      }

      ctx.on(ctx.root, 'contextmenu', function (e) {
        e.preventDefault();
        if (created) return;
        OS.closeMenus();
        OS.menu({ x: e.clientX, y: e.clientY, items: items() });
      });

      ctx.on(window, 'keydown', function (e) {
        if (created) return;
        if (OS.matchCombo(e, 'Ctrl+Shift+F')) {
          e.preventDefault();
          openDialog();
        }
      });

      // ~~~~~~~~ 演示：打开对话框 → 全选删除 → 输入 → 回车 ~~~~~~~~
      ctx.hint = async function () {
        OS.closeMenus();
        if (dlg) { dlg.close('hint'); dlg = null; }
        var cx = innerWidth / 2, cy = innerHeight / 2;
        await NF.Ghost.play([
          { move: [cx, cy + 140], dur: 350 },
          { keys: 'Ctrl+Shift+F', dur: 900 },
          { do: function () { openDialog(); } },
          { wait: 350 },
          { move: '[data-t="name-input"]', dur: 500 },
          { highlight: '[data-t="name-input"]', dur: 700 },
          { keys: 'Ctrl+A', dur: 800 },
          { keys: 'Backspace', dur: 700 },
          { type: '我的文件夹', dur: 900 },
          { wait: 200 },
          { move: '[data-t="dialog-ok"]', dur: 550 },
          { highlight: '[data-t="dialog-ok"]', dur: 700 },
          {
            click: 'left', target: '[data-t="dialog-ok"]', after: 500,
            do: function () { if (dlg) { dlg.close('hint'); dlg = null; } }
          }
        ]);
      };
    }
  });
})();

</script>
<script data-src="js/levels/l05.js">
/* js/levels/l05.js */
/* 第 5 关：拖拽合体 —— 两张纸拖到一起合成文件夹，再把第三张拖进去 */
(function () {
  'use strict';
  var ID = 5;
  var OS = NF.OS;
  var demo = null;

  NF.Game.registerLevel({
    id: ID,
    icon: 'file',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);
      var busy = false;          // 合成动画期间锁住拖拽
      var merged = false;        // 前两张纸是否已合成文件夹
      var completed = false;
      var folderEl = null;
      var glowEl = null;
      var pieces = [];           // { el, id, x, y, rot, locked, handle }
      var demoFolder = null;

      ctx.style([
        /* 纸张 */
        '.lv5-paper{position:absolute;width:112px;height:136px;border-radius:10px;z-index:3;cursor:grab;',
        ' touch-action:none;transform-origin:50% 72%;will-change:left,top,transform;padding:13px 12px 9px;',
        ' background:linear-gradient(158deg,#ffffff,#eef2fc 62%,#e2e9f8);',
        ' box-shadow:0 14px 26px rgba(0,0,0,.38),0 3px 8px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.85);',
        ' display:flex;flex-direction:column;align-items:center;gap:8px;}',
        '.lv5-paper::before{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 17px 17px 0;',
        ' border-color:transparent #cdd8ee transparent transparent;border-radius:0 10px 0 0;}',
        '.lv5-paper .lv5-paper-icon{width:38px;height:38px;flex:0 0 auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.16));}',
        '.lv5-paper .lv5-paper-lines{width:74%;display:flex;flex-direction:column;gap:5px;}',
        '.lv5-paper .lv5-paper-lines i{display:block;height:3px;border-radius:2px;background:#c9d4ea;}',
        '.lv5-paper .lv5-paper-lines i:nth-child(2){width:86%;}',
        '.lv5-paper .lv5-paper-lines i:nth-child(3){width:58%;background:#dbe3f5;}',
        '.lv5-paper .lv5-paper-label{font-size:10.5px;color:#5a6484;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
        '.lv5-paper:hover{filter:drop-shadow(0 16px 22px rgba(0,0,0,.45)) brightness(1.03);}',
        '.lv5-paper.lv5-settle{transition:left .32s cubic-bezier(.34,1.56,.64,1),top .32s cubic-bezier(.34,1.56,.64,1),',
        ' transform .32s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;}',
        '.lv5-paper.lv5-vanish{transform:scale(.28) rotate(16deg)!important;opacity:0!important;}',
        '.lv5-paper.lv5-target{filter:drop-shadow(0 0 18px rgba(255,212,92,.9)) brightness(1.06);}',
        '.lv5-paper.lv5-target::after{content:"";position:absolute;inset:-9px;border:2px dashed rgba(255,212,92,.9);',
        ' border-radius:15px;animation:lv5-ring 1s ease-in-out infinite;pointer-events:none;}',
        '@keyframes lv5-ring{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:1;transform:scale(1.035);}}',
        '.lv5-paper.lv5-remaining{animation:lv5-remain 1.7s ease-in-out infinite;}',
        '@keyframes lv5-remain{0%,100%{filter:drop-shadow(0 14px 22px rgba(0,0,0,.38));}',
        ' 50%{filter:drop-shadow(0 0 16px rgba(255,212,92,.6)) drop-shadow(0 14px 22px rgba(0,0,0,.38));}}',
        /* 合成后的文件夹 */
        '.lv5-merged-folder{width:84px;z-index:6;transition:width .42s cubic-bezier(.34,1.56,.64,1),filter .35s ease;',
        ' filter:drop-shadow(0 0 20px rgba(255,201,77,.5)) drop-shadow(0 12px 18px rgba(0,0,0,.45));}',
        '.lv5-merged-folder.lv5-full{width:108px;filter:drop-shadow(0 0 32px rgba(255,212,92,.85)) drop-shadow(0 16px 22px rgba(0,0,0,.5));}',
        '.lv5-merged-folder.lv5-target{filter:drop-shadow(0 0 28px rgba(255,212,92,.95)) brightness(1.06);}',
        '.lv5-folder-glow{position:absolute;width:150px;height:120px;border-radius:50%;pointer-events:none;z-index:2;',
        ' background:radial-gradient(circle,rgba(255,201,77,.4),rgba(255,201,77,.08) 55%,transparent 72%);',
        ' filter:blur(7px);animation:lv5-glow 2.2s ease-in-out infinite alternate;}',
        '@keyframes lv5-glow{from{opacity:.35;transform:scale(.88);}to{opacity:.85;transform:scale(1.12);}}',
        '.lv5-flash{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;z-index:9;',
        ' background:radial-gradient(circle,rgba(255,244,205,.95),rgba(255,201,77,.35) 46%,transparent 72%);opacity:0;}',
        '.lv5-flash.on{animation:lv5-flash .55s ease-out;}',
        '@keyframes lv5-flash{0%{opacity:0;transform:scale(.18);}22%{opacity:1;}100%{opacity:0;transform:scale(2.15);}}',
        /* 演示用的半透明文件夹 */
        '.lv5-demo-folder{position:absolute;width:84px;z-index:40;pointer-events:none;opacity:.72;',
        ' filter:drop-shadow(0 0 20px rgba(255,212,92,.85)) brightness(1.06);animation:lv5-demo-pulse 1.4s ease-in-out infinite;}',
        '.lv5-demo-folder svg{display:block;width:100%;height:auto;animation:lv5-demo-bob 1.1s ease-in-out infinite alternate;}',
        '.lv5-demo-folder.lv5-demo-pop{animation:lv5-demo-pop .3s ease-out forwards;}',
        '@keyframes lv5-demo-pulse{0%,100%{opacity:.55;}50%{opacity:.95;}}',
        '@keyframes lv5-demo-bob{from{transform:translateY(0) rotate(-2deg);}to{transform:translateY(-6px) rotate(2deg);}}',
        '@keyframes lv5-demo-pop{0%{opacity:.8;transform:scale(1);}100%{opacity:0;transform:scale(1.5);}}'
      ].join(''));

      function rootRect() { return ctx.root.getBoundingClientRect(); }

      function flashAt(x, y) {
        var f = document.createElement('div');
        f.className = 'lv5-flash';
        f.style.left = x + 'px';
        f.style.top = y + 'px';
        ctx.root.appendChild(f);
        void f.offsetWidth;
        f.classList.add('on');
        ctx.timer(650, function () { if (f.parentNode) f.remove(); });
      }

      function makePaper(cfg) {
        var el = document.createElement('div');
        el.className = 'lv5-paper';
        el.dataset.t = 'file';
        el.dataset.id = cfg.id;
        el.style.left = cfg.x + 'px';
        el.style.top = cfg.y + 'px';
        el.style.transform = 'rotate(' + cfg.rot + 'deg)';

        var icon = document.createElement('div');
        icon.className = 'lv5-paper-icon';
        icon.innerHTML = NF.icons.svg(cfg.icon);
        el.appendChild(icon);

        var lines = document.createElement('div');
        lines.className = 'lv5-paper-lines';
        lines.innerHTML = '<i></i><i></i><i></i>';
        el.appendChild(lines);

        var label = document.createElement('div');
        label.className = 'lv5-paper-label';
        label.textContent = cfg.label;
        el.appendChild(label);

        ctx.root.appendChild(el);

        var p = { el: el, id: cfg.id, x: cfg.x, y: cfg.y, rot: cfg.rot, locked: false, handle: null };
        p.handle = OS.makeDraggable(el, {
          threshold: 3,
          canStart: function () { return !p.locked && !busy && !completed; },
          onStart: function () {
            el.classList.remove('lv5-remaining');
            NF.Audio.play('hover', { volume: 0.2 });
          },
          onMove: function (e, st) {
            el.style.left = (p.x + st.dx) + 'px';
            el.style.top = (p.y + st.dy) + 'px';
            var tilt = OS.clamp(st.dx * 0.045, -11, 11);
            el.style.transform = 'rotate(' + (p.rot + tilt).toFixed(2) + 'deg)';
            updateHints(p);
          },
          onEnd: function () {
            clearTargets();
            if (completed || p.locked) return;
            handleDrop(p);
          }
        });
        pieces.push(p);
        return p;
      }

      /* 当前可吸附的目标（另一个文件 / 已合成的文件夹） */
      function findTarget(p) {
        var list = [];
        if (merged) {
          if (folderEl) list.push({ type: 'folder', el: folderEl });
        } else {
          pieces.forEach(function (o) {
            if (o !== p && !o.locked) list.push({ type: 'file', el: o.el, piece: o });
          });
        }
        var pc = OS.center(p.el);
        var best = null;
        var bestScore = -1;
        list.forEach(function (t) {
          var tc = OS.center(t.el);
          var d = Math.hypot(pc.x - tc.x, pc.y - tc.y);
          var ov = OS.overlapRatio(p.el, t.el);
          if (ov < 0.18 && d > 100) return;
          var score = ov + (1 - Math.min(1, d / 300));
          if (score > bestScore) { bestScore = score; best = t; }
        });
        return best;
      }

      function clearTargets() {
        pieces.forEach(function (p) { p.el.classList.remove('lv5-target'); });
        if (folderEl) folderEl.classList.remove('lv5-target');
      }

      function updateHints(p) {
        clearTargets();
        var t = findTarget(p);
        if (t) t.el.classList.add('lv5-target');
      }

      function snapBack(p) {
        p.el.classList.add('lv5-settle');
        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
        p.el.style.transform = 'rotate(' + p.rot + 'deg)';
        NF.Audio.play('thud', { volume: 0.35 });
        var c = OS.center(p.el);
        NF.FX.dust(c.x, c.y);
        ctx.timer(380, function () { p.el.classList.remove('lv5-settle'); });
      }

      function spawnFolder(x, y) {
        folderEl = ctx.createdFolder({ x: x, y: y, label: '新建文件夹', testid: 'merge-folder' });
        folderEl.classList.add('lv5-merged-folder');
        folderEl.dataset.qa = 'l05-folder';

        glowEl = document.createElement('div');
        glowEl.className = 'lv5-folder-glow';
        glowEl.style.left = (x - 33) + 'px';
        glowEl.style.top = (y - 16) + 'px';
        ctx.root.appendChild(glowEl);

        NF.Audio.play('pop');
        var c = OS.center(folderEl);
        NF.FX.sparkle(c.x, c.y, '#ffd45c');
        NF.FX.burst(c.x, c.y, {
          count: 18, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 5, gravity: 0.18
        });
      }

      /* 两张纸拖到一起：向中点收拢、闪一下，变成文件夹 */
      function mergeTwo(a, b) {
        busy = true;
        a.locked = true;
        b.locked = true;
        clearTargets();

        var ra = OS.rect(a.el);
        var rb = OS.rect(b.el);
        var r = rootRect();
        var mx = (ra.left + ra.width / 2 + rb.left + rb.width / 2) / 2;
        var my = (ra.top + ra.height / 2 + rb.top + rb.height / 2) / 2;
        var fl = Math.round(mx - r.left - 42);
        var ft = Math.round(my - r.top - 40);

        a.el.classList.add('lv5-settle');
        b.el.classList.add('lv5-settle');
        a.el.style.left = (rb.left - r.left) + 'px';
        a.el.style.top = (rb.top - r.top) + 'px';
        a.el.style.transform = 'rotate(0deg) scale(.94)';
        b.el.style.transform = 'rotate(0deg) scale(.94)';
        NF.Audio.play('paper', { volume: 0.6 });

        ctx.timer(210, function () {
          NF.Audio.play('snap');
          a.el.classList.add('lv5-vanish');
          b.el.classList.add('lv5-vanish');
          flashAt(mx, my);
          NF.FX.burst(mx, my, {
            count: 24, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#8a6cff'], speed: 7, gravity: 0.22
          });
          spawnFolder(fl, ft);
          ctx.timer(440, function () {
            if (a.el.parentNode) a.el.remove();
            if (b.el.parentNode) b.el.remove();
            pieces = pieces.filter(function (o) { return o !== a && o !== b; });
            merged = true;
            busy = false;
            var rest = pieces[0];
            if (rest) rest.el.classList.add('lv5-remaining');
          });
        });
      }

      /* 第三张纸拖进文件夹：文件夹长大，过关 */
      function absorbFile(p) {
        busy = true;
        p.locked = true;
        clearTargets();
        var r = rootRect();
        var fc = OS.center(folderEl);

        p.el.classList.add('lv5-settle');
        p.el.style.left = (fc.x - r.left - 56) + 'px';
        p.el.style.top = (fc.y - r.top - 68) + 'px';
        p.el.style.transform = 'rotate(0deg) scale(.62)';
        NF.Audio.play('snap');

        ctx.timer(250, function () {
          p.el.classList.add('lv5-vanish');
          folderEl.classList.add('lv5-full');
          flashAt(fc.x - r.left, fc.y - r.top);
          NF.Audio.play('pop');
          NF.Audio.play('sparkle', { volume: 0.6 });
          NF.FX.burst(fc.x, fc.y, {
            count: 30, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#ff6ba9'], speed: 9, gravity: 0.22
          });
          NF.FX.ripple(fc.x, fc.y, { color: 'rgba(255,212,92,.9)', radius: 80 });
          if (glowEl) glowEl.style.opacity = '1';
          ctx.timer(340, function () {
            if (p.el.parentNode) p.el.remove();
            pieces = pieces.filter(function (o) { return o !== p; });
            completed = true;
            ctx.complete({ el: folderEl });
          });
        });
      }

      function handleDrop(p) {
        if (pieces.indexOf(p) < 0) return;
        var t = findTarget(p);
        if (!t) { snapBack(p); return; }
        if (t.type === 'file') mergeTwo(p, t.piece);
        else absorbFile(p);
      }

      /* ---------------- 幽灵演示 ---------------- */
      function showDemoFolder(a, b) {
        var ca = OS.center(a.el);
        var cb = OS.center(b.el);
        var r = rootRect();
        var mx = (ca.x + cb.x) / 2 - r.left;
        var my = (ca.y + cb.y) / 2 - r.top;
        demoFolder = document.createElement('div');
        demoFolder.className = 'lv5-demo-folder';
        demoFolder.style.left = (mx - 42) + 'px';
        demoFolder.style.top = (my - 40) + 'px';
        demoFolder.innerHTML = NF.icons.svg('folder');
        ctx.root.appendChild(demoFolder);
        NF.Audio.play('sparkle', { volume: 0.35 });
      }

      function popDemoFolder() {
        if (!demoFolder) return;
        var el = demoFolder;
        demoFolder = null;
        var c = OS.center(el);
        el.classList.add('lv5-demo-pop');
        NF.Audio.play('pop', { volume: 0.65 });
        NF.FX.burst(c.x, c.y, {
          count: 20, colors: ['#ffc94d', '#ffe08a', '#ffffff'], speed: 6, gravity: 0.2
        });
        ctx.timer(320, function () { if (el.parentNode) el.remove(); });
      }

      function clearDemo() {
        if (demoFolder && demoFolder.parentNode) demoFolder.remove();
        demoFolder = null;
      }
      ctx.onCleanup(clearDemo);

      /* 兜底：NF.Ghost.cancel() 在 sleep 中打断时 play() 可能永远不 resolve，
         所以玩家一动手就立刻清掉演示元素，不依赖 Promise 的 finally。 */
      function onUserInterrupt() {
        if (demoFolder) clearDemo();
      }
      ctx.on(document, 'pointerdown', onUserInterrupt, true);
      ctx.on(document, 'keydown', onUserInterrupt, true);

      demo = async function () {
        clearDemo();
        if (completed) return;
        var steps = [];
        if (!merged) {
          var a = pieces[0], b = pieces[1], c = pieces[2];
          if (!a || !b || !c) return;
          var pa = OS.center(a.el);
          steps = [
            { move: [pa.x, pa.y], dur: 420 },
            { highlight: a.el, dur: 640 },
            { drag: { from: a.el, to: b.el, dur: 950, after: 240 } },
            { do: function () { showDemoFolder(a, b); } },
            { wait: 220 },
            { highlight: '.lv5-demo-folder', dur: 620 },
            { drag: { from: c.el, to: '.lv5-demo-folder', dur: 900, after: 260 } },
            { do: popDemoFolder },
            { wait: 260 }
          ];
        } else if (folderEl && pieces[0]) {
          steps = [
            { highlight: folderEl, dur: 650 },
            { drag: { from: pieces[0].el, to: folderEl, dur: 950, after: 260 } },
            { highlight: folderEl, dur: 520 }
          ];
        } else {
          return;
        }
        try { await NF.Ghost.play(steps); } finally { clearDemo(); }
      };
      ctx.hint(demo);

      /* ---------------- 摆桌面 ---------------- */
      var bx = W / 2;
      var by = H * 0.5;
      makePaper({ id: 'a', icon: 'fileText', label: '报告.txt', x: bx - 330 + OS.rand(-14, 14), y: by - 150 + OS.rand(-12, 12), rot: -7 });
      makePaper({ id: 'b', icon: 'fileImage', label: '照片.png', x: bx - 20 + OS.rand(-14, 14), y: by - 10 + OS.rand(-12, 12), rot: 5 });
      makePaper({ id: 'c', icon: 'fileText', label: '清单.txt', x: bx + 240 + OS.rand(-14, 14), y: by - 185 + OS.rand(-12, 12), rot: -3 });

      ctx.timer(1000, function () {
        if (merged || completed || !pieces[1]) return;
        var c = OS.center(pieces[1].el);
        NF.FX.ripple(c.x, c.y, { color: 'rgba(255,212,92,.3)', radius: 70 });
      });

      ctx.qa('l05', ctx.root);
    }
  });
})();

</script>
<script data-src="js/levels/l06.js">
/* js/levels/l06.js */
﻿/* 第 6 关：碎片重组 —— 4 块碎片拖回虚线轮廓拼成文件夹；拼好后一角崩飞，再追回来 */
(function () {
  'use strict';
  var ID = 6;
  var OS = NF.OS;
  var demo = null;

  var HOME_W = 280;
  var HOME_H = 200;

  /* 四块碎片（容器 0..1 占比坐标，四块刚好拼满整张文件夹图） */
  var PIECES = [
    [[0, 0], [0.5, 0], [0.57, 0.2], [0.5, 0.4], [0.58, 0.55], [0, 0.55]],
    [[0.5, 0], [1, 0], [1, 0.55], [0.58, 0.55], [0.5, 0.4], [0.57, 0.2]],
    [[0, 0.55], [0.58, 0.55], [0.64, 0.75], [0.5, 1], [0, 1]],
    [[0.58, 0.55], [1, 0.55], [1, 1], [0.5, 1], [0.64, 0.75]]
  ];
  /* 崩掉的一角 + 拼图上缺那一角时的保留区域 */
  var CORNER = [[0.06, 0], [0.34, 0], [0.26, 0.30], [0.06, 0.22]];
  var KEEP = [[0.34, 0], [1, 0], [1, 1], [0, 1], [0, 0], [0.06, 0], [0.06, 0.22], [0.26, 0.30]];

  function pct(poly) {
    return 'polygon(' + poly.map(function (p) {
      return (p[0] * 100).toFixed(2) + '% ' + (p[1] * 100).toFixed(2) + '%';
    }).join(',') + ')';
  }

  function svgPts(poly) {
    return poly.map(function (p) {
      return (p[0] * 140).toFixed(2) + ',' + (p[1] * 100).toFixed(2);
    }).join(' ');
  }

  function centroid(poly) {
    var x = 0, y = 0;
    poly.forEach(function (p) { x += p[0]; y += p[1]; });
    return [x / poly.length, y / poly.length];
  }

  /* 碎片/拼图共用的文件夹贴图（fill 用纯色，避免重复 id 的渐变） */
  function folderMarkup() {
    return '<svg class="lv6-face" viewBox="0 0 140 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path fill="#d99512" d="M12 34 Q12 24 22 24 H50 L62 34 H118 Q128 34 128 44 V86 Q128 96 118 96 H22 Q12 96 12 86 Z"/>' +
      '<path fill="#ffc94d" d="M12 42 Q12 34 20 34 H120 Q128 34 128 42 V86 Q128 96 118 96 H22 Q12 96 12 86 Z"/>' +
      '<path fill="#ffe08a" opacity=".85" d="M12 42 Q12 34 20 34 H120 Q128 34 128 42 V50 H12 Z"/>' +
      '<path d="M22 60 H116" stroke="#ffe9a8" stroke-width="1.6" opacity=".32" stroke-linecap="round"/>' +
      '<path d="M22 70 H96" stroke="#f0a81b" stroke-width="1.4" opacity=".35" stroke-linecap="round"/>' +
      '</svg>';
  }

  NF.Game.registerLevel({
    id: ID,
    icon: 'shard',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var homeX = Math.round((W - HOME_W) / 2);
      var homeY = Math.round(H * 0.46 - HOME_H / 2);

      var shards = [];
      var placedCount = 0;
      var fused = false;
      var busy = false;
      var completed = false;
      var cornerReady = false;
      var cornerHandle = null;
      var demoCornerEl = null;

      var cornerOffset = {
        x: Math.round(Math.min(320, W * 0.24)),
        y: Math.round(Math.min(180, H * 0.22)),
        rot: 14
      };

      var layouts = [
        { ox: -Math.min(330, W * 0.30), oy: -Math.min(160, H * 0.22), rot: -16, fd: '-0.4s' },
        { ox: Math.min(320, W * 0.30), oy: -Math.min(170, H * 0.23), rot: 13, fd: '-1.2s' },
        { ox: -Math.min(340, W * 0.31), oy: Math.min(150, H * 0.21), rot: 9, fd: '-2.0s' },
        { ox: Math.min(330, W * 0.30), oy: Math.min(160, H * 0.22), rot: -11, fd: '-0.8s' }
      ];

      ctx.style([
        '.lv6-halo{position:absolute;border-radius:50%;pointer-events:none;z-index:1;filter:blur(14px);',
        ' background:radial-gradient(ellipse,rgba(255,201,77,.2),transparent 70%);animation:lv6-halo 3.2s ease-in-out infinite alternate;}',
        '@keyframes lv6-halo{from{opacity:.35;transform:scale(.9);}to{opacity:.85;transform:scale(1.1);}}',
        '.lv6-outline{position:absolute;z-index:2;pointer-events:none;opacity:1;transition:opacity .35s ease;}',
        '.lv6-outline svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}',
        '.lv6-outline .lv6-dash{fill:rgba(255,201,77,.05);stroke:rgba(255,224,138,.8);stroke-width:1.6;',
        ' stroke-dasharray:6 5;animation:lv6-dash 16s linear infinite;transition:stroke .2s ease,stroke-width .2s ease;}',
        '@keyframes lv6-dash{to{stroke-dashoffset:-220;}}',
        '.lv6-outline.lv6-armed .lv6-dash{stroke:rgba(255,244,200,1);stroke-width:2.4;}',
        '.lv6-outline.lv6-outline-done{opacity:0;}',
        '.lv6-outline-glow{position:absolute;inset:-12%;border-radius:24px;',
        ' background:radial-gradient(ellipse at center,rgba(255,201,77,.16),transparent 66%);',
        ' animation:lv6-breathe 2.4s ease-in-out infinite alternate;}',
        '@keyframes lv6-breathe{from{opacity:.35;}to{opacity:.9;}}',
        /* 碎片 */
        '.lv6-shard{position:absolute;z-index:4;cursor:grab;touch-action:none;will-change:transform;',
        ' transform:translate(var(--ox,0px),var(--oy,0px)) rotate(var(--rot,0deg));}',
        '.lv6-shard.lv6-idle{animation:lv6-float 3.8s ease-in-out infinite alternate;animation-delay:var(--fd,0s);}',
        '@keyframes lv6-float{',
        ' 0%{transform:translate(var(--ox,0px),var(--oy,0px)) rotate(var(--rot,0deg));}',
        ' 100%{transform:translate(calc(var(--ox,0px) + 6px),calc(var(--oy,0px) - 8px)) rotate(calc(var(--rot,0deg) + 2.4deg));}}',
        '.lv6-shard .lv6-face,.lv6-body .lv6-face,.lv6-corner .lv6-face{position:absolute;inset:0;width:100%;height:100%;display:block;}',
        '.lv6-shard .lv6-edge,.lv6-corner .lv6-edge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}',
        '.lv6-shard:hover{filter:brightness(1.1);}',
        '.lv6-shard.lv6-held{filter:brightness(1.16);}',
        '.lv6-shard.lv6-near{filter:drop-shadow(0 0 16px rgba(255,212,92,.9)) brightness(1.14);}',
        '.lv6-shard.lv6-settle{transition:transform .3s cubic-bezier(.34,1.56,.64,1);}',
        '.lv6-shard.lv6-placed{pointer-events:none;animation:lv6-place-flash .55s ease;}',
        '@keyframes lv6-place-flash{0%{filter:brightness(2.2);}100%{filter:brightness(1);}}',
        '.lv6-shard.lv6-gone{opacity:0;transition:opacity .28s ease;}',
        /* 拼好的文件夹 */
        '.lv6-body{position:absolute;z-index:5;opacity:0;pointer-events:none;}',
        '.lv6-body.lv6-on{opacity:1;transition:opacity .26s ease;animation:lv6-body-pop .55s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv6-body-pop{0%{transform:scale(.93);filter:brightness(1.9);}60%{transform:scale(1.02);}',
        ' 100%{transform:scale(1);filter:brightness(1);}}',
        '.lv6-label{position:absolute;text-align:center;font-size:13px;letter-spacing:.08em;color:#ffe9a8;',
        ' opacity:0;transition:opacity .4s ease;text-shadow:0 2px 10px rgba(0,0,0,.7);z-index:6;pointer-events:none;}',
        '.lv6-label.lv6-on{opacity:1;}',
        /* 崩掉的一角 */
        '.lv6-corner{position:absolute;z-index:7;opacity:0;pointer-events:none;will-change:transform;',
        ' transform:translate(0px,0px) rotate(0deg);}',
        '.lv6-corner.lv6-corner-live{pointer-events:auto;cursor:grab;',
        ' animation:lv6-corner-glow 1.5s ease-in-out infinite alternate;}',
        '@keyframes lv6-corner-glow{from{filter:drop-shadow(0 0 4px rgba(255,212,92,.45));}',
        ' to{filter:drop-shadow(0 0 18px rgba(255,212,92,.95)) brightness(1.12);}}',
        '.lv6-corner.lv6-held{filter:brightness(1.2);}',
        '.lv6-corner.lv6-settle{transition:transform .3s cubic-bezier(.34,1.56,.64,1);}',
        '.lv6-demo-corner{pointer-events:none;z-index:9;}',
        '.lv6-flash{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;',
        ' pointer-events:none;z-index:10;background:radial-gradient(circle,rgba(255,244,205,.95),rgba(255,201,77,.35) 46%,transparent 72%);',
        ' opacity:0;}',
        '.lv6-flash.on{animation:lv6-flash .55s ease-out;}',
        '@keyframes lv6-flash{0%{opacity:0;transform:scale(.18);}22%{opacity:1;}100%{opacity:0;transform:scale(2.2);}}'
      ].join(''));

      function setClip(el, poly) {
        el.style.clipPath = pct(poly);
        el.style.webkitClipPath = pct(poly);
      }

      function pieceScreen(el, poly) {
        var r = OS.rect(el);
        var c = centroid(poly);
        return { x: r.left + c[0] * r.width, y: r.top + c[1] * r.height };
      }

      function homeCornerPoint() {
        var r = OS.rect(outlineEl);
        var c = centroid(CORNER);
        return { x: r.left + c[0] * r.width, y: r.top + c[1] * r.height };
      }

      function cornerScreen() { return pieceScreen(cornerEl, CORNER); }

      function flashAt(x, y) {
        var f = document.createElement('div');
        f.className = 'lv6-flash';
        f.style.left = x + 'px';
        f.style.top = y + 'px';
        ctx.root.appendChild(f);
        void f.offsetWidth;
        f.classList.add('on');
        ctx.timer(650, function () { if (f.parentNode) f.remove(); });
      }

      /* ---------------- 场景 ---------------- */
      var halo = document.createElement('div');
      halo.className = 'lv6-halo';
      halo.style.left = (homeX + HOME_W / 2 - 200) + 'px';
      halo.style.top = (homeY + HOME_H / 2 - 160) + 'px';
      halo.style.width = '400px';
      halo.style.height = '320px';
      ctx.root.appendChild(halo);

      var outlineEl = document.createElement('div');
      outlineEl.className = 'lv6-outline';
      outlineEl.dataset.t = 'outline';
      outlineEl.style.left = homeX + 'px';
      outlineEl.style.top = homeY + 'px';
      outlineEl.style.width = HOME_W + 'px';
      outlineEl.style.height = HOME_H + 'px';
      outlineEl.innerHTML = '<div class="lv6-outline-glow"></div>' +
        '<svg viewBox="0 0 140 100" preserveAspectRatio="none">' +
        '<path class="lv6-dash" d="M12 32 Q12 22 22 22 H50 L62 32 H120 Q128 32 128 40 V86 Q128 96 118 96 H22 Q12 96 12 86 Z"/>' +
        '</svg>';
      ctx.root.appendChild(outlineEl);

      var bodyEl = document.createElement('div');
      bodyEl.className = 'lv6-body';
      bodyEl.style.left = homeX + 'px';
      bodyEl.style.top = homeY + 'px';
      bodyEl.style.width = HOME_W + 'px';
      bodyEl.style.height = HOME_H + 'px';
      bodyEl.innerHTML = folderMarkup();
      ctx.root.appendChild(bodyEl);
      bodyEl.dataset.qa = 'l06-body';

      var labelEl = document.createElement('div');
      labelEl.className = 'lv6-label';
      labelEl.style.left = homeX + 'px';
      labelEl.style.top = (homeY + HOME_H + 8) + 'px';
      labelEl.style.width = HOME_W + 'px';
      labelEl.textContent = '新建文件夹';
      ctx.root.appendChild(labelEl);

      var cornerEl = document.createElement('div');
      cornerEl.className = 'lv6-corner';
      cornerEl.dataset.t = 'corner-shard';
      cornerEl.style.left = homeX + 'px';
      cornerEl.style.top = homeY + 'px';
      cornerEl.style.width = HOME_W + 'px';
      cornerEl.style.height = HOME_H + 'px';
      setClip(cornerEl, CORNER);
      cornerEl.innerHTML = folderMarkup() +
        '<svg class="lv6-edge" viewBox="0 0 140 100" preserveAspectRatio="none">' +
        '<polygon points="' + svgPts(CORNER) + '" fill="none" stroke="rgba(255,240,190,.9)" stroke-width="1.2" stroke-linejoin="round"/>' +
        '</svg>';
      ctx.root.appendChild(cornerEl);

      /* ---------------- 碎片 ---------------- */
      function makeShard(idx) {
        var lay = layouts[idx];
        var el = document.createElement('div');
        el.className = 'lv6-shard';
        el.dataset.t = 'shard';
        el.dataset.idx = String(idx);
        el.style.left = homeX + 'px';
        el.style.top = homeY + 'px';
        el.style.width = HOME_W + 'px';
        el.style.height = HOME_H + 'px';
        el.style.setProperty('--ox', lay.ox + 'px');
        el.style.setProperty('--oy', lay.oy + 'px');
        el.style.setProperty('--rot', lay.rot + 'deg');
        el.style.setProperty('--fd', lay.fd);
        setClip(el, PIECES[idx]);
        el.innerHTML = folderMarkup() +
          '<svg class="lv6-edge" viewBox="0 0 140 100" preserveAspectRatio="none">' +
          '<polygon points="' + svgPts(PIECES[idx]) + '" fill="none" stroke="rgba(255,240,190,.38)" stroke-width="1" stroke-linejoin="round"/>' +
          '</svg>';
        if (!OS.isReducedMotion()) el.classList.add('lv6-idle');
        ctx.root.appendChild(el);

        var p = {
          el: el, idx: idx, ox: lay.ox, oy: lay.oy, rot: lay.rot,
          placed: false, handle: null
        };
        p.handle = OS.makeDraggable(el, {
          threshold: 3,
          canStart: function () { return !p.placed && !busy && !completed; },
          onStart: function () {
            el.classList.remove('lv6-idle');
            el.classList.add('lv6-held');
            NF.Audio.play('hover', { volume: 0.2 });
          },
          onMove: function (e, st) {
            var rx = p.ox + st.dx;
            var ry = p.oy + st.dy;
            var tilt = OS.clamp(st.dx * 0.02, -6, 6);
            el.style.transform = 'translate(' + rx + 'px,' + ry + 'px) rotate(' + (p.rot + tilt).toFixed(2) + 'deg)';
            var near = Math.hypot(rx, ry) < 140;
            el.classList.toggle('lv6-near', near);
            outlineEl.classList.toggle('lv6-armed', near);
          },
          onEnd: function (e, st) {
            el.classList.remove('lv6-held', 'lv6-near');
            outlineEl.classList.remove('lv6-armed');
            if (p.placed || completed) return;
            var rx = p.ox + st.dx;
            var ry = p.oy + st.dy;
            if (Math.hypot(rx, ry) < 110) snapShard(p);
            else failShard(p);
          }
        });
        shards.push(p);
      }

      for (var i = 0; i < 4; i++) makeShard(i);

      function snapShard(p) {
        p.placed = true;
        if (p.handle) p.handle.locked = true;
        p.el.classList.remove('lv6-idle', 'lv6-near');
        p.el.classList.add('lv6-settle');
        p.el.style.transform = 'translate(0px,0px) rotate(0deg)';
        NF.Audio.play('snap');
        var pt = pieceScreen(p.el, PIECES[p.idx]);
        NF.FX.sparkle(pt.x, pt.y, '#ffd45c');
        NF.FX.burst(pt.x, pt.y, {
          count: 14, colors: ['#ffc94d', '#ffe9a8', '#ffffff'], speed: 5, gravity: 0.18
        });
        ctx.timer(330, function () {
          p.el.classList.remove('lv6-settle');
          p.el.classList.add('lv6-placed');
          placedCount++;
          if (placedCount >= 4 && !fused) fuse();
        });
      }

      function failShard(p) {
        p.el.classList.add('lv6-settle');
        p.el.style.transform = 'translate(' + p.ox + 'px,' + p.oy + 'px) rotate(' + p.rot + 'deg)';
        NF.Audio.play('thud', { volume: 0.3 });
        NF.Audio.play('giggle', { volume: 0.16 });
        var c = OS.center(p.el);
        NF.FX.dust(c.x, c.y);
        ctx.timer(340, function () {
          p.el.classList.remove('lv6-settle');
          if (!OS.isReducedMotion()) p.el.classList.add('lv6-idle');
        });
      }

      /* ---------------- 拼合 / 崩角 ---------------- */
      function fuse() {
        fused = true;
        busy = true;
        outlineEl.classList.add('lv6-outline-done');
        bodyEl.classList.add('lv6-on');
        labelEl.classList.add('lv6-on');
        var oc = OS.center(bodyEl);
        NF.Audio.play('sparkle', { volume: 0.9 });
        NF.FX.burst(oc.x, oc.y, {
          count: 30, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#8a6cff'], speed: 8, gravity: 0.2
        });
        NF.FX.ripple(oc.x, oc.y, { color: 'rgba(255,212,92,.9)', radius: 80 });
        ctx.timer(240, function () {
          shards.forEach(function (p) { p.el.classList.add('lv6-gone'); });
        });
        ctx.timer(640, function () {
          if (!completed) popCorner();
        });
      }

      function popCorner() {
        bodyEl.style.clipPath = pct(KEEP);
        bodyEl.style.webkitClipPath = pct(KEEP);
        cornerEl.style.opacity = '1';
        cornerEl.style.transform = 'translate(0px,0px) rotate(0deg)';
        void cornerEl.offsetWidth;
        ctx.timer(60, function () {
          NF.Audio.play('boing', { volume: 0.85 });
          NF.Audio.play('paper', { volume: 0.35 });
          cornerEl.style.transition = 'transform .72s cubic-bezier(.18,.72,.26,1)';
          cornerEl.style.transform = 'translate(' + cornerOffset.x + 'px,' + cornerOffset.y + 'px) rotate(' + cornerOffset.rot + 'deg)';
        });
        ctx.timer(840, function () {
          if (completed) return;
          cornerEl.style.transition = '';
          cornerEl.classList.add('lv6-corner-live');
          cornerReady = true;
          busy = false;
          enableCornerDrag();
          NF.Audio.play('sparkle', { volume: 0.45 });
          var cp = cornerScreen();
          NF.FX.sparkle(cp.x, cp.y, '#ffd45c');
        });
      }

      function enableCornerDrag() {
        if (cornerHandle || completed) return;
        cornerHandle = OS.makeDraggable(cornerEl, {
          threshold: 3,
          canStart: function () { return !completed; },
          onStart: function () {
            cornerEl.style.transition = 'none';
            cornerEl.classList.add('lv6-held');
            NF.Audio.play('hover', { volume: 0.2 });
          },
          onMove: function (e, st) {
            var tilt = OS.clamp(st.dx * 0.03, -10, 10);
            cornerEl.style.transform = 'translate(' + (cornerOffset.x + st.dx) + 'px,' +
              (cornerOffset.y + st.dy) + 'px) rotate(' + (cornerOffset.rot + tilt).toFixed(2) + 'deg)';
          },
          onEnd: function (e, st) {
            cornerEl.style.transition = '';
            cornerEl.classList.remove('lv6-held');
            if (completed) return;
            var rx = cornerOffset.x + st.dx;
            var ry = cornerOffset.y + st.dy;
            if (Math.hypot(rx, ry) < 115) snapCorner();
            else failCorner();
          }
        });
      }

      function snapCorner() {
        if (completed) return;
        completed = true;
        if (cornerHandle) cornerHandle.locked = true;
        cornerEl.classList.remove('lv6-corner-live');
        cornerEl.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
        cornerEl.style.transform = 'translate(0px,0px) rotate(0deg)';
        NF.Audio.play('snap');
        ctx.timer(300, function () {
          bodyEl.style.clipPath = '';
          bodyEl.style.webkitClipPath = '';
          cornerEl.style.opacity = '0';
          var oc = OS.center(bodyEl);
          flashAt(oc.x, oc.y);
          NF.FX.flash('rgba(255,238,180,.4)', 220);
          NF.FX.burst(oc.x, oc.y, {
            count: 34, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#ff6ba9'], speed: 9, gravity: 0.22
          });
          NF.FX.sparkle(oc.x, oc.y, '#fff3b0');
          NF.FX.ripple(oc.x, oc.y, { color: 'rgba(255,212,92,.9)', radius: 90 });
          NF.Audio.play('sparkle');
          ctx.timer(320, function () { ctx.complete({ el: bodyEl }); });
        });
      }

      function failCorner() {
        cornerEl.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
        cornerEl.style.transform = 'translate(' + cornerOffset.x + 'px,' + cornerOffset.y + 'px) rotate(' + cornerOffset.rot + 'deg)';
        NF.Audio.play('thud', { volume: 0.3 });
        var cp = cornerScreen();
        NF.FX.dust(cp.x, cp.y);
        ctx.timer(420, function () { cornerEl.style.transition = ''; });
      }

      /* ---------------- 幽灵演示 ---------------- */
      function showDemoCorner() {
        if (demoCornerEl) return;
        demoCornerEl = document.createElement('div');
        demoCornerEl.className = 'lv6-corner lv6-demo-corner';
        demoCornerEl.style.left = homeX + 'px';
        demoCornerEl.style.top = homeY + 'px';
        demoCornerEl.style.width = HOME_W + 'px';
        demoCornerEl.style.height = HOME_H + 'px';
        setClip(demoCornerEl, CORNER);
        demoCornerEl.innerHTML = folderMarkup();
        demoCornerEl.style.opacity = '0';
        ctx.root.appendChild(demoCornerEl);
        void demoCornerEl.offsetWidth;
        demoCornerEl.style.opacity = '0.72';
        demoCornerEl.style.transition = 'transform .6s cubic-bezier(.2,.72,.3,1),opacity .3s ease';
        demoCornerEl.style.transform = 'translate(' + cornerOffset.x + 'px,' + cornerOffset.y + 'px) rotate(' + cornerOffset.rot + 'deg)';
        NF.Audio.play('boing', { volume: 0.35 });
      }

      function returnDemoCorner() {
        if (!demoCornerEl) return;
        demoCornerEl.style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1),opacity .4s ease';
        demoCornerEl.style.transform = 'translate(0px,0px) rotate(0deg)';
        NF.Audio.play('snap', { volume: 0.5 });
        NF.Audio.play('sparkle', { volume: 0.4 });
        var hp = homeCornerPoint();
        NF.FX.sparkle(hp.x, hp.y, '#ffd45c');
      }

      function clearDemoCorner() {
        if (demoCornerEl && demoCornerEl.parentNode) demoCornerEl.remove();
        demoCornerEl = null;
      }
      ctx.onCleanup(clearDemoCorner);

      /* 兜底：NF.Ghost.cancel() 在 sleep 中打断时 play() 可能永远不 resolve，
         所以玩家一动手就立刻清掉演示碎片，不依赖 Promise 的 finally。 */
      function onUserInterrupt() {
        if (demoCornerEl) clearDemoCorner();
      }
      ctx.on(document, 'pointerdown', onUserInterrupt, true);
      ctx.on(document, 'keydown', onUserInterrupt, true);

      demo = async function () {
        clearDemoCorner();
        if (completed) return;
        var steps = [];
        var or = OS.rect(outlineEl);
        var oc = { x: or.left + or.width / 2, y: or.top + or.height / 2 };
        var hp = homeCornerPoint();

        var unplaced = shards.filter(function (p) { return !p.placed; });
        if (unplaced.length) {
          var p = unplaced[0];
          var fp = pieceScreen(p.el, PIECES[p.idx]);
          steps.push({ move: [fp.x, fp.y], dur: 420 });
          steps.push({ highlight: p.el, dur: 600 });
          steps.push({ drag: { from: [fp.x, fp.y], to: [oc.x, oc.y], dur: 980, after: 240 } });
          steps.push({ ripple: [oc.x, oc.y] });
          steps.push({ highlight: '[data-t="outline"]', dur: 650 });
        }

        if (cornerReady) {
          var cp = cornerScreen();
          steps.push({ move: [cp.x, cp.y], dur: 380 });
          steps.push({ drag: { from: [cp.x, cp.y], to: [hp.x, hp.y], dur: 980, after: 240 } });
        } else {
          steps.push({ do: showDemoCorner });
          steps.push({ wait: 620 });
          steps.push({ drag: { from: '.lv6-demo-corner', to: [hp.x, hp.y], dur: 900, after: 220 } });
          steps.push({ do: returnDemoCorner });
          steps.push({ wait: 440 });
          steps.push({ do: clearDemoCorner });
        }

        try { await NF.Ghost.play(steps); } finally { clearDemoCorner(); }
      };
      ctx.hint(demo);

      ctx.qa('l06', ctx.root);
    }
  });
})();


</script>
<script data-src="js/levels/l07.js">
/* js/levels/l07.js */
/* 第 7 关：命令行 —— 双击终端图标开窗，敲 mkdir 建文件夹；输错只有滑稽报错 */
(function () {
  'use strict';
  var ID = 7;
  var OS = NF.OS;
  var demo = null;

  /* 终端提示符（仿 Windows 路径） */
  var PROMPT = 'C:\\Users\\你\\Desktop>';

  NF.Game.registerLevel({
    id: ID,
    icon: 'terminal',
    hint: function () { if (demo) return demo(); },
    init: function (ctx) {
      var W = ctx.root.clientWidth || innerWidth;
      var H = ctx.root.clientHeight || (innerHeight - 58);

      var win = null;
      var input = null;
      var logEl = null;
      var promptline = null;
      var history = [];
      var histIndex = 0;
      var created = false;
      var completed = false;

      ctx.style([
        '.lv7-term-win{background:rgba(8,13,24,.965);border-color:rgba(126,240,192,.22);}',
        '.lv7-term-win.is-active{border-color:rgba(126,240,192,.42);',
        ' box-shadow:0 0 0 1px rgba(126,240,192,.14),0 28px 70px rgba(0,0,0,.55);}',
        '.lv7-term{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:10px 12px 8px;',
        ' font-family:var(--mono);font-size:13px;color:#cfe8d8;letter-spacing:.01em;',
        ' background:radial-gradient(ellipse at 28% 0%,rgba(126,240,192,.06),transparent 62%),#080d18;}',
        '.lv7-log{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;line-height:1.55;',
        ' white-space:pre-wrap;word-break:break-word;padding-right:4px;scrollbar-width:thin;}',
        '.lv7-log::-webkit-scrollbar{width:6px;}',
        '.lv7-log::-webkit-scrollbar-thumb{background:rgba(126,240,192,.25);border-radius:3px;}',
        '.lv7-line{white-space:pre-wrap;}',
        '.lv7-line.lv7-cmd{color:#e6f2ff;}',
        '.lv7-line.ok{color:#7ef0c0;text-shadow:0 0 10px rgba(126,240,192,.35);}',
        '.lv7-line.err{color:#ff8198;}',
        '.lv7-line.art{color:#ff6b8a;opacity:.9;line-height:1.32;}',
        '.lv7-line.dim{color:rgba(160,190,180,.55);}',
        '.lv7-line.out{color:rgba(200,225,215,.85);}',
        '.lv7-ps{color:#7ef0c0;white-space:pre;flex:0 0 auto;}',
        '.lv7-promptline{display:flex;align-items:center;gap:6px;padding-top:5px;flex:0 0 auto;',
        ' border-top:1px solid rgba(126,240,192,.12);}',
        '.lv7-input{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;',
        ' color:#e8fff2;font-family:var(--mono);font-size:13px;line-height:1.5;padding:2px 0;',
        ' caret-color:#7ef0c0;user-select:text;-webkit-user-select:text;letter-spacing:.02em;}',
        '.lv7-input::selection{background:rgba(126,240,192,.3);}',
        '.lv7-created{filter:drop-shadow(0 0 22px rgba(126,240,192,.55)) drop-shadow(0 12px 18px rgba(0,0,0,.45));}',
        '@keyframes lv7-shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}',
        ' 40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}'
      ].join(''));

      /* ---------------- 终端窗口 ---------------- */
      function focusInput() {
        if (!input) return;
        try { input.focus({ preventScroll: true }); } catch (e) {
          try { input.focus(); } catch (e2) { /* 忽略 */ }
        }
      }

      function scrollLog() {
        if (!logEl) return;
        try { logEl.scrollTop = logEl.scrollHeight; } catch (e) { /* 忽略 */ }
      }

      function trimLog() {
        if (!logEl) return;
        while (logEl.children.length > 80) logEl.removeChild(logEl.firstElementChild);
      }

      function appendLine(text, cls) {
        if (!logEl) return null;
        var line = document.createElement('div');
        line.className = 'lv7-line' + (cls ? ' ' + cls : '');
        line.textContent = text;
        logEl.appendChild(line);
        trimLog();
        scrollLog();
        return line;
      }

      function echoCommand(cmd) {
        if (!logEl) return;
        var line = document.createElement('div');
        line.className = 'lv7-line lv7-cmd';
        var ps = document.createElement('span');
        ps.className = 'lv7-ps';
        ps.textContent = PROMPT;
        line.appendChild(ps);
        line.appendChild(document.createTextNode(' ' + cmd));
        logEl.appendChild(line);
        trimLog();
        scrollLog();
      }

      function printError(msg) {
        appendLine(msg, 'err');
        appendLine('  (\\_/)\n  ( •_•)  < 咦？\n  /   > >', 'err art');
        if (win && !win.closed) win.shake();
      }

      function printDir() {
        appendLine(' 目录: C:\\Users\\你\\Desktop', 'dim');
        appendLine(' 2026/10/21  10:46    <DIR>          新建文件夹', 'out');
        appendLine(' 2026/10/21  10:46                 0 文档.txt', 'out');
        NF.Audio.play('giggle', { volume: 0.28 });
      }

      function mkdirSuccess(name) {
        created = true;
        appendLine('已创建文件夹: ' + name, 'ok');
        NF.Audio.play('sparkle', { volume: 0.65 });
        ctx.timer(330, function () {
          // 即使玩家在这 0.33 秒内把窗口关了，也照样把文件夹放到桌面上（避免卡死）
          var wr = (win && !win.closed)
            ? OS.rect(win.el)
            : { left: Math.round(W * 0.5), top: Math.round(H * 0.4) };
          var rr = OS.rect(ctx.root);
          var fx = OS.clamp(Math.round(wr.left - rr.left - 172), 20, Math.max(20, W - 140));
          var fy = OS.clamp(Math.round(wr.top - rr.top + 74), 20, Math.max(20, H - 160));
          var folder = ctx.createdFolder({
            x: fx, y: fy, label: name.slice(0, 24), testid: 'created-folder'
          });
          folder.classList.add('lv7-created');
          folder.dataset.qa = 'l07-folder';
          NF.Audio.play('pop');
          var c = OS.center(folder);
          NF.FX.burst(c.x, c.y, {
            count: 26, colors: ['#ffc94d', '#ffe08a', '#ffffff', '#7ef0c0'], speed: 7, gravity: 0.22
          });
          NF.FX.sparkle(c.x, c.y, '#7ef0c0');
          ctx.timer(640, function () {
            if (completed) return;
            completed = true;
            ctx.complete({ el: folder });
          });
        });
      }

      function runCommand(raw) {
        if (!input) return;
        var text = String(raw == null ? '' : raw).replace(/\s+$/, '');
        if (!text.trim()) return;
        echoCommand(text);
        history.push(text);
        histIndex = history.length;
        var cmd = text.trim();

        var m = cmd.match(/^mkdir(?:\s+([\s\S]+))?$/i);
        if (m) {
          var name = (m[1] || '').trim().replace(/^["']+|["']+$/g, '').trim();
          if (!name) { printError('mkdir: 缺少名称'); return; }
          if (created) { printError('文件夹已存在'); return; }
          mkdirSuccess(name);
          return;
        }
        if (/^(cls|clear)$/i.test(cmd)) { logEl.innerHTML = ''; NF.Audio.play('whoosh', { volume: 0.35 }); return; }
        if (/^(dir|ls)$/i.test(cmd)) { printDir(); return; }
        if (/^exit$/i.test(cmd)) {
          appendLine('bye', 'dim');
          var w = win;
          setTimeout(function () { try { if (w && !w.closed) w.close(); } catch (e) { /* 忽略 */ } }, 220);
          return;
        }
        var em = cmd.match(/^echo\s+([\s\S]*)$/i);
        if (em) { appendLine(em[1], 'out'); return; }
        printError("'" + cmd.split(/\s+/)[0] + "' 不是可执行命令");
      }

      function onInputKey(e) {
        if (!input) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          NF.Audio.play('enter', { volume: 0.5 });
          var raw = input.value;
          input.value = '';
          runCommand(raw);
          focusInput();
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!history.length) return;
          histIndex = Math.max(0, histIndex - 1);
          input.value = history[histIndex] || '';
          try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {}
          return;
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!history.length) return;
          histIndex = Math.min(history.length, histIndex + 1);
          input.value = history[histIndex] || '';
          try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {}
          return;
        }
        if (e.key === 'Tab') { e.preventDefault(); }
      }

      function openTerminal() {
        if (win && !win.closed) {
          win.focus();
          focusInput();
          return;
        }
        var winW = Math.min(640, Math.max(420, W - 80));
        var winH = Math.min(392, Math.max(260, H - 110));
        var wx = OS.clamp(Math.round(W * 0.5 - winW * 0.4), 16, Math.max(16, W - winW - 16));
        var wy = OS.clamp(Math.round(H * 0.16), 12, Math.max(12, H - winH - 16));

        var wrap = document.createElement('div');
        wrap.className = 'lv7-term';
        var log = document.createElement('div');
        log.className = 'lv7-log';
        log.dataset.t = 'terminal-log';
        var pl = document.createElement('div');
        pl.className = 'lv7-promptline';
        var ps = document.createElement('span');
        ps.className = 'lv7-ps';
        ps.textContent = PROMPT;
        var inp = document.createElement('input');
        inp.className = 'lv7-input';
        inp.dataset.t = 'terminal-input';
        inp.type = 'text';
        inp.spellcheck = false;
        inp.autocomplete = 'off';
        inp.setAttribute('autocapitalize', 'off');
        inp.setAttribute('aria-label', '终端输入');
        pl.appendChild(ps);
        pl.appendChild(inp);
        wrap.appendChild(log);
        wrap.appendChild(pl);

        win = OS.window({
          title: '终端',
          icon: 'terminal',
          x: wx,
          y: wy,
          w: winW,
          h: winH,
          body: wrap,
          testid: 'terminal-window',
          className: 'lv7-term-win',
          onClose: function () {
            win = null;
            input = null;
            logEl = null;
            promptline = null;
          }
        });
        input = win.el.querySelector('[data-t="terminal-input"]');
        logEl = win.el.querySelector('.lv7-log');
        promptline = win.el.querySelector('.lv7-promptline');
        ctx.on(win.el, 'pointerdown', function (e) {
          if (e.target && e.target.closest && e.target.closest('.nf-win-close')) return;
          setTimeout(focusInput, 0);
        });
        ctx.on(input, 'keydown', onInputKey);
        setTimeout(focusInput, 80);
        NF.Audio.play('open', { volume: 0.4 });
      }

      function closeTerminal() {
        if (win && !win.closed) win.close();
      }

      /* Esc 关窗（焦点不在输入框时也能关） */
      ctx.on(document, 'keydown', function (e) {
        if (!win || win.closed) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          closeTerminal();
        }
      });

      /* ---------------- 桌面图标 ---------------- */
      OS.icon({
        icon: 'terminal',
        label: '终端',
        x: 64,
        y: 54,
        testid: 'terminal-icon',
        onDblClick: openTerminal
      });

      ctx.on(ctx.root, 'contextmenu', function (e) { e.preventDefault(); });

      /* ---------------- 幽灵演示：双击图标 → 打字 → 回车 ---------------- */
      demo = async function () {
        if (completed) return;
        var steps = [
          { move: '[data-t="terminal-icon"]', dur: 620 },
          { highlight: '[data-t="terminal-icon"]', dur: 700 },
          { click: 'left', target: '[data-t="terminal-icon"]', after: 90 },
          {
            click: 'left', target: '[data-t="terminal-icon"]', after: 140,
            do: function () { if (!win || win.closed) openTerminal(); else focusInput(); }
          },
          { wait: 480 },
          { move: '[data-t="terminal-input"]', dur: 720 },
          { highlight: '[data-t="terminal-input"]', dur: 720 },
          { type: 'mkdir abc' },
          { keys: 'Enter', dur: 900 },
          { wait: 340 }
        ];
        try { await NF.Ghost.play(steps); } finally { /* 终端保持打开，玩家可以直接输入 */ }
      };
      ctx.hint(demo);

      ctx.timer(1100, function () {
        if (completed || win) return;
        NF.FX.ripple(112, 106, { color: 'rgba(126,240,192,.28)', radius: 60 });
      });

      ctx.qa('l07', ctx.root);
    }
  });
})();

        '.lv8-shadow{position:absolute;left:50%;bottom:-46px;width:260px;height:44px;margin-left:-130px;border-radius:50%;',

        ' border:2px solid rgba(255,246,210,.85);',
        ' background:linear-gradient(150deg,rgba(255,232,150,.96),rgba(255,201,77,.84) 48%,rgba(233,164,30,.92));',
        ' box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 44px rgba(255,201,77,.35),inset 0 0 30px rgba(255,255,255,.4);',
        ' transform:perspective(1000px) rotateY(-20deg) rotateX(8deg) translateZ(30px);',

        ' 0 30px 64px rgba(0,0,0,.5),inset 0 0 34px rgba(255,255,255,.5);}',
        '.lv8-front.lv8-settle{transition:left .34s cubic-bezier(.34,1.56,.64,1),top .34s cubic-bezier(.34,1.56,.64,1);}',
        '.lv8-front.lv8-settle .lv8-front-face{transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease;',
        ' transform:perspective(1000px) rotateY(0deg) rotateX(0deg) translateZ(4px) scale(.97);',
        ' box-shadow:0 0 0 2px rgba(255,248,220,.7),0 0 50px rgba(255,212,92,.55),0 20px 46px rgba(0,0,0,.45),',
        ' inset 0 0 26px rgba(255,255,255,.45);}',
        '.lv8-front-ico{position:absolute;left:50%;top:26px;width:88px;height:88px;margin-left:-44px;opacity:.32;',
        ' filter:drop-shadow(0 4px 8px rgba(120,70,0,.3));}',
        '.lv8-front-ico svg{display:block;width:100%;height:100%;}',
        '.lv8-front-label{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:16px;font-weight:800;',
        ' letter-spacing:.16em;color:rgba(90,52,0,.82);text-shadow:0 1px 0 rgba(255,250,220,.6);}',
        '.lv8-front-shine{position:absolute;inset:-30% -10%;',
        ' background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 47%,transparent 62%);',
        ' animation:lv8-shine 3.8s ease-in-out infinite;}',
        '@keyframes lv8-shine{0%{transform:translateX(-70%);}55%,100%{transform:translateX(70%);}}',
        /* 第二阶段的卡扣转盘 */
        '.lv8-dial{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;z-index:7;',
        ' pointer-events:none;opacity:0;transition:opacity .3s ease;}',
        '.lv8-dial.show{opacity:1;}',
        '.lv8-dial .lv8-dial-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,240,190,.5);',
        ' background:conic-gradient(from calc(var(--target) - 9deg),rgba(255,212,92,.55) 0 18deg,transparent 18deg 360deg);',
        ' box-shadow:0 0 30px rgba(0,0,0,.4),inset 0 0 24px rgba(120,70,0,.4);}',
        '.lv8-dial .lv8-dial-needle{position:absolute;left:50%;top:50%;width:6px;height:78px;margin:-78px 0 0 -3px;',
        ' transform-origin:50% 100%;transform:rotate(var(--angle,0deg));border-radius:3px;',
        ' background:linear-gradient(180deg,#fff8dc,#ffc94d);box-shadow:0 0 12px rgba(255,212,92,.9);transition:transform .16s ease-out;}',
        '.lv8-dial .lv8-dial-knob{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;',

        '.lv8-dial.is-aligned .lv8-dial-ring{border-color:rgba(126,240,192,.9);box-shadow:0 0 26px rgba(126,240,192,.45),inset 0 0 24px rgba(120,70,0,.4);}',
        '.lv8-stage.lv8-aligned .lv8-front-face{box-shadow:0 0 0 3px rgba(126,240,192,.9),0 0 70px rgba(126,240,192,.6),',
        ' 0 26px 60px rgba(0,0,0,.5),inset 0 0 34px rgba(255,255,255,.55);}',
        /* 第三阶段：长按 */
        '.lv8-hold{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;z-index:8;',
        ' pointer-events:none;opacity:0;transition:opacity .2s ease;}',
        '.lv8-hold.show{opacity:1;}',
        '.lv8-hold svg{width:100%;height:100%;transform:rotate(-90deg);}',
        '.lv8-hold .bg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:8;}',
        '.lv8-hold .fg{fill:none;stroke:#ffd45c;stroke-width:8;stroke-linecap:round;',
        ' stroke-dasharray:552;stroke-dashoffset:552;filter:drop-shadow(0 0 8px rgba(255,212,92,.8));}',
        '.lv8-hold-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;',
        ' color:rgba(255,246,210,.92);text-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;}',
        '.lv8-front.lv8-ajar{animation:lv8-ajar .5s cubic-bezier(.34,1.56,.64,1);}',
        '@keyframes lv8-ajar{0%,100%{transform:rotate(0);}35%{transform:rotate(-5deg) translateY(-8px);}70%{transform:rotate(2deg);}}',
        '.lv8-front.lv8-wobble .lv8-front-face{animation:lv8-wobble .45s ease-in-out infinite;}',
        '@keyframes lv8-wobble{0%,100%{transform:perspective(1000px) rotateY(-2deg) rotateX(1deg);}',
        ' 50%{transform:perspective(1000px) rotateY(2.5deg) rotateX(-1.4deg);}}',
        /* 收起飞走 */
        '.lv8-front.lv8-fly{animation:lv8-front-fly .72s cubic-bezier(.3,.7,.4,1) forwards;}',
        '@keyframes lv8-front-fly{0%{opacity:1;transform:translate3d(0,0,0) scale(1) rotateZ(0);}',
        ' 100%{opacity:0;transform:translate3d(0,-56px,0) scale(.12) rotateZ(18deg);}}',
        '.lv8-group.lv8-fly{animation:lv8-group-fly .78s cubic-bezier(.3,.7,.4,1) forwards;}',
        '@keyframes lv8-group-fly{0%{opacity:1;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1);}',
        ' 100%{opacity:0;transform:rotateX(calc(var(--rx,0deg) + 24deg)) rotateY(calc(var(--ry,0deg) + 46deg))',
        ' translateY(-70px) scale(.12);}}',
        '.lv8-pips{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:8px;z-index:9;}',
        '.lv8-pips i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.22);transition:all .3s ease;}',
        '.lv8-pips i.on{background:#ffd45c;box-shadow:0 0 10px rgba(255,212,92,.8);}'
      ].join(''));

      /* ---------------- 场景 ---------------- */
      stage = document.createElement('div');
      stage.className = 'lv8-stage';
