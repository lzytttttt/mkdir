<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171233">
<title>新建文件夹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffc94d' d='M6 14a6 6 0 0 1 6-6h14l6 7h20a6 6 0 0 1 6 6v27a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="os-wrap">
  <div id="os" data-t="desktop">
    <div id="wallpaper" aria-hidden="true">
      <div class="wp-glow wp-glow-a"></div>
      <div class="wp-glow wp-glow-b"></div>
      <div class="wp-glow wp-glow-c"></div>
      <div id="wp-folders"></div>
      <div class="wp-stars"></div>
      <div class="wp-grain"></div>
    </div>

    <div id="desktop-icons" data-t="desktop-icons"></div>
    <div id="level-root" data-t="level-root"></div>
    <div id="window-layer"></div>
    <div id="ui-layer"></div>

    <div id="taskbar" data-t="taskbar">
      <div class="tb-left">
        <button id="start-btn" class="tb-btn tb-start" data-t="start" title="开始" aria-label="开始">
          <span class="tb-start-logo"></span>
        </button>
        <div class="tb-apps" id="tb-apps">
          <button class="tb-btn tb-app" data-t="app-files" aria-label="文件">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#ffc94d" d="M6 13a6 6 0 0 1 6-6h14l6 7h20a6 6 0 0 1 6 6v6H6z"/><path fill="#ffb020" d="M6 20h52v29a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6z"/><path fill="#ffdc8a" d="M6 20h52v4H6z"/></svg>
          </button>
          <button class="tb-btn tb-app" data-t="app-terminal" aria-label="终端">
            <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="10" width="54" height="44" rx="7" fill="#252a4a"/><path d="M14 25l9 7-9 7" fill="none" stroke="#7ef0c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 40h18" stroke="#7ef0c0" stroke-width="5" stroke-linecap="round"/></svg>
          </button>
          <button class="tb-btn tb-app" data-t="app-trash" aria-label="回收站">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#b9c6e6" d="M18 20h28l-3 32a4 4 0 0 1-4 4H25a4 4 0 0 1-4-4z"/><path fill="#dbe5fb" d="M16 16h32v6H16z"/><path fill="#93a6d4" d="M26 28v20M32 28v20M38 28v20" stroke="#93a6d4" stroke-width="3" stroke-linecap="round"/><path fill="none" stroke="#b9c6e6" stroke-width="4" stroke-linecap="round" d="M27 12h10"/></svg>
          </button>
        </div>
      </div>
      <div class="tb-right">
        <button id="jar-btn" class="tb-btn tb-jar" data-t="jar" aria-label="文件夹罐" title="我的文件夹">
          <span class="jar-mini" id="jar-mini"></span>
          <span class="jar-count" id="jar-count">0</span>
        </button>
        <button id="hint-btn" class="tb-btn tb-hint" data-t="hint" aria-label="演示" title="再看一次">
          <span id="hint-icon"></span>
        </button>
        <button id="mute-btn" class="tb-btn tb-mute" data-t="mute" aria-label="声音" title="声音">
          <span id="mute-icon"></span>
        </button>
        <div class="tb-clock" id="clock" data-t="clock">
          <span id="clock-time">--:--</span>
          <span id="clock-date">----/--/--</span>
        </div>
      </div>
    </div>

    <div id="title-screen" data-t="title"></div>
    <div id="level-intro"></div>
    <div id="ending-layer"></div>
  </div>
</div>

<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div id="ghost-layer" aria-hidden="true"></div>
<div id="a11y-live" class="sr-only" aria-live="polite"></div>

<script src="js/core/icons.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/fx.js"></script>
<script src="js/core/ghost.js"></script>
<script src="js/core/os.js"></script>
<script src="js/core/game.js"></script>
<script src="js/levels/l01.js"></script>
<script src="js/levels/l02.js"></script>
<script src="js/levels/l03.js"></script>
<script src="js/levels/l04.js"></script>
<script src="js/levels/l05.js"></script>
<script src="js/levels/l06.js"></script>
<script src="js/levels/l07.js"></script>
<script src="js/levels/l08.js"></script>
<script src="js/levels/l09.js"></script>
<script src="js/levels/l10.js"></script>
<script src="js/levels/l11.js"></script>
<script src="js/levels/l12.js"></script>
<script src="js/levels/l13.js"></script>
<script src="js/levels/l14.js"></script>
<script src="js/levels/l15.js"></script>
<script src="js/levels/l16.js"></script>
<script src="js/levels/l17.js"></script>
<script src="js/levels/l18.js"></script>
<script src="js/levels/l19.js"></script>
<script src="js/levels/l20.js"></script>
<script src="js/main.js"></script>
</body>
</html>
